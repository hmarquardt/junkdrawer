<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ANDI THE RAT SLAYER</title>
    <meta
      name="description"
      content="One teacher. Five bosses. Zero patience. A playable Chicago alley action comedy."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐀</text></svg>"
    />
    <link rel="stylesheet" href="andi-the-rat-slayer/game.css?v=2026.11.23.2" />
    <script>
      if (location.protocol === "https:") {
        const tracker = document.createElement("script");
        tracker.src = "analytics-lite.js";
        tracker.dataset.siteId = "junkdrawer";
        tracker.dataset.api =
          "https://lab.aismallbizguru.com/api/analytics/collect";
        document.head.append(tracker);
      }
    </script>
  </head>
  <body>
    <header>
      <a href="index.html" class="brand"
        ><span class="mark" aria-hidden="true">Ⅲ</span> JUNK DRAWER
        <b>/</b> ARCADE</a
      >
      <nav>
        <button
          id="help"
          hidden
          aria-label="Current mission help"
          title="Current mission help"
        >
          ? <span>Help</span>
        </button>
        <button id="sound" aria-pressed="true">♫ &nbsp; SOUND ON</button
        ><button id="settings" aria-label="Settings">⚙</button>
      </nav>
    </header>
    <main>
      <section id="menu">
        <div class="poster">
          <div class="heroCopy">
            <div class="eyebrow"><i></i>CHICAGO, ILLINOIS</div>
            <h1><span>ANDI</span><small>THE RAT SLAYER</small></h1>
            <p>Sometimes justice has four prongs.</p>
            <div class="buttons">
              <button class="primary" id="start" disabled>
                ▶ &nbsp; Play campaign</button
              ><button class="secondary" id="how">Controls &nbsp; ↗</button>
            </div>
          </div>
        </div>
        <section class="lineup">
          <div class="sectionhead">
            <h2>THE BOSS LINEUP</h2>
            <span>CAMPAIGN INTEL</span>
          </div>
          <div id="files"></div>
        </section>
      </section>
      <section id="arena" hidden aria-label="Playable Chicago alley">
        <div id="view"></div>
        <div id="guideLayer" aria-hidden="true">
          <svg id="ranges" width="100%" height="100%"></svg>
          <div id="pins"></div>
          <b id="impact" hidden>✷ DIRECT HIT</b>
        </div>
        <canvas id="forkFx" aria-hidden="true"></canvas>
        <aside class="hud">
          <div>
            <small id="chapter"></small>
            <h2 id="boss"></h2>
            <progress id="bhealth" max="3"></progress>
          </div>
          <div class="right">
            <button id="pause">Ⅱ Pause</button><small>ANDI · PATIENCE</small
            ><progress id="health" max="5"></progress>
          </div>
        </aside>
        <div class="brief">
          <span id="forkReadout"></span><small id="missionGoal"></small
          ><b id="progress"></b><strong id="objective"></strong
          ><span id="instruction" role="status"></span
          ><b id="receipt" role="status"></b><em id="quote" role="status"></em>
        </div>
        <div class="touch">
          <div class="pad">
            <button data-key="arrowup" aria-label="Move up">▲</button
            ><button data-key="arrowleft" aria-label="Move left">◀</button
            ><button data-key="arrowdown" aria-label="Move down">▼</button
            ><button data-key="arrowright" aria-label="Move right">▶</button>
          </div>
          <div>
            <span id="forkButtons" hidden
              ><button id="forkToggle">Fork</button
              ><button id="touchAttack" aria-label="Attack">
                Attack
              </button></span
            ><button id="touchAction">Act</button
            ><button id="touchDodge">Dodge</button>
          </div>
        </div>
        <button id="finish" hidden>Skip finale →</button>
        <div id="sceneCard" hidden>
          <div>
            <small id="sceneTag"></small>
            <h2 id="sceneName"></h2>
            <p id="sceneSub"></p>
            <blockquote id="sceneLine"></blockquote>
            <div id="utensilFilm" hidden>
              <canvas
                id="reveal"
                width="780"
                height="160"
                aria-hidden="true"
              ></canvas
              ><small id="filmTag"></small><strong id="filmName"></strong
              ><span id="filmLine"></span>
            </div>
            <b id="award" hidden>★ FORK AROUND AND FIND OUT</b>
            <section id="missionBrief" hidden></section>
            <button class="primary" id="next"></button>
          </div>
        </div>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialogTitle">
      <div class="sectionhead">
        <h2 id="dialogTitle"></h2>
        <button id="close" aria-label="Close">×</button>
      </div>
      <div id="content"></div>
    </dialog>
    <!-- JUNKDRAWER_DEPLOY_FOOTER version="2026.11.23.2" bump="Update this version whenever this file changes in a commit." -->
    <footer
      data-junkdrawer-deploy-footer
      data-deploy-version="2026.11.23.2"
      style="
        margin: 1rem auto;
        padding: 1rem;
        text-align: center;
        color: #aaa99f;
        font:
          0.75rem/1.4 system-ui,
          sans-serif;
      "
    >
      &copy; 2026 Hank Marquardt · ANDI THE RAT SLAYER · version 2026.11.23.2
    </footer>
    <script src="andi-the-rat-slayer/three.min.js"></script>
    <script src="andi-the-rat-slayer/fork.js?v=2026.11.23.2"></script>
    <script src="andi-the-rat-slayer/fork-art.js?v=2026.11.23.2"></script>
    <script src="andi-the-rat-slayer/render.js?v=2026.11.23.2"></script>
    <script src="andi-the-rat-slayer/mission.js?v=2026.11.23.2"></script>
    <script src="andi-the-rat-slayer/game.js?v=2026.11.23.2"></script>
  </body>
</html>
