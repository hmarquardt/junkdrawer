<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Observatory</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ivory:#F5F0E6;--parchment:#EDE6D4;--card-bg:#FAF7F0;--cream:#FFF8EC;
  --navy:#1B2A4A;--navy-light:#2C3E6B;--navy-muted:#3D5078;
  --green:#2D5016;--green-light:#4A7A30;--green-muted:#5C8A45;
  --brass:#B8860B;--brass-light:#D4A843;--brass-dim:#9A7209;
  --copper:#B87333;--copper-light:#D49050;
  --text-primary:#1B2A4A;--text-secondary:#5C5040;--text-muted:#8B7D6B;
  --border-light:#D4C9B0;--border-medium:#B8A88A;--border-dark:#8B7D6B;
  --shadow:rgba(27,42,74,0.08);--shadow-strong:rgba(27,42,74,0.16);
  --red:#8B3A3A;--blue:#3A5A8B;
  --radius:6px;--radius-lg:10px;
  --font-heading:Georgia,'Times New Roman',serif;
  --font-body:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
  --font-mono:'SF Mono','Fira Code','Consolas',monospace;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);color:var(--text-primary);
  background:var(--ivory);
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(139,119,80,0.018) 3px,rgba(139,119,80,0.018) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(139,119,80,0.012) 3px,rgba(139,119,80,0.012) 4px);
  min-height:100vh;line-height:1.55;overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:700;line-height:1.2;color:var(--navy)}
h1{font-size:1.9rem;letter-spacing:-0.02em}
h2{font-size:1.4rem}
h3{font-size:1.15rem}
h4{font-size:1rem}
a{color:var(--navy-light);text-decoration:underline}
code,pre,.mono{font-family:var(--font-mono);font-size:0.88em}
button,input,select,textarea{font-family:var(--font-body);font-size:0.93rem}
::selection{background:var(--brass-light);color:var(--navy)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--parchment)}
::-webkit-scrollbar-thumb{background:var(--border-medium);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-dark)}
#app{max-width:1440px;margin:0 auto;padding:0 20px 40px}
header#app-header{
  padding:28px 0 18px;border-bottom:2px solid var(--border-medium);
  margin-bottom:0;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
}
header#app-header .title-group{flex:1}
header#app-header h1{margin:0;font-size:1.9rem;letter-spacing:-0.01em;color:var(--navy)}
header#app-header h1 .brass{color:var(--brass)}
header#app-header .tagline{font-size:0.85rem;color:var(--text-muted);font-style:italic;margin-top:2px;font-family:var(--font-heading)}
header#app-header .header-actions{display:flex;gap:8px;align-items:center}
nav#app-nav{
  display:flex;gap:0;border-bottom:1px solid var(--border-medium);
  padding:0;margin-bottom:20px;flex-wrap:wrap;
}
nav#app-nav button{
  background:none;border:none;border-bottom:3px solid transparent;
  padding:10px 18px 8px;cursor:pointer;font-family:var(--font-heading);
  font-size:0.95rem;color:var(--text-secondary);transition:all 0.2s;
  font-weight:600;position:relative;
}
nav#app-nav button:hover{color:var(--navy);background:rgba(184,134,11,0.06)}
nav#app-nav button.active{color:var(--navy);border-bottom-color:var(--brass)}
nav#app-nav button.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--ivory)}
nav#app-nav .nav-sep{width:1px;background:var(--border-light);margin:8px 6px}
nav#app-nav button.secondary{font-size:0.85rem;color:var(--text-muted);font-weight:500;font-family:var(--font-body)}
nav#app-nav button.secondary.active{color:var(--green);border-bottom-color:var(--green-light)}
main#app-main{min-height:60vh}
footer#app-footer{
  margin-top:30px;padding:12px 0;border-top:1px solid var(--border-light);
  font-size:0.8rem;color:var(--text-muted);display:flex;gap:20px;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 16px;
  border:1px solid var(--border-medium);border-radius:var(--radius);
  background:var(--card-bg);color:var(--text-primary);cursor:pointer;
  font-size:0.88rem;transition:all 0.15s;font-family:var(--font-body);
  white-space:nowrap;
}
.btn:hover{border-color:var(--brass);background:#FFF8EC;box-shadow:0 1px 4px var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn-primary{background:var(--navy);color:var(--ivory);border-color:var(--navy)}
.btn-primary:hover{background:var(--navy-light);border-color:var(--navy-light)}
.btn-accent{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn-accent:hover{background:var(--brass-dim);border-color:var(--brass-dim)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:var(--green-light);border-color:var(--green-light)}
.btn-sm{padding:4px 10px;font-size:0.8rem}
.btn-danger{color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:#FFF0F0}
.btn[disabled]{opacity:0.5;cursor:not-allowed;pointer-events:none}
.card{
  background:var(--card-bg);border:1px solid var(--border-light);
  border-radius:var(--radius-lg);padding:18px;box-shadow:0 1px 4px var(--shadow);
  position:relative;
}
.card:hover{box-shadow:0 3px 12px var(--shadow-strong)}
.card-title{font-family:var(--font-heading);font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:6px}
.panel{
  background:var(--card-bg);border:1px solid var(--border-light);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;
  box-shadow:0 1px 3px var(--shadow);
}
.panel-header{
  font-family:var(--font-heading);font-size:1rem;font-weight:700;
  color:var(--navy);margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;
}
.panel-header .badge{font-size:0.72rem;padding:2px 8px;border-radius:10px;font-family:var(--font-body);font-weight:600}
.badge-navy{background:var(--navy);color:var(--ivory)}
.badge-green{background:var(--green);color:#fff}
.badge-brass{background:var(--brass);color:#fff}
.badge-muted{background:var(--parchment);color:var(--text-secondary);border:1px solid var(--border-light)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flex-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flex-1{flex:1;min-width:0}
.layout-sidebar{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:400px}
.layout-sidebar .sidebar{overflow-y:auto;max-height:75vh}
.layout-sidebar .main-content{overflow-y:auto;max-height:75vh;padding-right:8px}
input[type="text"],input[type="url"],input[type="search"],textarea,select{
  width:100%;padding:7px 11px;border:1px solid var(--border-medium);
  border-radius:var(--radius);background:var(--cream);color:var(--text-primary);
  font-size:0.9rem;transition:border-color 0.15s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 2px rgba(184,134,11,0.15)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
label{display:block;font-size:0.82rem;color:var(--text-secondary);margin-bottom:3px;font-weight:600}
table.data-table{width:100%;border-collapse:collapse;font-size:0.85rem}
table.data-table th{
  background:var(--parchment);font-family:var(--font-heading);
  font-weight:700;text-align:left;padding:8px 10px;
  border-bottom:2px solid var(--border-medium);color:var(--navy);
  cursor:pointer;user-select:none;white-space:nowrap;position:relative;
}
table.data-table th:hover{background:var(--border-light)}
table.data-table th .type-badge{font-size:0.68rem;font-family:var(--font-body);font-weight:600;padding:1px 5px;border-radius:6px;margin-left:6px;vertical-align:middle}
table.data-table td{padding:6px 10px;border-bottom:1px solid var(--border-light);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.data-table tr:hover td{background:rgba(184,134,11,0.04)}
table.data-table tr.selected td{background:rgba(74,122,48,0.08)}
.stat-card{text-align:center;padding:14px;background:linear-gradient(135deg,var(--card-bg),var(--cream))}
.stat-card .stat-value{font-size:1.6rem;font-weight:700;color:var(--navy);font-family:var(--font-heading)}
.stat-card .stat-label{font-size:0.75rem;color:var(--text-muted);margin-top:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:0.75rem;font-weight:600;margin:2px;cursor:pointer;transition:all 0.15s}
.tag-navy{background:rgba(27,42,74,0.1);color:var(--navy);border:1px solid rgba(27,42,74,0.15)}
.tag-green{background:rgba(45,80,22,0.1);color:var(--green);border:1px solid rgba(45,80,22,0.15)}
.tag-brass{background:rgba(184,134,11,0.12);color:var(--brass-dim);border:1px solid rgba(184,134,11,0.18)}
.tag:hover{transform:scale(1.05)}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:var(--radius);font-size:0.88rem;box-shadow:0 4px 16px var(--shadow-strong);animation:toastIn 0.3s ease;max-width:380px;border:1px solid var(--border-light);background:var(--card-bg)}
.toast-success{border-left:4px solid var(--green)}
.toast-error{border-left:4px solid var(--red)}
.toast-info{border-left:4px solid var(--brass)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
.welcome{padding:40px 20px;text-align:center;max-width:800px;margin:60px auto}
.welcome h2{font-size:1.8rem;margin-bottom:8px}
.welcome p{color:var(--text-secondary);font-size:1.05rem;margin-bottom:30px;font-style:italic;font-family:var(--font-heading)}
.welcome-cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:30px}
.welcome-card{padding:32px 24px;border:2px solid var(--border-medium);border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--card-bg),var(--cream));cursor:pointer;transition:all 0.2s;text-align:left}
.welcome-card:hover{border-color:var(--brass);box-shadow:0 4px 20px var(--shadow-strong);transform:translateY(-2px)}
.welcome-card h3{font-size:1.2rem;margin-bottom:6px}
.welcome-card p{font-size:0.88rem;color:var(--text-secondary);line-height:1.5}
.welcome-card .icon{font-size:2rem;margin-bottom:10px;display:block}
.welcome-extras{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shelf-item{padding:12px;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--card-bg);cursor:pointer;transition:all 0.15s}
.shelf-item:hover{border-color:var(--brass);box-shadow:0 2px 8px var(--shadow)}
.shelf-item.active{border-color:var(--green);background:rgba(74,122,48,0.04)}
.shelf-item .item-name{font-family:var(--font-heading);font-weight:700;font-size:0.95rem;color:var(--navy);margin-bottom:4px}
.shelf-item .item-meta{font-size:0.78rem;color:var(--text-muted);line-height:1.4}
.chart-canvas{width:100%;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--cream);cursor:crosshair}
.map-canvas{width:100%;height:500px;border:1px solid var(--border-medium);border-radius:var(--radius);background:linear-gradient(135deg,#EDE6D4,#F5F0E6);cursor:grab}
.map-canvas:active{cursor:grabbing}
.field-detail{font-size:0.88rem;line-height:1.6}
.field-detail dt{font-weight:700;color:var(--navy);font-family:var(--font-heading)}
.field-detail dd{margin-bottom:6px;margin-left:0;color:var(--text-secondary)}
.note-editor{width:100%;min-height:350px;font-family:var(--font-mono);font-size:0.88rem;line-height:1.6;padding:12px}
.note-rendered{font-size:0.93rem;line-height:1.7;max-width:100%;overflow-wrap:break-word}
.note-rendered h1{font-size:1.4rem;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border-light)}
.note-rendered h2{font-size:1.2rem;margin:10px 0 5px}
.note-rendered h3{font-size:1.05rem;margin:8px 0 4px}
.note-rendered p{margin:6px 0}
.note-rendered ul,.note-rendered ol{margin:6px 0 6px 20px}
.note-rendered code{background:var(--parchment);padding:1px 4px;border-radius:3px;font-size:0.85em}
.note-rendered pre{background:var(--parchment);padding:10px;border-radius:var(--radius);overflow-x:auto;margin:8px 0}
.note-rendered pre code{background:none;padding:0}
.note-rendered blockquote{border-left:3px solid var(--brass);padding-left:12px;color:var(--text-secondary);margin:8px 0;font-style:italic}
.note-rendered a{color:var(--navy-light)}
.note-rendered .wiki-link{color:var(--brass);background:rgba(184,134,11,0.08);padding:0 4px;border-radius:3px;text-decoration:none}
.suggestion-card{padding:10px 14px;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--card-bg);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:10px}
.suggestion-card:hover{border-color:var(--brass);background:#FFF8EC}
.suggestion-card .sugg-icon{font-size:1.3rem;flex-shrink:0}
.suggestion-card .sugg-info{flex:1;min-width:0}
.suggestion-card .sugg-title{font-weight:700;font-size:0.88rem;color:var(--navy)}
.suggestion-card .sugg-reason{font-size:0.78rem;color:var(--text-muted)}
.diagnostics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.diag-item{padding:12px;border:1px solid var(--border-light);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;font-size:0.88rem}
.diag-item .diag-label{font-weight:600;color:var(--navy)}
.diag-item .diag-value{font-weight:700}
.diag-available{color:var(--green)}
.diag-unavailable{color:var(--red)}
.diag-partial{color:var(--brass)}
.map-controls{display:flex;gap:6px;padding:8px;background:var(--parchment);border-radius:var(--radius);margin-bottom:8px;flex-wrap:wrap;align-items:center}
.map-controls label{font-size:0.8rem;font-weight:600;color:var(--text-secondary)}
.map-controls select{width:auto;padding:4px 8px;font-size:0.82rem}
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;font-size:0.85rem}
.pagination button{padding:4px 10px;font-size:0.82rem}
.insight-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:2.5rem;margin-bottom:10px;display:block}
.empty-state p{font-size:0.95rem;font-family:var(--font-heading);font-style:italic}
.tab-content{animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(27,42,74,0.4);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-card{width:500px;max-width:90vw}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media(max-width:768px){
  .layout-sidebar{grid-template-columns:1fr}
  .welcome-cards{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  nav#app-nav button{padding:8px 10px;font-size:0.82rem}
  header#app-header h1{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="app">
  <div class="toast-container" id="toast-container"></div>
</div>
<script>
const APP_NAME = "Atlas Observatory";
const APP_VERSION = "2026.05.06.1";
const DB_NAME = "atlasObservatoryDB";
const DB_VERSION = 1;

const state = {
  currentTab: "welcome",
  db: null,
  localAI: { availability: null, session: null, enabled: false, lastError: null },
  data: { datasets: [], activeDatasetId: null, selectedRows: [], selectedColumns: [], chartSuggestions: [], importedFiles: [], currentView: null },
  knowledge: { notes: [], activeNoteId: null, graph: null, selectedTag: null, selectedLink: null, editMode: false, graphLayout: null },
  ui: { currentView: {}, sidebarOpen: true, theme: "atlas-room", searchQuery: "" },
  dataView: { page: 0, pageSize: 25, sortCol: null, sortDir: 1, filter: "" },
  mapView: { zoom: 1, panX: 0, panY: 0, clusterBy: "tags", showEdges: true, filterTag: null }
};

function init() {
  initDb().then(() => {
    loadSettings();
    return loadFromDb();
  }).then(() => {
    checkLocalAI();
    renderApp();
  }).catch(err => {
    console.error("Init error:", err);
    state.currentTab = "welcome";
    renderApp();
    toast("Database init error. Running in memory-only mode.", "error");
  });
}

function initDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      const stores = ["datasets","datasetRows","datasetProfiles","notes","noteLinks","noteTags","visualLayouts","settings","savedViews"];
      stores.forEach(name => {
        if (!db.objectStoreNames.contains(name)) {
          const store = db.createObjectStore(name, { keyPath: "id" });
          if (name === "datasetRows") store.createIndex("datasetId", "datasetId", { unique: false });
          if (name === "notes") { store.createIndex("tags", "tags", { unique: false, multiEntry: true }); store.createIndex("updatedAt", "updatedAt"); }
          if (name === "noteTags") { store.createIndex("tag", "tag"); store.createIndex("noteId", "noteId"); }
          if (name === "noteLinks") { store.createIndex("sourceId", "sourceId"); store.createIndex("targetId", "targetId"); }
          if (name === "settings") { db.deleteObjectStore(name); db.createObjectStore(name, { keyPath: "key" }); }
        }
      });
    };
    req.onsuccess = (e) => { state.db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbPut(storeName, item) {
  return new Promise((resolve, reject) => {
    if (!state.db) return resolve();
    const tx = state.db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function dbGet(storeName, id) {
  return new Promise((resolve, reject) => {
    if (!state.db) return resolve(null);
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    if (!state.db) return resolve([]);
    const tx = state.db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbDelete(storeName, id) {
  return new Promise((resolve, reject) => {
    if (!state.db) return resolve();
    const tx = state.db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function dbClear(storeName) {
  return new Promise((resolve, reject) => {
    if (!state.db) return resolve();
    const tx = state.db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function loadSettings() {
  try {
    const s = localStorage.getItem("atlasObservatory_settings");
    if (s) { const parsed = JSON.parse(s); Object.assign(state.ui, parsed.ui || {}); if (parsed.currentTab) state.currentTab = parsed.currentTab; }
  } catch(e) {}
}

function saveSettings() {
  try { localStorage.setItem("atlasObservatory_settings", JSON.stringify({ ui: state.ui, currentTab: state.currentTab })); } catch(e) {}
}

function loadFromDb() {
  return Promise.all([dbGetAll("datasets"), dbGetAll("notes")]).then(([datasets, notes]) => {
    state.data.datasets = datasets || [];
    state.knowledge.notes = notes || [];
  });
}

async function checkLocalAI() {
  try {
    if (window.LanguageModel && LanguageModel.availability) {
      const avail = await LanguageModel.availability(getLocalAISessionOptions());
      state.localAI.availability = avail;
      state.localAI.enabled = avail === "readily";
    }
  } catch(e) {
    state.localAI.availability = "unavailable";
    state.localAI.lastError = e.message;
  }
}

function getLocalAISessionOptions() {
  return {
    expectedInputs: [{ type: "text", languages: ["en"] }],
    expectedOutputs: [{ type: "text", languages: ["en"] }]
  };
}

async function createLocalAISession() {
  try {
    if (!window.LanguageModel) throw new Error("LanguageModel API not available");
    state.localAI.session = await LanguageModel.create(getLocalAISessionOptions());
    state.localAI.enabled = true;
    toast("Local AI session created", "success");
  } catch(e) {
    state.localAI.lastError = e.message;
    state.localAI.enabled = false;
    toast("Local AI unavailable: " + e.message, "error");
  }
}

function resetLocalAISession() {
  if (state.localAI.session && state.localAI.session.destroy) state.localAI.session.destroy();
  state.localAI.session = null;
  state.localAI.enabled = state.localAI.availability === "readily";
}

async function localAIGenerate(prompt) {
  if (!state.localAI.session) await createLocalAISession();
  if (!state.localAI.session) return null;
  try {
    let result = "";
    const stream = state.localAI.session.promptStreaming(prompt);
    for await (const chunk of stream) { result += chunk; }
    return result;
  } catch(e) { state.localAI.lastError = e.message; return null; }
}

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  return "id_" + Math.abs(h).toString(36);
}

function formatDate(v) {
  if (!v) return "\u2014";
  try { return new Date(v).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  catch(e) { return String(v); }
}

function formatDateShort(v) {
  if (!v) return "\u2014";
  try { return new Date(v).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); }
  catch(e) { return String(v); }
}

function toast(message, type) {
  type = type || "info";
  const c = document.getElementById("toast-container");
  if (!c) return;
  const t = document.createElement("div");
  t.className = "toast toast-" + type;
  t.textContent = message;
  c.appendChild(t);
  setTimeout(function() { t.style.animation = "toastOut 0.3s ease forwards"; setTimeout(function() { t.remove(); }, 300); }, 3500);
}

function copyToClipboard(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { toast("Copied to clipboard", "success"); }); }
  else { toast("Clipboard not available", "error"); }
}

function saveFile(name, content, mime) {
  mime = mime || "text/plain";
  if (window.showSaveFilePicker) {
    window.showSaveFilePicker({ suggestedName: name, types: [{ description: "File", accept: { } }] })
      .then(function(h) { return h.createWritable().then(function(w) { w.write(content); w.close(); toast("Saved: " + name, "success"); }); })
      .catch(function() { fallbackDownload(name, content, mime); });
  } else { fallbackDownload(name, content, mime); }
}

function fallbackDownload(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function parseCsv(text) {
  var rows = [];
  var i = 0;
  function parseField() {
    if (i >= text.length) return "";
    if (text[i] === '"') {
      i++;
      var field = "";
      while (i < text.length) {
        if (text[i] === '"') {
          if (i + 1 < text.length && text[i + 1] === '"') { field += '"'; i += 2; }
          else { i++; break; }
        } else { field += text[i]; i++; }
      }
      return field;
    } else {
      var field = "";
      while (i < text.length && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') { field += text[i]; i++; }
      return field.trim();
    }
  }
  function parseRow() {
    var fields = [];
    fields.push(parseField());
    while (i < text.length && text[i] === ',') { i++; fields.push(parseField()); }
    if (i < text.length && text[i] === '\r') i++;
    if (i < text.length && text[i] === '\n') i++;
    return fields;
  }
  while (i < text.length) {
    var row = parseRow();
    if (row.length > 1 || (row.length === 1 && row[0] !== "")) rows.push(row);
  }
  return rows;
}

function inferType(values) {
  if (!values || values.length === 0) return "string";
  var sample = values.slice(0, 50);
  var numCount = 0, intCount = 0, boolCount = 0, dateCount = 0, urlCount = 0, nullCount = 0;
  for (var vi = 0; vi < sample.length; vi++) {
    var v = sample[vi];
    if (v === null || v === undefined || v === "" || String(v).trim() === "") { nullCount++; continue; }
    var s = String(v).trim();
    if (/^https?:\/\//i.test(s)) { urlCount++; continue; }
    if (s === "true" || s === "false" || s === "TRUE" || s === "FALSE") { boolCount++; continue; }
    if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s) || /^\d{1,2}[-/]\d{1,2}[-/]\d{2,4}/.test(s)) { dateCount++; continue; }
    if (!isNaN(Number(s)) && s !== "") {
      numCount++;
      if (Number.isInteger(Number(s)) && s.indexOf('.') < 0) intCount++;
    }
  }
  var valid = sample.length - nullCount;
  if (valid === 0) return "string";
  if (urlCount / valid > 0.7) return "url";
  if (boolCount / valid > 0.7) return "boolean";
  if (dateCount / valid > 0.7) return "date";
  if (numCount / valid > 0.7) return intCount === numCount ? "integer" : "number";
  var uniq = new Set(sample.filter(function(v2) { return v2 !== "" && v2 !== null; })).size;
  if (uniq <= Math.min(20, valid * 0.3) && valid > 3) return "category";
  return "string";
}

function inferRole(colName, colType, uniqueRatio, totalRows) {
  var name = colName.toLowerCase();
  if (/id$|_id|^id$|identifier|key/i.test(name)) return "identifier";
  if (/name|label|title|description/i.test(name)) return "label";
  if (/lat|^lat$|latitude/i.test(name)) return "location";
  if (/lon|^lon$|lng|^lng$|longitude/i.test(name)) return "location";
  if (/date|time|year|month|day/i.test(name) || colType === "date" || colType === "datetime") return "time";
  if (colType === "number" || colType === "integer") {
    if (uniqueRatio > 0.8) return "identifier";
    return "measure";
  }
  if (colType === "category") return "category";
  if (colType === "boolean") return "measure";
  if (uniqueRatio < 0.05 && totalRows > 10) return "category";
  return "text blob";
}

function profileDataset(dataset) {
  var rows = dataset.rows;
  var cols = dataset.columns;
  var rowCount = rows.length;
  var profiles = cols.map(function(colName, ci) {
    var values = rows.map(function(r) { return r[ci]; });
    var nonNull = values.filter(function(v) { return v !== null && v !== undefined && String(v).trim() !== ""; });
    var inferredType = inferType(nonNull);
    var uniqueVals = new Set(nonNull.map(function(v) { return String(v).trim(); }));
    var uniqueCount = uniqueVals.size;
    var uniqueRatio = rowCount > 0 ? uniqueCount / rowCount : 0;
    var sampleValues = nonNull.slice(0, 8).map(function(v) { return String(v); });
    var min, max, dateRange;
    if (inferredType === "number" || inferredType === "integer") {
      var nums = nonNull.map(Number).filter(function(n) { return !isNaN(n); });
      if (nums.length) { min = Math.min.apply(null, nums); max = Math.max.apply(null, nums); }
    }
    if (inferredType === "date") {
      var dates = nonNull.map(function(v) { return new Date(v); }).filter(function(d) { return !isNaN(d.getTime()); });
      dates.sort(function(a,b) { return a - b; });
      if (dates.length) { dateRange = [dates[0].toISOString().slice(0,10), dates[dates.length-1].toISOString().slice(0,10)]; }
    }
    var likelyRole = inferRole(colName, inferredType, uniqueRatio, rowCount);
    var likelyLat = /^lat(itude)?$/i.test(colName) || (inferredType === "number" && min >= -90 && max <= 90 && uniqueRatio > 0.1);
    var likelyLon = /^(lon|lng)(gitude)?$/i.test(colName) || (inferredType === "number" && min >= -180 && max <= 180 && uniqueRatio > 0.1);
    if (likelyLat) return { name: colName, inferredType: "latitude", nullable: nonNull.length < rowCount, sampleValues: sampleValues, uniqueCount: uniqueCount, min: min, max: max, dateRange: dateRange, likelyRole: "location", likelyLat: true, likelyLon: false };
    if (likelyLon) return { name: colName, inferredType: "longitude", nullable: nonNull.length < rowCount, sampleValues: sampleValues, uniqueCount: uniqueCount, min: min, max: max, dateRange: dateRange, likelyRole: "location", likelyLat: false, likelyLon: true };
    return { name: colName, inferredType: inferredType, nullable: nonNull.length < rowCount, sampleValues: sampleValues, uniqueCount: uniqueCount, min: min, max: max, dateRange: dateRange, likelyRole: likelyRole, likelyLat: false, likelyLon: false };
  });
  var hasLat = profiles.some(function(p) { return p.likelyLat || p.inferredType === "latitude"; });
  var hasLon = profiles.some(function(p) { return p.likelyLon || p.inferredType === "longitude"; });
  var suggestions = suggestDatasetViews(profiles, rowCount);
  var summary = generateDeterministicSummary(dataset.name, profiles, rowCount);
  return { id: dataset.id, name: dataset.name, sourceType: dataset.sourceType, importedAt: dataset.importedAt, updatedAt: new Date().toISOString(), rowCount: rowCount, columnCount: cols.length, columns: profiles, summary: summary, aiSummary: null, suggestedViews: suggestions, hasGeo: hasLat && hasLon, rawMeta: {} };
}

function generateDeterministicSummary(name, columns, rowCount) {
  var numCols = columns.filter(function(c) { return c.inferredType === "number" || c.inferredType === "integer"; });
  var catCols = columns.filter(function(c) { return c.inferredType === "category"; });
  var dateCols = columns.filter(function(c) { return c.inferredType === "date"; });
  var locCols = columns.filter(function(c) { return c.likelyLat || c.likelyLon || c.likelyRole === "location"; });
  var idCols = columns.filter(function(c) { return c.likelyRole === "identifier"; });
  var s = '"' + name + '" contains ' + rowCount + ' records across ' + columns.length + ' fields. ';
  if (numCols.length) s += 'Numeric measures: ' + numCols.map(function(c) { return c.name; }).join(', ') + '. ';
  if (catCols.length) s += 'Categorical groups: ' + catCols.map(function(c) { return c.name; }).join(', ') + '. ';
  if (dateCols.length) s += 'Time fields: ' + dateCols.map(function(c) { return c.name + (c.dateRange ? ' (' + c.dateRange[0] + ' to ' + c.dateRange[1] + ')' : ''); }).join(', ') + '. ';
  if (locCols.length) s += 'Geographic fields detected. ';
  if (idCols.length) s += 'Likely identifiers: ' + idCols.map(function(c) { return c.name; }).join(', ') + '. ';
  return s.trim();
}

function suggestDatasetViews(columns, rowCount) {
  var views = [];
  var numCols = columns.filter(function(c) { return c.inferredType === "number" || c.inferredType === "integer"; });
  var catCols = columns.filter(function(c) { return c.inferredType === "category"; });
  var dateCols = columns.filter(function(c) { return c.inferredType === "date"; });
  var latCol = columns.find(function(c) { return c.likelyLat || c.inferredType === "latitude"; });
  var lonCol = columns.find(function(c) { return c.likelyLon || c.inferredType === "longitude"; });
  if (catCols.length && numCols.length) {
    for (var ci = 0; ci < Math.min(catCols.length, 3); ci++) {
      for (var ni = 0; ni < Math.min(numCols.length, 3); ni++) {
        if (catCols[ci].uniqueCount <= 30) views.push({ type: "bar", x: catCols[ci].name, y: numCols[ni].name, reason: "Compare " + numCols[ni].name + " across " + catCols[ci].name + " groups" });
      }
    }
  }
  if (dateCols.length && numCols.length) {
    for (var di = 0; di < dateCols.length; di++) {
      for (var ni2 = 0; ni2 < Math.min(numCols.length, 2); ni2++) {
        views.push({ type: "line", x: dateCols[di].name, y: numCols[ni2].name, reason: "Track " + numCols[ni2].name + " over " + dateCols[di].name });
      }
    }
  }
  if (numCols.length >= 2) {
    views.push({ type: "scatter", x: numCols[0].name, y: numCols[1].name, reason: "Correlation between " + numCols[0].name + " and " + numCols[1].name });
  }
  if (numCols.length) {
    for (var ni3 = 0; ni3 < Math.min(numCols.length, 3); ni3++) {
      views.push({ type: "histogram", x: numCols[ni3].name, reason: "Distribution of " + numCols[ni3].name });
    }
  }
  if (catCols.length) {
    for (var ci2 = 0; ci2 < Math.min(catCols.length, 2); ci2++) {
      if (catCols[ci2].uniqueCount <= 20) views.push({ type: "category", x: catCols[ci2].name, reason: "Distribution of " + catCols[ci2].name });
    }
  }
  if (latCol && lonCol) {
    views.push({ type: "map", lat: latCol.name, lon: lonCol.name, reason: "Geographic distribution of records" });
  }
  return views.slice(0, 12);
}

async function importCsv(file) {
  var text = await file.text();
  var rows = parseCsv(text);
  if (rows.length < 2) { toast("CSV appears empty or has no data rows", "error"); return; }
  var columns = rows[0];
  var dataRows = rows.slice(1);
  var ds = { id: hashString(file.name + Date.now()), name: file.name.replace(/\.csv$/i, ""), sourceType: "csv", importedAt: new Date().toISOString(), columns: columns, rows: dataRows };
  var profile = profileDataset(ds);
  ds.profile = profile;
  state.data.datasets.push(ds);
  state.data.activeDatasetId = ds.id;
  await dbPut("datasets", ds);
  await dbPut("datasetProfiles", profile);
  toast("Imported " + ds.name + " (" + dataRows.length + " rows)", "success");
  renderApp();
}

async function importJson(file) {
  var text = await file.text();
  await importJsonText(text, file.name);
}

async function importJsonText(text, fileName) {
  var data;
  try { data = JSON.parse(text); } catch(e) { toast("Invalid JSON", "error"); return; }
  if (!Array.isArray(data)) {
    if (typeof data === "object" && data !== null) { data = [data]; }
    else { toast("JSON must be an array of objects", "error"); return; }
  }
  if (data.length === 0) { toast("JSON array is empty", "error"); return; }
  var columns = Object.keys(data[0]);
  var rows = data.map(function(obj) { return columns.map(function(k) { return obj[k] !== undefined ? obj[k] : null; }); });
  var name = (fileName || "imported-json").replace(/\.json$/i, "");
  var ds = { id: hashString(name + Date.now()), name: name, sourceType: "json", importedAt: new Date().toISOString(), columns: columns, rows: rows };
  var profile = profileDataset(ds);
  ds.profile = profile;
  state.data.datasets.push(ds);
  state.data.activeDatasetId = ds.id;
  await dbPut("datasets", ds);
  await dbPut("datasetProfiles", profile);
  toast("Imported " + ds.name + " (" + rows.length + " rows)", "success");
  renderApp();
}

async function fetchPublicJson(url) {
  try {
    var resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var text = await resp.text();
    await importJsonText(text, url.split("/").pop() || "fetched-json");
  } catch(e) { toast("Fetch failed: " + e.message, "error"); }
}

async function describeDatasetWithAI(profile) {
  if (!state.localAI.enabled) { toast("Local AI not available", "error"); return; }
  var prompt = "You are analyzing a tabular dataset profile. Use only the provided schema, sample values, and summary statistics. Do not invent facts. Return compact JSON only.\nDataset: " + profile.name + ", " + profile.rowCount + " rows, " + profile.columnCount + " columns.\nColumns: " + JSON.stringify(profile.columns.map(function(c) { return {name:c.name,type:c.inferredType,role:c.likelyRole,sample:c.sampleValues.slice(0,3),unique:c.uniqueCount,min:c.min,max:c.max}; })) + "\nReturn JSON: {\"datasetSummary\":\"...\",\"importantColumns\":[\"...\"],\"columnRoles\":[{\"column\":\"...\",\"role\":\"...\",\"reason\":\"...\"}],\"suggestedCharts\":[{\"type\":\"bar\",\"x\":\"...\",\"y\":\"...\",\"reason\":\"...\"}],\"mapSuggestion\":{\"shouldMap\":true,\"reason\":\"...\"},\"questionsToExplore\":[\"...\"]}";
  var result = await localAIGenerate(prompt);
  if (result) {
    try {
      var cleaned = result.replace(/```json\s*|```/g, "").trim();
      profile.aiSummary = JSON.parse(cleaned);
      await dbPut("datasetProfiles", profile);
      toast("AI analysis complete", "success");
      renderApp();
    } catch(e) { toast("AI returned invalid JSON", "error"); }
  }
}

function renderDatasetShelf() {
  var items = state.data.datasets.map(function(ds) {
    var profile = ds.profile;
    var active = ds.id === state.data.activeDatasetId;
    return '<div class="shelf-item ' + (active ? 'active' : '') + '" data-action="select-dataset" data-id="' + ds.id + '"><div class="item-name">' + escapeHtml(ds.name) + '</div><div class="item-meta">' + (profile ? profile.rowCount + " rows, " + profile.columnCount + " cols" : ds.rows.length + " rows") + '<br>' + formatDateShort(ds.importedAt) + '</div></div>';
  }).join("");
  return '<div class="panel"><div class="panel-header">Dataset Shelf</div><div class="shelf">' + items + '</div></div>';
}

function renderDatasetDetail(ds) {
  var profile = ds.profile;
  if (!profile) return "";
  var col = state.data.selectedColumns.length === 1 ? profile.columns.find(function(c) { return c.name === state.data.selectedColumns[0]; }) : null;
  var html = '<div class="grid-2" style="align-items:start"><div style="grid-row:span 2">';
  html += '<div class="panel">' + renderTablePreview(ds) + '</div>';
  if (col) html += '<div class="panel">' + renderFieldInspector(col) + '</div>';
  html += '</div><div>';
  html += '<div class="panel">' + renderDatasetInsights(ds, profile) + '</div>';
  html += '<div class="panel">' + renderSuggestedViews(profile) + '</div>';
  html += '<div class="panel">' + renderVisualizationStage(ds, profile) + '</div>';
  html += '</div></div>';
  return html;
}

function renderTablePreview(ds) {
  var rows = ds.rows;
  var cols = ds.columns;
  var profile = ds.profile;
  var page = state.dataView.page;
  var pageSize = state.dataView.pageSize;
  var filter = state.dataView.filter.toLowerCase();
  var filtered = rows;
  if (filter) filtered = rows.filter(function(r) { return r.some(function(c) { return String(c).toLowerCase().indexOf(filter) >= 0; }); });
  var total = filtered.length;
  var totalPages = Math.ceil(total / pageSize) || 1;
  var start = page * pageSize;
  var pageRows = filtered.slice(start, start + pageSize);
  var sortCol = state.dataView.sortCol;
  var sortDir = state.dataView.sortDir;
  if (sortCol !== null) {
    var ci = cols.indexOf(sortCol);
    if (ci >= 0) pageRows.sort(function(a,b) {
      var va = a[ci], vb = b[ci];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      var na = Number(va), nb = Number(vb);
      if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
      return String(va).localeCompare(String(vb)) * sortDir;
    });
  }
  var typeColor = {number:"#3A5A8B",integer:"#3A5A8B",category:"#2D5016",date:"#8B3A3A",latitude:"#B87333",longitude:"#B87333",boolean:"#6A5ACD",url:"#4A7A30",string:"#8B7D6B"};
  var html = '<div class="panel-header">Table Preview <span class="badge badge-muted">' + total + ' rows</span></div>';
  html += '<div class="flex-row" style="margin-bottom:8px"><input type="search" placeholder="Filter rows..." data-action="filter-table" value="' + escapeHtml(filter) + '" style="max-width:250px">';
  html += '<select data-action="page-size" style="width:auto">';
  [10,25,50,100].forEach(function(n) { html += '<option value="' + n + '"' + (n===pageSize?' selected':'') + '>' + n + '/page</option>'; });
  html += '</select></div>';
  html += '<div style="overflow-x:auto"><table class="data-table"><thead><tr>';
  cols.forEach(function(c, i) {
    var tp = profile ? profile.columns[i] : null;
    var type = tp ? tp.inferredType : "string";
    var color = typeColor[type] || "#8B7D6B";
    html += '<th data-action="sort-col" data-col="' + c + '">' + escapeHtml(c) + '<span class="type-badge" style="background:' + color + ';color:#fff">' + type + '</span>' + (sortCol===c?(sortDir===1?' &#9650;':' &#9660;'):'') + '</th>';
  });
  html += '</tr></thead><tbody>';
  pageRows.forEach(function(r, ri) {
    html += '<tr>';
    r.forEach(function(v, ci2) {
      var sv = v === null || v === undefined ? '<span style="color:var(--text-muted)">null</span>' : (String(v).length > 60 ? escapeHtml(String(v).slice(0,60))+'...' : escapeHtml(String(v)));
      html += '<td data-action="inspect-col" data-col="' + cols[ci2] + '" title="' + escapeHtml(String(v||'')) + '">' + sv + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="pagination"><button class="btn btn-sm" data-action="prev-page" ' + (page===0?'disabled':'') + '>&larr; Prev</button><span>Page ' + (page+1) + ' of ' + totalPages + '</span><button class="btn btn-sm" data-action="next-page" ' + (page>=totalPages-1?'disabled':'') + '>Next &rarr;</button></div>';
  return html;
}

function renderFieldInspector(col) {
  var html = '<div class="panel-header">Field: ' + escapeHtml(col.name) + '</div><dl class="field-detail">';
  html += '<dt>Type</dt><dd><span class="tag tag-navy">' + col.inferredType + '</span></dd>';
  html += '<dt>Likely Role</dt><dd><span class="tag tag-green">' + col.likelyRole + '</span></dd>';
  html += '<dt>Sample Values</dt><dd>' + (col.sampleValues||[]).map(function(v) { return '<code>' + escapeHtml(String(v)) + '</code>'; }).join(", ") + '</dd>';
  html += '<dt>Unique Count</dt><dd>' + col.uniqueCount + '</dd>';
  if (col.min !== undefined) { html += '<dt>Min</dt><dd>' + col.min + '</dd><dt>Max</dt><dd>' + col.max + '</dd>'; }
  if (col.dateRange) { html += '<dt>Date Range</dt><dd>' + col.dateRange[0] + ' to ' + col.dateRange[1] + '</dd>'; }
  html += '<dt>Nullable</dt><dd>' + (col.nullable ? "Yes" : "No") + '</dd>';
  var chartSuit = (col.inferredType==="number"||col.inferredType==="integer") ? "Good for bar, line, scatter, histogram" : col.inferredType==="category" ? "Good for bar, category distribution" : col.inferredType==="date" ? "Good for line, time series" : "Limited";
  html += '<dt>Chart Suitability</dt><dd>' + chartSuit + '</dd>';
  html += '<dt>Map Suitability</dt><dd>' + (col.likelyLat || col.likelyLon ? "Yes - geographic field" : "Not a coordinate field") + '</dd>';
  html += '</dl>';
  return html;
}

function renderDatasetInsights(ds, profile) {
  var numCols = profile.columns.filter(function(c) { return c.inferredType === "number" || c.inferredType === "integer"; });
  var catCols = profile.columns.filter(function(c) { return c.inferredType === "category"; });
  var topCats = catCols.map(function(c) { return { name: c.name, topN: getTopValues(ds, ds.columns.indexOf(c.name), 5) }; }).filter(function(c) { return c.topN.length > 0; });
  var html = '<div class="panel-header">Dataset Insights</div><div class="insight-cards">';
  html += '<div class="card stat-card"><div class="stat-value">' + profile.rowCount + '</div><div class="stat-label">Rows</div></div>';
  html += '<div class="card stat-card"><div class="stat-value">' + profile.columnCount + '</div><div class="stat-label">Columns</div></div>';
  html += '<div class="card stat-card"><div class="stat-value">' + numCols.length + '</div><div class="stat-label">Numeric</div></div>';
  html += '<div class="card stat-card"><div class="stat-value">' + catCols.length + '</div><div class="stat-label">Categorical</div></div>';
  html += '</div>';
  html += '<p style="font-size:0.88rem;color:var(--text-secondary);margin:8px 0">' + (profile.summary || "") + '</p>';
  topCats.forEach(function(c) {
    html += '<div style="margin:6px 0"><strong style="font-size:0.85rem">' + c.name + ':</strong> ' + c.topN.map(function(item) { return '<span class="tag tag-brass">' + escapeHtml(String(item[0])) + ' (' + item[1] + ')</span>'; }).join("") + '</div>';
  });
  if (profile.aiSummary) {
    html += '<div style="margin-top:8px;padding:8px;background:var(--parchment);border-radius:var(--radius);font-size:0.85rem"><strong>AI Summary:</strong> ' + escapeHtml(profile.aiSummary.datasetSummary || JSON.stringify(profile.aiSummary).slice(0,300)) + '</div>';
  }
  html += '<div class="flex-row" style="margin-top:10px">';
  if (state.localAI.enabled) html += '<button class="btn btn-accent btn-sm" data-action="ai-describe">Describe with AI</button>';
  html += '<button class="btn btn-sm" data-action="export-summary">Export Summary (MD)</button>';
  html += '<button class="btn btn-sm" data-action="export-profile">Export Profile (JSON)</button>';
  html += '</div>';
  return html;
}

function getTopValues(ds, colIdx, n) {
  var counts = {};
  for (var i = 0; i < ds.rows.length; i++) { var v = ds.rows[i][colIdx]; if (v !== null && v !== undefined && String(v).trim()) { var k = String(v); counts[k] = (counts[k] || 0) + 1; } }
  return Object.entries(counts).sort(function(a,b) { return b[1] - a[1]; }).slice(0, n);
}

function renderSuggestedViews(profile) {
  var views = profile.suggestedViews || [];
  var icons = {bar:"&#9635;",line:"&#9644;",scatter:"&#8226;",histogram:"&#9641;",category:"&#9638;",map:"&#9673;"};
  var html = '<div class="panel-header">Suggested Views</div><div style="display:flex;flex-direction:column;gap:6px">';
  if (views.length === 0) {
    html += '<p style="color:var(--text-muted);font-size:0.88rem">No suggestions yet</p>';
  } else {
    views.forEach(function(v, i) {
      html += '<div class="suggestion-card" data-action="render-view" data-idx="' + i + '"><span class="sugg-icon">' + (icons[v.type]||"&#9670;") + '</span><div class="sugg-info"><div class="sugg-title">' + v.type.toUpperCase() + ': ' + v.x + (v.y ? ' vs ' + v.y : '') + '</div><div class="sugg-reason">' + v.reason + '</div></div></div>';
    });
  }
  html += '</div>';
  return html;
}

function renderVisualizationStage(ds, profile) {
  return '<div class="panel-header">Visualization Stage</div><canvas id="viz-canvas" class="chart-canvas" width="800" height="400"></canvas><div class="flex-row" style="margin-top:8px"><button class="btn btn-sm" data-action="export-chart-png">Export as PNG</button></div>';
}

function renderCurrentChart() {
  var ds = getActiveDataset();
  if (!ds || !ds.profile) return;
  var view = state.data.currentView;
  if (!view) {
    var canvas = document.getElementById("viz-canvas");
    if (canvas) { var ctx = canvas.getContext("2d"); ctx.clearRect(0,0,canvas.width,canvas.height); drawEmptyChart(ctx, canvas.width/2, canvas.height/2, "Select a suggested view to visualize"); }
    return;
  }
  renderChart(ds, view);
}

function renderChart(ds, view) {
  var canvas = document.getElementById("viz-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  var xIdx = ds.columns.indexOf(view.x);
  var yIdx = view.y ? ds.columns.indexOf(view.y) : -1;
  if (xIdx < 0 && view.type !== "map") return;
  var rows = ds.rows;
  var margin = { top: 30, right: 30, bottom: 50, left: 60 };
  var pw = W - margin.left - margin.right, ph = H - margin.top - margin.bottom;
  ctx.fillStyle = "#FAF7F0"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#D4C9B0"; ctx.lineWidth = 1; ctx.strokeRect(margin.left, margin.top, pw, ph);
  drawGridLines(ctx, margin, pw, ph);
  ctx.fillStyle = "#1B2A4A"; ctx.font = "13px Georgia"; ctx.textAlign = "center";
  ctx.fillText(view.type.toUpperCase() + ": " + view.x + (view.y ? " vs " + view.y : ""), W/2, 18);
  switch(view.type) {
    case "bar": renderBarChart(ctx, rows, xIdx, yIdx, margin, pw, ph); break;
    case "line": renderLineChart(ctx, rows, xIdx, yIdx, margin, pw, ph); break;
    case "scatter": renderScatterPlot(ctx, rows, xIdx, yIdx, margin, pw, ph); break;
    case "histogram": renderHistogram(ctx, rows, xIdx, margin, pw, ph); break;
    case "category": renderCategoryChart(ctx, rows, xIdx, margin, pw, ph); break;
    case "map": renderMapView(ctx, rows, ds.columns.indexOf(view.lat), ds.columns.indexOf(view.lon), margin, pw, ph); break;
    default: drawEmptyChart(ctx, W/2, H/2, "Unsupported chart type");
  }
}

function drawGridLines(ctx, m, pw, ph) {
  ctx.strokeStyle = "rgba(212,201,176,0.4)"; ctx.lineWidth = 0.5;
  for (var i = 1; i < 5; i++) { var y = m.top + ph * i / 5; ctx.beginPath(); ctx.moveTo(m.left, y); ctx.lineTo(m.left + pw, y); ctx.stroke(); }
}

function drawEmptyChart(ctx, x, y, text) {
  ctx.fillStyle = "#8B7D6B"; ctx.font = "14px Georgia"; ctx.textAlign = "center";
  ctx.fillText(text, x, y);
}

function renderBarChart(ctx, rows, xIdx, yIdx, m, pw, ph) {
  if (yIdx < 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "Need a Y axis for bar chart");
  var groups = {};
  rows.forEach(function(r) { var k = String(r[xIdx] || "null"); if (!groups[k]) groups[k] = []; groups[k].push(Number(r[yIdx]) || 0); });
  var keys = Object.keys(groups).slice(0, 30);
  var vals = keys.map(function(k) { var a = groups[k]; return a.reduce(function(s,v) { return s+v; }, 0) / a.length; });
  var maxV = Math.max.apply(null, vals.concat([1]));
  var barW = Math.min(pw / keys.length * 0.7, 50);
  var gap = pw / keys.length;
  ctx.fillStyle = "#2C3E6B"; ctx.font = "10px sans-serif"; ctx.textAlign = "right";
  for (var i = 0; i <= 5; i++) { var v = maxV * i / 5; var y2 = m.top + ph - ph * i / 5; ctx.fillText(formatNum(v), m.left - 6, y2 + 3); }
  keys.forEach(function(k, i2) {
    var x = m.left + gap * i2 + (gap - barW) / 2;
    var h = (vals[i2] / maxV) * ph;
    var grad = ctx.createLinearGradient(x, m.top + ph - h, x, m.top + ph);
    grad.addColorStop(0, "#2C3E6B"); grad.addColorStop(1, "#1B2A4A");
    ctx.fillStyle = grad; ctx.fillRect(x, m.top + ph - h, barW, h);
    ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 0.5; ctx.strokeRect(x, m.top + ph - h, barW, h);
    ctx.fillStyle = "#1B2A4A"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
    ctx.save(); ctx.translate(x + barW/2, m.top + ph + 10); ctx.rotate(-0.4);
    ctx.fillText(k.length > 12 ? k.slice(0,12)+"..." : k, 0, 0); ctx.restore();
  });
}

function renderLineChart(ctx, rows, xIdx, yIdx, m, pw, ph) {
  if (yIdx < 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "Need a Y axis for line chart");
  var points = rows.map(function(r) { return { x: r[xIdx], y: Number(r[yIdx]) || 0 }; }).filter(function(p) { return p.y !== null; });
  if (points.length === 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "No numeric data");
  var maxV = Math.max.apply(null, points.map(function(p) { return p.y; }).concat([1]));
  ctx.fillStyle = "#2C3E6B"; ctx.font = "10px sans-serif"; ctx.textAlign = "right";
  for (var i = 0; i <= 5; i++) { var v = maxV * i / 5; var y2 = m.top + ph - ph * i / 5; ctx.fillText(formatNum(v), m.left - 6, y2 + 3); }
  ctx.strokeStyle = "#2C3E6B"; ctx.lineWidth = 2; ctx.beginPath();
  points.forEach(function(p, i2) {
    var x = m.left + (i2 / Math.max(points.length - 1, 1)) * pw;
    var y = m.top + ph - (p.y / maxV) * ph;
    if (i2 === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  points.forEach(function(p, i3) {
    var x = m.left + (i3 / Math.max(points.length - 1, 1)) * pw;
    var y = m.top + ph - (p.y / maxV) * ph;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = "#B8860B"; ctx.fill();
    ctx.strokeStyle = "rgba(184,134,11,0.3)"; ctx.lineWidth = 1; ctx.stroke();
  });
  ctx.fillStyle = "#5C5040"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
  var labelStep = Math.max(1, Math.floor(points.length / 10));
  points.forEach(function(p, i4) { if (i4 % labelStep === 0) { var x = m.left + (i4 / Math.max(points.length - 1, 1)) * pw; ctx.fillText(String(p.x).slice(0,10), x, m.top + ph + 14); } });
}

function renderScatterPlot(ctx, rows, xIdx, yIdx, m, pw, ph) {
  if (yIdx < 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "Need two numeric axes for scatter");
  var points = rows.map(function(r) { return { x: Number(r[xIdx]) || 0, y: Number(r[yIdx]) || 0 }; }).filter(function(p) { return !isNaN(p.x) && !isNaN(p.y); });
  if (points.length === 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "No numeric data");
  var xMin = Math.min.apply(null, points.map(function(p){return p.x})), xMax = Math.max.apply(null, points.map(function(p){return p.x}));
  var yMin = Math.min.apply(null, points.map(function(p){return p.y})), yMax = Math.max.apply(null, points.map(function(p){return p.y}));
  var xR = xMax - xMin || 1, yR = yMax - yMin || 1;
  ctx.fillStyle = "#5C5040"; ctx.font = "9px sans-serif"; ctx.textAlign = "right";
  for (var i = 0; i <= 5; i++) { ctx.fillText(formatNum(yMin + yR * i / 5), m.left - 6, m.top + ph - ph * i / 5 + 3); }
  ctx.textAlign = "center";
  for (var i2 = 0; i2 <= 5; i2++) { ctx.fillText(formatNum(xMin + xR * i2 / 5), m.left + pw * i2 / 5, m.top + ph + 14); }
  points.forEach(function(p) {
    var x = m.left + ((p.x - xMin) / xR) * pw;
    var y = m.top + ph - ((p.y - yMin) / yR) * ph;
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(44,62,107,0.6)"; ctx.fill();
    ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 0.5; ctx.stroke();
  });
}

function renderHistogram(ctx, rows, xIdx, m, pw, ph) {
  var vals = rows.map(function(r) { return Number(r[xIdx]); }).filter(function(v) { return !isNaN(v); });
  if (vals.length === 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "No numeric data for histogram");
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var bins = 20;
  var binW = (mx - mn) / bins || 1;
  var counts = new Array(bins).fill(0);
  vals.forEach(function(v) { var b = Math.min(Math.floor((v - mn) / binW), bins - 1); counts[b]++; });
  var maxC = Math.max.apply(null, counts.concat([1]));
  var barW = pw / bins;
  ctx.fillStyle = "#5C5040"; ctx.font = "10px sans-serif"; ctx.textAlign = "right";
  for (var i = 0; i <= 5; i++) { ctx.fillText(formatNum(maxC * i / 5), m.left - 6, m.top + ph - ph * i / 5 + 3); }
  counts.forEach(function(c, i2) {
    var x = m.left + barW * i2;
    var h = (c / maxC) * ph;
    var grad = ctx.createLinearGradient(x, m.top + ph - h, x, m.top + ph);
    grad.addColorStop(0, "#4A7A30"); grad.addColorStop(1, "#2D5016");
    ctx.fillStyle = grad; ctx.fillRect(x, m.top + ph - h, barW - 1, h);
    ctx.strokeStyle = "rgba(184,134,11,0.3)"; ctx.lineWidth = 0.5; ctx.strokeRect(x, m.top + ph - h, barW - 1, h);
  });
  ctx.fillStyle = "#5C5040"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
  for (var i3 = 0; i3 <= 5; i3++) { var x2 = m.left + (bins * i3 / 5) * barW; ctx.fillText(formatNum(mn + (mx - mn) * i3 / 5), x2, m.top + ph + 14); }
}

function renderCategoryChart(ctx, rows, xIdx, m, pw, ph) {
  var counts = {};
  rows.forEach(function(r) { var k = String(r[xIdx] || "null"); counts[k] = (counts[k] || 0) + 1; });
  var entries = Object.entries(counts).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 20);
  var maxC = Math.max.apply(null, entries.map(function(e) { return e[1]; }).concat([1]));
  var barH = Math.min(ph / entries.length * 0.75, 24);
  var gap = ph / entries.length;
  ctx.fillStyle = "#1B2A4A"; ctx.font = "10px sans-serif"; ctx.textAlign = "right";
  for (var i = 0; i <= 5; i++) { ctx.fillText(formatNum(maxC * i / 5), m.left + pw + 2, m.top + ph - ph * i / 5 + 3); }
  var colors = ["#2C3E6B","#4A7A30","#B8860B","#8B3A3A","#3A5A8B","#6A5ACD","#B87333","#2D5016"];
  entries.forEach(function(entry, i2) {
    var k = entry[0], v = entry[1];
    var y = m.top + gap * i2 + (gap - barH) / 2;
    var w = (v / maxC) * pw;
    ctx.fillStyle = colors[i2 % colors.length];
    ctx.fillRect(m.left, y, w, barH);
    ctx.fillStyle = "#1B2A4A"; ctx.font = "9px sans-serif"; ctx.textAlign = "right";
    ctx.fillText(k.length > 14 ? k.slice(0,14)+"..." : k, m.left - 4, y + barH / 2 + 3);
  });
}

function renderMapView(ctx, rows, latIdx, lonIdx, m, pw, ph) {
  if (latIdx < 0 || lonIdx < 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "No lat/lon columns found");
  var points = rows.map(function(r) { return { lat: Number(r[latIdx]) || 0, lon: Number(r[lonIdx]) || 0 }; }).filter(function(p) { return !isNaN(p.lat) && !isNaN(p.lon); });
  if (points.length === 0) return drawEmptyChart(ctx, m.left + pw/2, m.top + ph/2, "No valid coordinates");
  var latMin = Math.min.apply(null, points.map(function(p){return p.lat})), latMax = Math.max.apply(null, points.map(function(p){return p.lat}));
  var lonMin = Math.min.apply(null, points.map(function(p){return p.lon})), lonMax = Math.max.apply(null, points.map(function(p){return p.lon}));
  var latR = latMax - latMin || 1, lonR = lonMax - lonMin || 1;
  var padding = 0.1;
  ctx.fillStyle = "#EDE6D4"; ctx.fillRect(m.left, m.top, pw, ph);
  ctx.strokeStyle = "rgba(139,119,80,0.15)"; ctx.lineWidth = 0.5;
  for (var i = 0; i <= 8; i++) { var x = m.left + pw * i / 8; ctx.beginPath(); ctx.moveTo(x, m.top); ctx.lineTo(x, m.top + ph); ctx.stroke(); }
  for (var i2 = 0; i2 <= 6; i2++) { var y = m.top + ph * i2 / 6; ctx.beginPath(); ctx.moveTo(m.left, y); ctx.lineTo(m.left + pw, y); ctx.stroke(); }
  points.forEach(function(p) {
    var x = m.left + ((p.lon - lonMin + lonR * padding) / (lonR * (1 + 2 * padding))) * pw;
    var y = m.top + ph - ((p.lat - latMin + latR * padding) / (latR * (1 + 2 * padding))) * ph;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(184,115,51,0.7)"; ctx.fill();
    ctx.strokeStyle = "#1B2A4A"; ctx.lineWidth = 1; ctx.stroke();
  });
  ctx.fillStyle = "#5C5040"; ctx.font = "8px sans-serif"; ctx.textAlign = "right";
  for (var i3 = 0; i3 <= 4; i3++) { ctx.fillText((latMin + latR * i3 / 4).toFixed(1) + "\u00b0", m.left - 4, m.top + ph - ph * i3 / 4 + 3); }
  ctx.textAlign = "center";
  for (var i4 = 0; i4 <= 4; i4++) { ctx.fillText((lonMin + lonR * i4 / 4).toFixed(1) + "\u00b0", m.left + pw * i4 / 4, m.top + ph + 12); }
}

function extractTags(text) {
  var tags = new Set();
  var hashTags = text.match(/(?:^|\s)#([a-zA-Z][\w-]*)/g);
  if (hashTags) hashTags.forEach(function(t) { tags.add(t.trim().slice(1).toLowerCase()); });
  return Array.from(tags);
}

function extractLinks(text) {
  var links = new Set();
  var mdLinks = text.match(/\[([^\]]+)\]\(([^)]+)\)/g);
  if (mdLinks) mdLinks.forEach(function(l) { var m = l.match(/\[([^\]]+)\]\(([^)]+)\)/); if (m) links.add(m[2]); });
  var wikiLinks = text.match(/\[\[([^\]]+)\]\]/g);
  if (wikiLinks) wikiLinks.forEach(function(l) { links.add(l.slice(2, -2)); });
  return Array.from(links);
}

function inferNoteType(note) {
  var body = (note.body || "").toLowerCase();
  var title = (note.title || "").toLowerCase();
  if (/todo|task|\[[ x]\]|deadline|action item/i.test(body)) return "task";
  if (/^day\s|journal|diary|log|^20\d\d[-/]/i.test(title) || /dear diary|today i/i.test(body.slice(0, 200))) return "journal";
  if (/reference|docs?|spec|definition|glossary/i.test(title)) return "reference";
  if (/idea|brainstorm|what if|maybe|proposal/i.test(title) || /what if|imagine|could we/i.test(body.slice(0, 200))) return "idea";
  if (body.length < 50) return "draft";
  return "note";
}

function extractKeywords(text, topN) {
  topN = topN || 10;
  var stopWords = new Set(["the","a","an","is","are","was","were","be","been","being","have","has","had","do","does","did","will","would","shall","should","may","might","must","can","could","of","in","to","for","with","on","at","by","from","as","into","through","during","before","after","above","below","between","out","off","over","under","again","further","then","once","here","there","when","where","why","how","all","both","each","few","more","most","other","some","such","no","nor","not","only","own","same","so","than","too","very","just","because","but","and","or","if","while","about","up","it","its","this","that","these","those","i","me","my","we","our","you","your","he","him","his","she","her","they","them","their","what","which","who","whom"]);
  var words = text.toLowerCase().replace(/[^a-z\s]/g, " ").split(/\s+/).filter(function(w) { return w.length > 2 && !stopWords.has(w); });
  var freq = {};
  words.forEach(function(w) { freq[w] = (freq[w] || 0) + 1; });
  return Object.entries(freq).sort(function(a,b) { return b[1] - a[1]; }).slice(0, topN).map(function(e) { return e[0]; });
}

function parseMarkdownNote(raw, meta) {
  meta = meta || {};
  var body = raw || "";
  var titleMatch = body.match(/^#\s+(.+)$/m);
  var title = meta.title || (titleMatch ? titleMatch[1].trim() : "Untitled");
  var tags = extractTags(body);
  var outboundLinks = extractLinks(body);
  var keywords = extractKeywords(body);
  var noteType = inferNoteType({ title: title, body: body });
  var excerpt = body.replace(/^#+\s+.*/gm, "").replace(/[#*\[\]()`]/g, "").trim().slice(0, 200);
  var now = new Date().toISOString();
  return {
    id: meta.id || hashString(title + now),
    title: title, body: body, createdAt: meta.createdAt || now, updatedAt: now, importedAt: meta.importedAt || now,
    sourceType: meta.sourceType || "manual", filePath: meta.filePath || null,
    tags: tags, outboundLinks: outboundLinks, backlinks: [], summary: excerpt, aiSummary: null,
    keywords: keywords, entities: [], graphNode: { x: 0, y: 0, cluster: 0, size: 1 },
    rawMeta: meta
  };
}

async function importMarkdownFiles(files) {
  for (var fi = 0; fi < files.length; fi++) {
    var file = files[fi];
    var text = await file.text();
    var note = parseMarkdownNote(text, { sourceType: "file", filePath: file.name, importedAt: new Date().toISOString(), title: file.name.replace(/\.md$/i, "") });
    state.knowledge.notes.push(note);
    await dbPut("notes", note);
  }
  buildBacklinks();
  toast("Imported " + files.length + " note(s)", "success");
  renderApp();
}

async function importMarkdownFolder() {
  if (!window.showDirectoryPicker) { toast("File System Access API not available", "error"); return; }
  try {
    var dir = await window.showDirectoryPicker();
    var count = 0;
    for await (var entry of dir.values()) {
      if (entry.kind === "file" && entry.name.endsWith(".md")) {
        var file = await entry.getFile();
        var text = await file.text();
        var note = parseMarkdownNote(text, { sourceType: "folder", filePath: entry.name, importedAt: new Date().toISOString(), title: entry.name.replace(/\.md$/i, "") });
        state.knowledge.notes.push(note);
        await dbPut("notes", note);
        count++;
      }
    }
    buildBacklinks();
    toast("Imported " + count + " note(s) from folder", "success");
    renderApp();
  } catch(e) { if (e.name !== "AbortError") toast("Folder error: " + e.message, "error"); }
}

function buildBacklinks() {
  var notes = state.knowledge.notes;
  notes.forEach(function(n) { n.backlinks = []; });
  var titleMap = {};
  notes.forEach(function(n) { titleMap[n.title.toLowerCase()] = n.id; });
  notes.forEach(function(n) {
    n.outboundLinks.forEach(function(link) {
      var targetId = titleMap[link.toLowerCase()];
      if (targetId && targetId !== n.id) {
        var target = notes.find(function(t) { return t.id === targetId; });
        if (target && target.backlinks.indexOf(n.id) < 0) target.backlinks.push(n.id);
      }
    });
  });
  notes.forEach(function(n) { dbPut("notes", n); });
}

function buildKnowledgeGraph() {
  var notes = state.knowledge.notes;
  var edges = [];
  var tagClusters = {};
  notes.forEach(function(n) { n.tags.forEach(function(t) { if (!tagClusters[t]) tagClusters[t] = []; tagClusters[t].push(n.id); }); });
  notes.forEach(function(n) {
    n.outboundLinks.forEach(function(link) {
      var target = notes.find(function(t) { return t.title.toLowerCase() === link.toLowerCase(); });
      if (target && target.id !== n.id) edges.push({ source: n.id, target: target.id, type: "link" });
    });
  });
  Object.entries(tagClusters).forEach(function(entry) {
    var tag = entry[0], ids = entry[1];
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        edges.push({ source: ids[i], target: ids[j], type: "tag", tag: tag });
      }
    }
  });
  state.knowledge.graph = { nodes: notes.map(function(n) { return { id: n.id, title: n.title, noteType: inferNoteType(n), tags: n.tags, degree: 0, x: 0, y: 0, vx: 0, vy: 0, _highlight: false }; }), edges: edges };
  state.knowledge.graph.edges.forEach(function(e) {
    var sn = state.knowledge.graph.nodes.find(function(n) { return n.id === e.source; });
    var tn = state.knowledge.graph.nodes.find(function(n) { return n.id === e.target; });
    if (sn) sn.degree++;
    if (tn) tn.degree++;
  });
}

function simulateForces(graph, iterations) {
  iterations = iterations || 150;
  var nodes = graph.nodes;
  var edges = graph.edges;
  if (nodes.length === 0) return;
  var W = 700, H = 500;
  nodes.forEach(function(n, i) {
    if (n.x === 0 && n.y === 0) { var a = (2 * Math.PI * i) / nodes.length; n.x = W/2 + Math.cos(a) * 150; n.y = H/2 + Math.sin(a) * 150; }
  });
  var k = Math.sqrt((W * H) / Math.max(nodes.length, 1));
  for (var iter = 0; iter < iterations; iter++) {
    var temp = Math.max(1 - iter / iterations, 0.01);
    for (var i = 0; i < nodes.length; i++) {
      var fx = 0, fy = 0;
      for (var j = 0; j < nodes.length; j++) {
        if (i === j) continue;
        var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var force = (k * k) / dist;
        fx += (dx / dist) * force;
        fy += (dy / dist) * force;
      }
      nodes[i].vx = (nodes[i].vx + fx) * temp * 0.4;
      nodes[i].vy = (nodes[i].vy + fy) * temp * 0.4;
    }
    edges.forEach(function(e) {
      var s = nodes.find(function(n) { return n.id === e.source; });
      var t = nodes.find(function(n) { return n.id === e.target; });
      if (!s || !t) return;
      var dx2 = t.x - s.x, dy2 = t.y - s.y;
      var dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
      var force2 = (dist2 * dist2) / k;
      var ffx = (dx2 / dist2) * force2, ffy = (dy2 / dist2) * force2;
      s.vx += ffx * temp * 0.3; s.vy += ffy * temp * 0.3;
      t.vx -= ffx * temp * 0.3; t.vy -= ffy * temp * 0.3;
    });
    nodes.forEach(function(n) {
      n.vx += (W/2 - n.x) * 0.001;
      n.vy += (H/2 - n.y) * 0.001;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(20, Math.min(W - 20, n.x));
      n.y = Math.max(20, Math.min(H - 20, n.y));
    });
  }
  nodes.forEach(function(n) { n.vx = 0; n.vy = 0; });
}

function renderMarkdown(md) {
  if (!md) return "";
  var html = md
    .replace(/```([\s\S]*?)```/g, function(_, code) { return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>'; })
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[\[([^\]]+)\]\]/g, '<a class="wiki-link" href="javascript:void(0)" data-action="open-wiki-link" data-link="$1">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, function(m) { return '<ul>' + m + '</ul>'; })
    .replace(/<\/ul>\s*<ul>/g, '')
    .replace(/^(\d+)\.\s+(.+)$/gm, '<li>$2</li>')
    .replace(/(?:^|\n)(?!<[hupobl])((?!<[hupobl])[^\n]+)/g, function(m, p1) { return p1.trim() ? '<p>' + p1.trim() + '</p>' : ''; })
    .replace(/#([a-zA-Z][\w-]*)/g, '<span class="tag tag-brass" style="font-size:0.78rem">#$1</span>');
  return html;
}

function renderMemoryMap() {
  var canvas = document.getElementById("memory-map-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  buildKnowledgeGraph();
  var graph = state.knowledge.graph;
  if (!graph || graph.nodes.length === 0) { ctx.clearRect(0,0,canvas.width,canvas.height); drawEmptyChart(ctx, canvas.width/2, canvas.height/2, "No notes to map"); return; }
  simulateForces(graph);
  state.knowledge.graphLayout = graph;

function drawMemoryMap(ctx, canvas, graph) {
  var W = canvas.width, H = canvas.height;
  var zoom = state.mapView.zoom;
  var panX = state.mapView.panX, panY = state.mapView.panY;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(237,230,212,0.5)"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(139,119,80,0.08)"; ctx.lineWidth = 0.5;
  for (var x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (var y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  var cx = W / 2 + panX, cy = H / 2 + panY;
  var typeColors = { task: "#2C3E6B", journal: "#4A7A30", reference: "#B8860B", idea: "#8B3A3A", draft: "#8B7D6B", note: "#3A5A8B" };
  if (state.mapView.showEdges) {
    graph.edges.forEach(function(e) {
      var s = graph.nodes.find(function(n) { return n.id === e.source; });
      var t = graph.nodes.find(function(n) { return n.id === e.target; });
      if (!s || !t) return;
      var sx = cx + (s.x - 350) * zoom, sy = cy + (s.y - 250) * zoom;
      var tx = cx + (t.x - 350) * zoom, ty = cy + (t.y - 250) * zoom;
      ctx.strokeStyle = e.type === "tag" ? "rgba(74,122,48,0.15)" : "rgba(184,134,11,0.3)";
      ctx.lineWidth = e.type === "tag" ? 0.5 : 1;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
    });
  }
  graph.nodes.forEach(function(n) {
    var nx = cx + (n.x - 350) * zoom, ny = cy + (n.y - 250) * zoom;
    var r = Math.max(5, Math.min(3 + n.degree * 2, 18)) * zoom;
    if (nx < -20 || nx > W + 20 || ny < -20 || ny > H + 20) return;
    ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2);
    var color = typeColors[n.noteType] || "#3A5A8B";
    if (n._highlight) { ctx.fillStyle = "#D4A843"; ctx.globalAlpha = 1; }
    else { ctx.fillStyle = color; ctx.globalAlpha = 0.75; }
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = "#1B2A4A"; ctx.lineWidth = 1; ctx.stroke();
    if (n.id === state.knowledge.activeNoteId) {
      ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(nx, ny, r + 3, 0, Math.PI * 2); ctx.stroke();
    }
    if (r > 4) {
      ctx.fillStyle = "#1B2A4A"; ctx.font = Math.max(9, 10 * zoom) + "px Georgia"; ctx.textAlign = "center";
      ctx.fillText(n.title.length > 18 ? n.title.slice(0, 16) + ".." : n.title, nx, ny + r + 12);
    }
  });
  ctx.fillStyle = "#8B7D6B"; ctx.font = "10px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(graph.nodes.length + " nodes \u00b7 " + graph.edges.length + " edges \u00b7 zoom: " + zoom.toFixed(1) + "x", 10, H - 10);
}

async function summarizeNoteWithAI(note) {
  if (!state.localAI.enabled) { toast("Local AI not available", "error"); return; }
  var prompt = "You are analyzing a personal markdown note. Use only the provided title, excerpt, tags, and extracted links. Do not invent hidden content. Return compact JSON only.\nTitle: " + note.title + "\nExcerpt: " + note.summary + "\nTags: " + note.tags.join(", ") + "\nLinks: " + note.outboundLinks.join(", ") + "\nKeywords: " + note.keywords.slice(0,8).join(", ") + '\nReturn JSON: {"summary":"...","noteType":"...","suggestedTags":["..."],"keywords":["..."],"relatedTopics":["..."],"whyItMatters":"...","possibleConnections":["..."]}';
  var result = await localAIGenerate(prompt);
  if (result) {
    try {
      var cleaned = result.replace(/```json\s*|```/g, "").trim();
      note.aiSummary = JSON.parse(cleaned);
      await dbPut("notes", note);
      toast("AI summary generated", "success");
      renderApp();
    } catch(e) { toast("AI returned invalid JSON", "error"); }
  }
}

function handleClick(e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.dataset.action;
  var id = target.dataset.id;
  var idx = target.dataset.idx;
  var col = target.dataset.col;
  var tag = target.dataset.tag;
  switch(action) {
    case "go-data": switchTab("data"); break;
    case "go-knowledge": switchTab("knowledge"); break;
    case "upload-csv": document.getElementById("csv-upload").click(); break;
    case "upload-json": document.getElementById("json-upload").click(); break;
    case "upload-md": document.getElementById("md-upload").click(); break;
    case "paste-json": showPasteDialog("json"); break;
    case "paste-md": showPasteDialog("markdown"); break;
    case "fetch-url": showFetchUrlDialog(); break;
    case "new-note": showNewNoteDialog(); break;
    case "pick-folder": importMarkdownFolder(); break;
    case "load-sample-data": loadSampleData(); break;
    case "load-sample-notes": loadSampleNotes(); break;
    case "select-dataset":
      state.data.activeDatasetId = id;
      state.dataView.page = 0;
      state.data.currentView = null;
      state.data.selectedColumns = [];
      renderApp();
      break;
    case "select-note":
      state.knowledge.activeNoteId = id;
      state.knowledge.editMode = false;
      renderApp();
      break;
    case "clear-dataset":
      var ds = getActiveDataset();
      if (ds) {
        state.data.datasets = state.data.datasets.filter(function(d) { return d.id !== ds.id; });
        if (state.data.activeDatasetId === ds.id) state.data.activeDatasetId = (state.data.datasets[0] || {}).id || null;
        dbDelete("datasets", ds.id);
        renderApp();
      }
      break;
    case "sort-col":
      state.dataView.sortCol = col;
