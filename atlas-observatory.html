    case "toggle-local-ai": state.localAI.enabled = !state.localAI.enabled; renderApp(); break;
    case "request-persist":
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function(r) { toast("Persistent storage: " + r, "info"); });
      else toast("Not available", "error");
      break;
    case "check-storage": updateStorageInfo(); break;
    case "map-zoom-in": state.mapView.zoom = Math.min(state.mapView.zoom * 1.3, 5); redrawMap(); break;
    case "map-zoom-out": state.mapView.zoom = Math.max(state.mapView.zoom / 1.3, 0.3); redrawMap(); break;
    case "map-center": state.mapView.panX = 0; state.mapView.panY = 0; state.mapView.zoom = 1; redrawMap(); break;
    case "map-toggle-edges": state.mapView.showEdges = !state.mapView.showEdges; redrawMap(); break;
  }
}

function handleChange(e) {
  var target = e.target;
  var action = target.dataset.action;
  if (action === "page-size") { state.dataView.pageSize = parseInt(target.value) || 25; state.dataView.page = 0; renderApp(); }
  if (action === "map-cluster-by") { state.mapView.clusterBy = target.value; renderMemoryMap(); }
  if (target.id === "csv-upload" && target.files.length) { importCsv(target.files[0]); }
  if (target.id === "json-upload" && target.files.length) { importJson(target.files[0]); }
  if (target.id === "md-upload" && target.files.length) { importMarkdownFiles(target.files); }
  if (target.id === "import-state-file" && target.files.length) { importAppState(target.files[0]); }
}

function handleInput(e) {
  var target = e.target;
  var action = target.dataset.action;
  if (action === "filter-table") { state.dataView.filter = target.value; state.dataView.page = 0; renderApp(); }
  if (action === "search-notes") { state.ui.searchQuery = target.value; renderApp(); }
  if (action === "map-search") {
    var q = target.value.toLowerCase();
    if (state.knowledge.graphLayout) {
      state.knowledge.graphLayout.nodes.forEach(function(n) { n._highlight = q && n.title.toLowerCase().indexOf(q) >= 0; });
      redrawMap();
    }
  }
}

function showPasteDialog(type) {
  var title = type === "json" ? "Paste JSON Data" : "Paste Markdown Note";
  var placeholder = type === "json" ? '[{"name":"example","value":42}]' : "# Note Title\n\nNote content here...";
  var div = document.createElement("div");
  div.className = "modal-overlay";
  div.innerHTML = '<div class="card modal-card"><h3 style="margin-bottom:10px">' + title + '</h3><textarea id="paste-input" style="width:100%;min-height:200px;font-family:var(--font-mono);font-size:0.88rem" placeholder="' + placeholder + '"></textarea><div class="flex-row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="paste-cancel">Cancel</button><button class="btn btn-accent" id="paste-submit">Import</button></div></div>';
  document.body.appendChild(div);
  document.getElementById("paste-cancel").onclick = function() { div.remove(); };
  document.getElementById("paste-submit").onclick = function() {
    var val = document.getElementById("paste-input").value;
    if (type === "json") { importJsonText(val, "pasted-json"); }
    else {
      var note = parseMarkdownNote(val, { sourceType: "paste" });
      state.knowledge.notes.push(note); dbPut("notes", note); buildBacklinks();
      toast("Note imported", "success"); renderApp();
    }
    div.remove();
  };
}

function showFetchUrlDialog() {
  var div = document.createElement("div");
  div.className = "modal-overlay";
  div.innerHTML = '<div class="card modal-card"><h3 style="margin-bottom:10px">Fetch Public JSON</h3><input type="url" id="fetch-url-input" placeholder="https://example.com/data.json" style="width:100%"><div class="flex-row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="fetch-cancel">Cancel</button><button class="btn btn-accent" id="fetch-submit">Fetch</button></div></div>';
  document.body.appendChild(div);
  document.getElementById("fetch-cancel").onclick = function() { div.remove(); };
  document.getElementById("fetch-submit").onclick = function() { var url = document.getElementById("fetch-url-input").value; if (url) fetchPublicJson(url); div.remove(); };
}

function showNewNoteDialog() {
  var div = document.createElement("div");
  div.className = "modal-overlay";
  div.innerHTML = '<div class="card modal-card"><h3 style="margin-bottom:10px">Create New Note</h3><label>Title</label><input type="text" id="new-note-title" placeholder="Note title"><label style="margin-top:8px">Body</label><textarea id="new-note-body" style="width:100%;min-height:150px;font-family:var(--font-mono)" placeholder="# Note Title\n\nContent here..."></textarea><div class="flex-row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="new-note-cancel">Cancel</button><button class="btn btn-green" id="new-note-submit">Create</button></div></div>';
  document.body.appendChild(div);
  document.getElementById("new-note-cancel").onclick = function() { div.remove(); };
  document.getElementById("new-note-submit").onclick = function() {
    var title = document.getElementById("new-note-title").value || "Untitled";
    var body = document.getElementById("new-note-body").value;
    createNote({ title: title, body: body });
    div.remove();
  };
}

var mapDragging = false, mapDragStart = { x: 0, y: 0 };
function mapMouseDown(e) { mapDragging = true; mapDragStart = { x: e.clientX - state.mapView.panX, y: e.clientY - state.mapView.panY }; }
function mapMouseMove(e) { if (!mapDragging) return; state.mapView.panX = e.clientX - mapDragStart.x; state.mapView.panY = e.clientY - mapDragStart.y; redrawMap(); }
function mapMouseUp() { mapDragging = false; }
function mapWheel(e) { e.preventDefault(); state.mapView.zoom = e.deltaY < 0 ? Math.min(state.mapView.zoom * 1.1, 5) : Math.max(state.mapView.zoom / 1.1, 0.3); redrawMap(); }

function redrawMap() {
  var canvas = document.getElementById("memory-map-canvas");
  if (!canvas || !state.knowledge.graphLayout) return;
  var ctx = canvas.getContext("2d");
  drawMemoryMap(ctx, canvas, state.knowledge.graphLayout);
}

// Nav tab click handler via delegation
document.addEventListener("click", function(e) {
  var tabBtn = e.target.closest("nav#app-nav button[data-tab]");
  if (tabBtn) { switchTab(tabBtn.dataset.tab); }
});

// Initialize
init();
</script>
</body>
</html>
