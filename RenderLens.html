<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RenderLens — Format-Aware Document Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />

  <!-- CDN dependencies — exact versions only -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.0/dist/browser/markdown-it.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js"></script>

  <!-- Analytics Lite -->
  <script src="analytics-lite.js" data-site-id="junkdrawer" data-api="https://lab.aismallbizguru.com/api/analytics/collect" defer></script>

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-bg: #eff6ff;
  --scrollbar: #cbd5e1;
  --scrollbar-hover: #94a3b8;
  --badge-text: #f8fafc;
  --badge-md: #8b5cf6;
  --badge-html: #f59e0b;
  --badge-xml: #10b981;
  --badge-json: #3b82f6;
  --badge-code: #ef4444;
  --badge-plain: #6b7280;
  --shadow: rgba(0,0,0,0.06);
  --focus-ring: rgba(59,130,246,0.35);
  --toolbar-bg: #f8fafc;
  --code-bg: #1e293b;
  --code-text: #e2e8f0;
  --table-border: #e2e8f0;
  --table-header-bg: #f1f5f9;
  --table-alt-bg: #f8fafc;
  --boundary-line: rgba(100,116,139,0.2);
  --boundary-label: rgba(100,116,139,0.5);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1219;
    --surface: #1a1f2e;
    --surface-alt: #1e2436;
    --border: #2a3145;
    --border-strong: #3b4460;
    --text: #e8edf5;
    --text-muted: #8896b0;
    --text-faint: #5d6b87;
    --accent: #60a5fa;
    --accent-hover: #93bbfd;
    --accent-bg: #1e293b;
    --scrollbar: #3b4460;
    --scrollbar-hover: #5d6b87;
    --shadow: rgba(0,0,0,0.25);
    --focus-ring: rgba(96,165,250,0.35);
    --toolbar-bg: #1e2436;
    --code-bg: #0d1117;
    --code-text: #c9d1d9;
    --table-border: #2a3145;
    --table-header-bg: #1e2436;
    --table-alt-bg: #1a1f2e;
    --boundary-line: rgba(136,150,176,0.15);
    --boundary-label: rgba(136,150,176,0.4);
  }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

/* Layout */
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  line-height: 1.5;
}

#app-header {
  flex: 0 0 auto;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

#app-header h1 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

#app-header h1 span.subtitle {
  font-weight: 400;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-left: 0.25rem;
}

.header-actions { display: flex; gap: 0.5rem; align-items: center; }

/* Main Split */
#main-split { flex: 1 1 0; display: flex; min-height: 0; gap: 0; }

.pane { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; }
.pane:first-child { border-right: 1px solid var(--border); }

.pane-header {
  flex: 0 0 auto;
  padding: 0.5rem 0.75rem;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Source Pane */
#source-pane textarea {
  flex: 1;
  width: 100%;
  padding: 0.875rem;
  border: none;
  outline: none;
  resize: none;
  font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
  font-size: 0.8125rem;
  line-height: 1.6;
  tab-size: 2;
  background: var(--surface-alt);
  color: var(--text);
  scrollbar-width: thin;
}

#source-pane textarea:focus {
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--accent);
}

#source-pane textarea::placeholder { color: var(--text-faint); }

.source-footer {
  flex: 0 0 auto;
  padding: 0.375rem 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.75rem;
  color: var(--text-muted);
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.source-footer .stats { display: flex; gap: 0.75rem; margin-right: auto; }
.source-footer .stats span { white-space: nowrap; }

/* Rendered Pane */
#rendered-pane { background: var(--surface); }
#rendered-pane .pane-content {
  flex: 1; overflow-y: auto; padding: 1.25rem; scrollbar-width: thin;
}

.rendered-toolbar {
  flex: 0 0 auto;
  padding: 0.375rem 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  min-height: 2rem;
}

.rendered-toolbar .badge-group { display: flex; gap: 0.25rem; flex-wrap: wrap; }
.rendered-toolbar .spacer { flex: 1; }

.rendered-toolbar .toggle-label {
  display: flex; align-items: center; gap: 0.375rem;
  color: var(--text-muted); cursor: pointer; user-select: none;
}
.rendered-toolbar .toggle-label input[type="checkbox"] { accent-color: var(--accent); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.35rem 0.7rem; font-size: 0.75rem; font-weight: 500;
  border: 1px solid var(--border); border-radius: 0.375rem;
  background: var(--surface); color: var(--text);
  cursor: pointer; transition: all 0.12s ease;
  white-space: nowrap; line-height: 1.4;
}
.btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface-alt); color: var(--text); border-color: var(--border); }
.btn-icon { padding: 0.35rem; min-width: 1.75rem; justify-content: center; }

/* Format Badges */
.format-badge {
  display: inline-flex; align-items: center;
  padding: 0.125rem 0.45rem;
  font-size: 0.65rem; font-weight: 600;
  letter-spacing: 0.03em; border-radius: 0.25rem;
  text-transform: uppercase; color: var(--badge-text); line-height: 1.3;
}
.format-badge.md { background: var(--badge-md); }
.format-badge.html { background: var(--badge-html); }
.format-badge.xml { background: var(--badge-xml); }
.format-badge.json { background: var(--badge-json); }
.format-badge.code { background: var(--badge-code); }
.format-badge.text { background: var(--badge-plain); }
.format-badge.count { background: transparent; color: var(--text-faint); font-weight: 400; }

/* Boundary markers */
.segment-boundary {
  position: relative; margin: 0.5rem 0; padding: 0.5rem 0;
  border-top: 1px dashed var(--boundary-line);
}
.segment-boundary:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.segment-boundary .boundary-label {
  position: absolute; top: -0.45rem; left: 0;
  font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em;
  color: var(--boundary-label); background: var(--surface);
  padding: 0 0.35rem; text-transform: uppercase; line-height: 1;
}

/* Rendered content typography */
.rendered-doc { max-width: 100%; overflow-wrap: break-word; }
.rendered-doc h1, .rendered-doc h2, .rendered-doc h3, .rendered-doc h4 {
  margin: 1rem 0 0.5rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em;
}
.rendered-doc h1 { font-size: 1.35rem; }
.rendered-doc h2 { font-size: 1.15rem; }
.rendered-doc h3 { font-size: 1rem; }
.rendered-doc h4 { font-size: 0.9rem; }
.rendered-doc p { margin: 0.5rem 0; }
.rendered-doc ul, .rendered-doc ol { margin: 0.5rem 0; padding-left: 1.5rem; }
.rendered-doc li { margin: 0.2rem 0; }
.rendered-doc blockquote {
  margin: 0.5rem 0; padding: 0.25rem 0.75rem;
  border-left: 3px solid var(--accent);
  color: var(--text-muted); background: var(--surface-alt);
  border-radius: 0 0.25rem 0.25rem 0;
}
.rendered-doc hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
.rendered-doc pre {
  margin: 0.5rem 0; padding: 0.75rem;
  background: var(--code-bg); color: var(--code-text);
  border-radius: 0.375rem; overflow-x: auto;
  font-family: 'SF Mono','Cascadia Code','JetBrains Mono','Menlo','Consolas',monospace;
  font-size: 0.8125rem; line-height: 1.5;
}
.rendered-doc code {
  font-family: 'SF Mono','Cascadia Code','JetBrains Mono','Menlo','Consolas',monospace;
  font-size: 0.8125em; padding: 0.1em 0.3em;
  background: var(--surface-alt); border-radius: 0.2em;
}
.rendered-doc pre code { padding: 0; background: transparent; font-size: 0.8125rem; }
.rendered-doc table {
  border-collapse: collapse; margin: 0.75rem 0; width: 100%; font-size: 0.8125rem;
}
.rendered-doc th, .rendered-doc td {
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--table-border);
  text-align: left; vertical-align: top;
}
.rendered-doc th { background: var(--table-header-bg); font-weight: 600; }
.rendered-doc tr:nth-child(even) td { background: var(--table-alt-bg); }
.rendered-doc img { max-width: 100%; height: auto; border-radius: 0.375rem; margin: 0.5rem 0; }
.rendered-doc a { color: var(--accent); text-decoration: none; }
.rendered-doc a:hover { text-decoration: underline; }
.rendered-doc details {
  margin: 0.5rem 0; padding: 0.5rem;
  background: var(--surface-alt); border-radius: 0.375rem;
  border: 1px solid var(--border);
}
.rendered-doc summary { font-weight: 600; cursor: pointer; padding: 0.25rem 0; }

/* Structured data (XML/JSON rendering) */
.structured-object {
  margin: 0.75rem 0;
  border: 1px solid var(--border);
  border-radius: 0.375rem;
  background: var(--surface-alt);
  overflow: hidden;
}
.structured-object .object-title {
  font-weight: 600;
  font-size: 0.875rem;
  padding: 0.5rem 0.75rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.structured-field {
  display: flex;
  padding: 0.375rem 0.75rem;
  border-bottom: 1px solid var(--border);
  gap: 0.75rem;
  font-size: 0.8125rem;
  line-height: 1.5;
  align-items: baseline;
}
.structured-field:last-of-type {
  border-bottom: none;
}
.structured-field .field-label {
  flex: 0 0 30%;
  font-weight: 500;
  color: var(--text-muted);
  word-break: break-word;
  min-width: 6rem;
}
.structured-field .field-value {
  flex: 1;
  word-break: break-word;
  color: var(--text);
}
.structured-nested {
  margin: 0.5rem 0 0.5rem 1rem;
  padding-left: 0.75rem;
  border-left: 2px solid var(--border-strong);
}
.structured-list-item {
  padding: 0.25rem 0.75rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8125rem;
}
.structured-list-item:last-child {
  border-bottom: none;
}
.xml-table-wrap {
  margin: 0.75rem 0;
  overflow-x: auto;
}
.xml-table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8125rem;
}
.xml-table-wrap caption {
  font-weight: 600;
  font-size: 0.875rem;
  padding: 0.375rem 0;
  text-align: left;
  color: var(--text);
}
.xml-table-wrap th {
  background: var(--table-header-bg);
  font-weight: 600;
  padding: 0.375rem 0.625rem;
  border: 1px solid var(--table-border);
  text-align: left;
  white-space: nowrap;
}
.xml-table-wrap td {
  padding: 0.375rem 0.625rem;
  border: 1px solid var(--table-border);
  vertical-align: top;
}
.xml-table-wrap tr:nth-child(even) td {
  background: var(--table-alt-bg);
}
.structured-fallback {
  margin: 0.5rem 0;
  padding: 0.75rem;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 0.375rem;
  font-family: 'SF Mono','Cascadia Code','JetBrains Mono','Menlo','Consolas',monospace;
  font-size: 0.8125rem;
  overflow-x: auto;
  white-space: pre-wrap;
  color: var(--text);
}
.parse-error-warning {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.3rem 0.5rem;
  margin-bottom: 0.375rem;
  font-size: 0.7rem;
  color: #ea580c;
  background: #fff7ed;
  border-radius: 0.25rem;
  border: 1px solid #fed7aa;
}
@media (prefers-color-scheme: dark) {
  .parse-error-warning {
    color: #fb923c;
    background: #2d1b0e;
    border-color: #78350f;
  }
}
</style>
</head>
<body>
  <header id="app-header">
    <h1>🔍 RenderLens <span class="subtitle">Format-Aware Document Viewer</span></h1>
    <div class="header-actions">
      <button class="btn btn-ghost" id="loadSampleBtn" title="Load built-in test sample">📋 Load Sample</button>
    </div>
  </header>

  <div id="main-split">
    <!-- Source Pane -->
    <div class="pane" id="source-pane">
      <div class="pane-header">
        <span>Source</span>
      </div>
      <textarea id="sourceInput" spellcheck="false" placeholder="Paste annotation data, mixed-format model responses, or any document with embedded formats here…"></textarea>
      <div class="source-footer">
        <div class="stats" id="sourceStats">
          <span id="statChars">0 chars</span>
          <span id="statLines">0 lines</span>
        </div>
        <button class="btn btn-primary" id="renderBtn">▶ Render</button>
        <button class="btn btn-ghost" id="clearBtn">✕ Clear</button>
      </div>
    </div>

    <!-- Rendered Pane -->
    <div class="pane" id="rendered-pane">
      <div class="pane-header">
        <span>Interpreted View</span>
      </div>
      <div class="rendered-toolbar" id="renderedToolbar">
        <div class="badge-group" id="formatBadges"></div>
        <span class="spacer"></span>
        <label class="toggle-label">
          <input type="checkbox" id="showBoundariesToggle">
          Show Boundaries
        </label>
        <button class="btn btn-ghost btn-icon" id="copySourceBtn" title="Copy source text">📄</button>
        <button class="btn btn-ghost btn-icon" id="copyRenderedBtn" title="Copy rendered text">📋</button>
      </div>
      <div class="pane-content" id="renderedContent">
        <div class="status-msg">Paste text in the left pane and click Render, or use <strong>Load Sample</strong>.</div>
      </div>
    </div>
  </div>

  <!-- Copy Toast -->
  <div class="copy-toast" id="copyToast"></div>
<script>
// ==========================================================================
// RenderLens — Format-Aware Document Viewer
// All application JavaScript
// ==========================================================================

(function() {
  'use strict';

  /* ---- State ---- */
  var state = {
    sourceText: '',
    segments: [],
    showBoundaries: false,
    md: null
  };

  /* ---- Utilities ---- */
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function pluralize(n, s) { return n + ' ' + s + (n !== 1 ? 's' : ''); }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function debounce(fn, ms) {
    var timer = null;
    return function() {
      var ctx = this, args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
    };
  }

  function showToast(msg, duration) {
    duration = duration || 1800;
    var el = document.getElementById('copyToast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, duration);
  }

  function getFormatTypes(segs) {
    var types = [], seen = {};
    for (var i = 0; i < segs.length; i++) {
      var t = segs[i].type;
      if (!seen[t]) { seen[t] = true; types.push(t); }
    }
    return types;
  }

  /* ---- Source Normalization ---- */
  function normalizeLineEndings(text) {
    return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  }

  /* ---- Protected-Region Detection ---- */
  /**
   * First pass: find fenced code blocks (``` or ~~~).
   * These regions are protected from further format detection.
   * Returns fences array and protectedText with markers substituted.
   */
  function protectCodeFences(text) {
    var fences = [];
    var re = /(?:^|\n)( {0,3})(```|~~~)(\w*)\n([\s\S]*?)\n\1\2(?:\n|$)/gm;
    var match;
    var protectedText = text;
    var offset = 0;

    while ((match = re.exec(text)) !== null) {
      var indent = match[1];
      var fenceChar = match[2];
      var lang = match[3] || '';
      var content = match[4];
      var full = match[0];
      var start = match.index;
      var end = start + full.length;
      var marker = '\x00PROTX' + fences.length + '\x00';

      fences.push({
        start: start, end: end, content: full,
        language: lang, innerContent: content, marker: marker
      });

      protectedText = protectedText.slice(0, start - offset) +
        marker + protectedText.slice(end - offset);
      offset += (full.length - marker.length);
    }
    return { fences: fences, protectedText: protectedText };
  }

  /* ---- Format Detectors ---- */
  /** Each detector returns { type, reason, confidence } or null. Tried in priority order. */

  function detectJSON(text) {
    var trimmed = text.trim();
    if (!trimmed) return null;
    var first = trimmed.charAt(0);
    if (first !== '{' && first !== '[') return null;
    try {
      var parsed = JSON.parse(trimmed);
      if (typeof parsed === 'object' && parsed !== null) {
        return { type: 'json', reason: 'valid JSON object/array', confidence: 'high' };
      }
    } catch (_) {}
    return null;
  }

  function detectXML(text) {
    var trimmed = text.trim();
    if (!trimmed || trimmed.charAt(0) !== '<') return null;
    var lower = trimmed.toLowerCase();
    var htmlRoots = ['<html','<!doctype html','<head','<body','<div','<p ','<span',
      '<h1','<h2','<h3','<table','<ul','<ol','<li','<a ','<img','<br','<hr',
      '<form','<input','<select','<style','<script','<nav','<header','<footer',
      '<main','<section','<article','<aside','<button','<label','<option'];
    for (var i = 0; i < htmlRoots.length; i++) {
      if (lower.indexOf(htmlRoots[i]) === 0) return null;
    }
    // Need at least one tag-like construct
    var tagLike = /<([a-zA-Z_:][a-zA-Z0-9_:.-]*)[\s>]/g;
    if (!tagLike.test(trimmed)) return null;
    try {
      var parser = new DOMParser();
      var doc = parser.parseFromString(trimmed, 'text/xml');
      if (doc.querySelectorAll('parsererror').length > 0) return null;
      var root = doc.documentElement;
      if (!root) return null;
      var hasContent = root.children.length > 0 ||
        root.attributes.length > 0 ||
        (root.textContent && root.textContent.trim().length > 0);
      if (!hasContent && trimmed.length < 10) return null;
      return { type: 'xml', reason: 'parseable XML document', confidence: 'high' };
    } catch (_) {}
    return null;
  }

  /**
   * Extract a complete JSON structure from text starting at a given position.
   * Uses brace/bracket depth counting to find the matching close.
   * Returns { content, endIdx } or null.
   */
  function tryExtractJSON(text, pos) {
    var first = text[pos];
    var closeChar = first === '{' ? '}' : ']';
    var depth = 0;
    var inString = false;
    var escaped = false;
    var i = pos;
    for (; i < text.length; i++) {
      var ch = text[i];
      if (escaped) { escaped = false; continue; }
      if (ch === '\\' && inString) { escaped = true; continue; }
      if (ch === '"' && !escaped) { inString = !inString; continue; }
      if (inString) continue;
      if (ch === first) depth++;
      if (ch === closeChar) {
        depth--;
        if (depth === 0) {
          var candidate = text.slice(pos, i + 1);
          try {
            var parsed = JSON.parse(candidate);
            if (parsed !== null && typeof parsed === 'object') {
              return { content: candidate, endIdx: i + 1 };
            }
          } catch (_) {}
          return null;
        }
      }
    }
    return null;
  }

  /**
   * Extract a complete XML document from text starting at a given position.
   * Finds the root opening tag, builds a depth counter, and matches the close.
   * Returns { content, endIdx } or null.
   */

    var wrapper = document.createElement('div');
    wrapper.innerHTML = purified;
    var links = wrapper.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) {

  /* ---- Document Renderer ---- */
  /**
   * Render the full ordered segment list into the rendered pane.
   */
  function renderDocument() {
    var container = document.getElementById('renderedContent');
    var showBounds = state.showBoundaries;
    var segs = state.segments;

    if (!segs || segs.length === 0) {
      container.innerHTML = '<div class="status-msg">Paste text in the left pane and click Render, or use <strong>Load Sample</strong>.</div>';
      updateBadges([]);
      return;
    }

    var html = '<div class="rendered-doc">';

    for (var i = 0; i < segs.length; i++) {
      var seg = segs[i];
      var segHtml = '';

      try {
        switch (seg.type) {
          case 'markdown':
            segHtml = renderMarkdown(seg.content);
            break;
          case 'xml':
            segHtml = renderXMLSegment(seg);
            break;
          case 'json':
            segHtml = renderJSONSegment(seg);
            break;
          case 'code':
            segHtml = renderCode(seg.sourceContent || seg.content, seg.language);
            break;
          case 'html':
            segHtml = renderHTML(seg.content);
            break;
          default:
            segHtml = renderMarkdown(seg.content);
            break;
        }
      } catch (err) {
        segHtml = '<div class="parse-error-warning">\u26a0 Render error: ' +
          escapeHtml(err.message) + '</div>' +
          '<div class="structured-fallback">' + escapeHtml(seg.content) + '</div>';
      }

      if (showBounds) {
        var boundaryLabel = getBoundaryLabel(seg.type);
        html += '<div class="segment-boundary">';
        html += '<span class="boundary-label">' + boundaryLabel + '</span>';
        html += segHtml;
        html += '</div>';
      } else {
        html += segHtml;
      }
    }

    html += '</div>';
    container.innerHTML = html;
    updateBadges(segs);
  }

  /* ---- UI Handlers ---- *//* ---- UI Handlers ---- */
  function updateBadges(segs) {
    var badgeContainer = document.getElementById('formatBadges');
    var types = getFormatTypes(segs);
    var counts = {};
    for (var i = 0; i < segs.length; i++) {
      var t = segs[i].type;
      counts[t] = (counts[t] || 0) + 1;
    }
    var html = '';
    var typeMap = {
      'markdown': 'md', 'html': 'html', 'xml': 'xml',
      'json': 'json', 'code': 'code', 'text': 'text'
    };
    var labelMap = {
      'markdown': 'Markdown', 'html': 'HTML', 'xml': 'XML',
      'json': 'JSON', 'code': 'Code', 'text': 'Text'
    };
    for (var j = 0; j < types.length; j++) {
      var cls = typeMap[types[j]] || 'text';
      var label = labelMap[types[j]] || types[j];
      html += '<span class="format-badge ' + cls + '">' + label + '</span>';
      if (counts[types[j]] > 1) {
        html += '<span class="format-badge count">×' + counts[types[j]] + '</span>';
      }
    }
    badgeContainer.innerHTML = html || '<span class="format-badge text">Text</span>';
  }

  function updateStats(text) {
    document.getElementById('statChars').textContent = pluralize(text.length, 'char');
    document.getElementById('statLines').textContent = pluralize(text.split('\n').length, 'line');
  }

  function performRender() {
    var textarea = document.getElementById('sourceInput');
    var text = textarea.value;
    state.sourceText = text;
    updateStats(text);

    if (!text.trim()) {
      state.segments = [];
      renderDocument();
      return;
    }

    state.segments = buildSegments(text);
    renderDocument();
  }

  function handleClear() {
    document.getElementById('sourceInput').value = '';
    state.sourceText = '';
    state.segments = [];
    updateStats('');
    renderDocument();
  }

  /* ---- Initialization ---- */
  function init() {
    var sourceInput = document.getElementById('sourceInput');
    var renderBtn = document.getElementById('renderBtn');
    var clearBtn = document.getElementById('clearBtn');
    var loadSampleBtn = document.getElementById('loadSampleBtn');
    var showBoundariesToggle = document.getElementById('showBoundariesToggle');
    var copySourceBtn = document.getElementById('copySourceBtn');
    var copyRenderedBtn = document.getElementById('copyRenderedBtn');
// Dependency self-test
    var depErrors = [];
    if (typeof window.markdownit !== 'function') depErrors.push('Markdown renderer failed to load.');
    if (typeof window.DOMPurify === 'undefined') depErrors.push('DOMPurify failed to load.');
    if (depErrors.length > 0) {
      var renderedContent = document.getElementById('renderedContent');
      renderedContent.innerHTML = '<div class="rendered-doc">' +
        depErrors.map(function(e) {
          return '<div class="parse-error-warning">\u26a0 ' + e + '</div>';
        }).join('') + '</div>';
    }

    // Auto-render on paste with debounce
    var debouncedRender = debounce(performRender, 250);
    sourceInput.addEventListener('input', debouncedRender);
    sourceInput.addEventListener('paste', function() {
      setTimeout(debouncedRender, 50);
    });

    // Explicit render button
    renderBtn.addEventListener('click', performRender);

    // Clear button
    clearBtn.addEventListener('click', handleClear);

    // Load sample
    loadSampleBtn.addEventListener('click', handleLoadSample);

    // Show boundaries toggle
    showBoundariesToggle.addEventListener('change', function() {
      state.showBoundaries = this.checked;
      renderDocument();
    });

    // Copy buttons
    copySourceBtn.addEventListener('click', handleCopySource);
    copyRenderedBtn.addEventListener('click', handleCopyRendered);
  }

  // Kick off on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  function handleCopySource() {
    var text = state.sourceText || document.getElementById('sourceInput').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(function() {
      showToast('Source copied');
    })['catch'](function() {
      showToast('Copy failed');
    });
  }

  function handleCopyRendered() {
    var container = document.getElementById('renderedContent');
    var text = container.textContent || container.innerText || '';
    if (!text || text.indexOf('Paste text') !== -1) return;
    navigator.clipboard.writeText(text).then(function() {
      showToast('Rendered text copied');
    })['catch'](function() {
      showToast('Copy failed');
    });
  }

  function handleLoadSample() {
    document.getElementById('sourceInput').value = SAMPLE_TEXT;
    performRender();
  }
  function getBoundaryLabel(type) {
    switch (type) {
      case 'markdown': return 'MARKDOWN';
      case 'html': return 'HTML';
      case 'xml': return 'XML';
      case 'json': return 'JSON';
      case 'code': return 'CODE';
      default: return 'TEXT';
    }
  }

  function renderXMLSegment(seg) {
    var data = parseXML(seg.content);
    if (!data) {
      return '<div class="parse-error-warning">⚠ XML parsing failed — showing raw content</div>' +
        '<div class="structured-fallback">' + escapeHtml(seg.content) + '</div>';
    }
    return renderStructuredData(data);
  }

  function renderJSONSegment(seg) {
    try {
      var parsed = JSON.parse(seg.content.trim());
      var data = jsonToData(parsed);
      return renderStructuredData(data);
    } catch (e) {
      return '<div class="parse-error-warning">⚠ JSON parsing failed — showing raw content</div>' +
        '<div class="structured-fallback">' + escapeHtml(seg.content) + '</div>';
    }
  }

  function isComplexValue(v) {
    return v !== null && typeof v === 'object';
  }

  function formatLeafValue(v) {
    if (v === null) return 'null';
    if (v === undefined) return '';
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return String(v);
  }

  function humanizeKey(key) {
    var s = key.replace(/[_-]/g, ' ');
    s = s.replace(/([a-z])([A-Z])/g, '$1 $2');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function humanizeTag(tag) {
    // Convert XML tag names to readable labels
    // personName → Person Name, person_name → Person Name, Person → Person
    var s = tag.replace(/[_-]/g, ' ');
    // Insert space before uppercase letters (camelCase)
    s = s.replace(/([a-z])([A-Z])/g, '$1 $2');
    // Uppercase first letter
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /**
   * Parse XML text and return a data representation object,
   * or null if parsing fails.
   */
  function parseXML(text) {
    try {
      var parser = new DOMParser();
      var doc = parser.parseFromString(text, 'text/xml');
      var errors = doc.querySelectorAll('parsererror');
      if (errors.length > 0) return null;
      var root = doc.documentElement;
      if (!root) return null;
      return elementToData(root);
    } catch (e) {
      return null;
    }
  }
