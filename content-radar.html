  renderCurrentView();
}

async function toggleLocalAI() {
  if (!state.localAI.enabled) {
    const ready = await ensureLocalAIReady();
    if (!ready) {
      toast("Local AI not available: " + (state.localAI.availability || state.localAI.lastError || "unknown"), "error");
      return;
    }
    toast("Local AI enabled", "success");
  } else {
    state.localAI.enabled = false;
    await saveSetting("localAiEnabled", false);
    toast("Local AI disabled", "info");
  }
  renderCurrentView();
}

async function showStorageEstimate() {
  const info = document.getElementById("storage-info");
  if (!info) return;
  if (navigator.storage && navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    const items = await dbGetAll("items");
    const scans = await dbGetAll("scans");
    const sources = await dbGetAll("sources");
    info.innerHTML = `Quota: ${(est.quota/1024/1024).toFixed(1)} MB | Used: ${(est.usage/1024/1024).toFixed(2)} MB<br>
      Items: ${items.length} | Scans: ${scans.length} | Sources: ${sources.length}`;
  } else {
    const items = await dbGetAll("items");
    info.innerHTML = `Items: ${items.length} (estimate API unavailable)`;
  }
}

async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    const result = await navigator.storage.persist();
    toast("Persistent storage: " + (result ? "granted" : "denied"), result ? "success" : "error");
  } else {
    toast("Persistent storage API not available", "error");
  }
}

async function clearDatabase() {
  if (!confirm("Clear entire database? This cannot be undone.")) return;
  await dbClear("items");
  await dbClear("scans");
  await dbClear("sources");
  await dbClear("settings");
  await dbClear("briefs");
  await dbClear("classifierRules");
  state.items = [];
  await loadSources();
  await loadSettings();
  await refreshItems();
  renderCurrentView();
  toast("Database cleared", "info");
}

async function clearAllItems() {
  if (!confirm("Clear all items? This cannot be undone.")) return;
  await dbClear("items");
  state.items = [];
  renderCurrentView();
  toast("All items cleared", "info");
}

async function clearDismissed() {
  const all = await getAllItems();
  let count = 0;
  for (const item of all) {
    if (item.dismissed) { await dbDelete("items", item.id); count++; }
  }
  await refreshItems();
  renderCurrentView();
  toast(`Cleared ${count} dismissed items`, "info");
}

async function clearHidden() {
  const all = await getAllItems();
  let count = 0;
  for (const item of all) {
    if (item.hidden) { await dbDelete("items", item.id); count++; }
  }
  await refreshItems();
  renderCurrentView();
  toast(`Cleared ${count} hidden items`, "info");
}

async function deleteItem(id) {
  await dbDelete("items", id);
  await refreshItems();
  renderCurrentView();
}

async function exportItemsJson() {
  const items = await getAllItems();
  const json = JSON.stringify(items, null, 2);
  await saveFile("content-radar-items.json", json, "application/json");
}

async function handleImport(file) {
  if (!file) return;
  await importJson(file);
}

async function toggleStar(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) { const all = await getAllItems(); const found = all.find(i => i.id === id); if (found) { found.starred = !found.starred; await saveItem(found); } }
  else { item.starred = !item.starred; await saveItem(item); }
  await refreshItems();
  renderCurrentView();
}

async function dismissItem(id) {
  const item = state.items.find(i => i.id === id);
  if (item) { item.dismissed = true; await saveItem(item); await refreshItems(); renderCurrentView(); }
}

async function hideItem(id) {
  const item = state.items.find(i => i.id === id);
  if (item) { item.hidden = true; await saveItem(item); await refreshItems(); renderCurrentView(); }
}

async function unDismissItem(id) {
  const all = await getAllItems();
  const item = all.find(i => i.id === id);
  if (item) { item.dismissed = false; await saveItem(item); await refreshItems(); renderArchiveItems(""); }
}

async function unHideItem(id) {
  const all = await getAllItems();
  const item = all.find(i => i.id === id);
  if (item) { item.hidden = false; await saveItem(item); await refreshItems(); renderArchiveItems(""); }
}

function copyDraft(id, type) {
  const item = state.items.find(i => i.id === id);
  if (!item) { toast("Item not found","error"); return; }
  const draft = generateDeterministicDraft(item, type);
  copyToClipboard(draft);
}

async function toggleSource(id) {
  const source = state.sources.find(s => s.id === id);
  if (source) {
    source.enabled = !source.enabled;
    await saveSource(source);
    renderCurrentView();
  }
}

function toggleAutoWatch() {
  if (state.polling.active) pauseAutoWatch();
  else startAutoWatch();
  renderCurrentView();
}

async function runSourceNow(id) {
  const source = state.sources.find(s => s.id === id);
  state.scanning = true;
  startScanProgress("Single Source Pull", 1);
  updateScanProgress({current: source?.name || id});
  pushScanLog(`Starting ${source?.name || id}`, "info");
  updateHeaderStatus();
  try {
    const scan = await runSource(id);
    await refreshItems();
    state.scanning = false;
    updateScanProgress({completed: 1, current: ""});
    renderCurrentView();
    if (scan && scan.status === "error") {
      pushScanLog(`${source?.name || id} failed: ${scan.error}`, "error");
      finishScanProgress("Pull failed", "error");
      toast("Source scan failed: " + scan.error, "error");
    } else {
      pushScanLog(`${source?.name || id} complete: ${scan?.resultCount || 0} fetched, ${scan?.newCount || 0} stored`, "ok");
      finishScanProgress("Pull complete: " + state.items.length + " active items", "ok");
      toast("Source scan complete", "success");
    }
  } catch(e) {
    pushScanLog(`${source?.name || id} failed: ${e.message}`, "error");
    toast("Scan failed: " + e.message, "error");
    state.scanning = false;
    finishScanProgress("Pull failed", "error");
  }
  updateHeaderStatus();
}

function openItemDetail(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) {
    const overlay = document.getElementById("detail-overlay");
    overlay.style.display = "none";
    return;
  }
  const overlay = document.getElementById("detail-overlay");
  const hooks = generateHeadlineHooks(item);
  const scoresHtml = Object.entries(item.contentScores).map(([k,v]) => {
    const pct = v;
    const color = v > 40 ? "var(--neon-green)" : v > 20 ? "var(--neon-amber)" : "var(--text3)";
    return `<div class="mini-bar-container"><span style="min-width:100px">${OUTPUT_LABELS[k]||k}</span><div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:${color}"></div></div><span>${v}</span></div>`;
  }).join("");

  overlay.innerHTML = `<div class="detail-content">
    <button class="detail-close" onclick="closeDetail()" aria-label="Close">&times;</button>
    <div class="card-title" style="font-size:18px;margin-bottom:8px">${esc(item.title)}</div>
    <div class="card-meta">
      <span>${item.sourceName}</span>
      ${item.domain ? `<span>${item.domain}</span>` : ""}
      <span>${formatDate(item.publishedAt)}</span>
      <span>Fetched: ${formatDate(item.fetchedAt)}</span>
    </div>
    ${item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noopener" style="color:var(--neon-cyan);font-size:13px">${esc(item.url)}</a>` : ""}
    ${item.description ? `<div style="font-size:13px;color:var(--text2);margin-top:8px">${esc(item.description).slice(0,300)}</div>` : ""}
    <div style="margin:12px 0">${item.classifierLabels.map(l => `<span class="tag tag-${l}">${l.replace(/_/g," ")}</span>`).join("")}</div>
    <div style="margin:8px 0"><span class="caution-badge caution-${item.caveats}">${item.caveats.replace(/_/g," ")}</span></div>
    <div class="section-title" style="margin-top:16px">Content Scores</div>
    ${scoresHtml}
    <div style="margin-top:8px;font-size:13px"><strong>Total Opportunity Score: ${item.totalOpportunityScore}</strong></div>
    <div class="section-title" style="margin-top:16px">Reasons</div>
    <ul style="padding-left:16px;font-size:13px;color:var(--text2)">${item.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
    <div class="section-title" style="margin-top:16px">Headline Hooks</div>
    <div class="hook-line hook-serious"><strong>Serious:</strong> ${esc(hooks.serious)}</div>
    <div class="hook-line hook-sarcastic"><strong>Sarcastic:</strong> ${esc(hooks.sarcastic)}</div>
    <div class="hook-line hook-clicky"><strong>Clicky:</strong> ${esc(hooks.clickyButNotGross)}</div>
    <div class="section-title" style="margin-top:16px">Drafts</div>
    <div class="actions" style="margin-bottom:8px">
      <button class="btn btn-primary" onclick="copyDraft('${item.id}','facebook')">Facebook Draft</button>
      <button class="btn" onclick="copyDraft('${item.id}','song')">Song Concept</button>
      <button class="btn" onclick="copyDraft('${item.id}','image')">Image Prompt</button>
      <button class="btn" onclick="copyDraft('${item.id}','substack')">Substack Draft</button>
      <button class="btn" onclick="copyDraft('${item.id}','techdemo')">Tech Demo</button>
      <button class="btn" onclick="copyDraft('${item.id}','absurdity')">Absurdity Entry</button>
    </div>
    ${item.aiBrief ? `<div class="section-title">AI Classification</div><div style="font-size:13px;color:var(--text2);white-space:pre-wrap">${esc(JSON.stringify(item.aiBrief, null, 2))}</div>` : ""}
    <div class="section-title" style="margin-top:16px">Deterministic Brief</div>
    <div style="font-size:13px;color:var(--text2)">${esc(item.deterministicBrief)}</div>
    <div class="section-title" style="margin-top:16px">Raw Metadata</div>
    <details><summary style="font-size:12px;color:var(--text2);cursor:pointer">Show raw</summary>
      <pre style="font-size:11px;color:var(--text2);overflow-x:auto;max-height:200px">${esc(JSON.stringify(item.raw, null, 1)).slice(0,2000)}</pre>
    </details>
    <div class="actions" style="margin-top:16px">
      <button class="btn btn-sm" onclick="toggleStar('${item.id}');closeDetail()">${item.starred ? "Unstar" : "Star"}</button>
      <button class="btn btn-sm" onclick="dismissItem('${item.id}');closeDetail()">Dismiss</button>
      <button class="btn btn-sm" onclick="hideItem('${item.id}');closeDetail()">Hide</button>
      <button class="btn btn-sm btn-amber" onclick="runAIOnItem('${item.id}')">Run AI Classification</button>
    </div>
  </div>`;
  overlay.style.display = "block";
  overlay.onclick = (e) => { if (e.target === overlay) closeDetail(); };
}

function closeDetail() {
  document.getElementById("detail-overlay").style.display = "none";
}

async function runAIOnItem(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  if (!await ensureLocalAIReady()) {
    toast("AI session failed: " + (state.localAI.lastError || state.localAI.availability || ""), "error");
    return;
  }
  toast("Running AI classification...", "info");
  const result = await runAIClassification(item);
  if (result) {
    await saveItem(item);
    openItemDetail(id);
    toast("AI classification complete", "success");
  } else {
    toast("AI classification failed", "error");
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDetail();
});

document.addEventListener("visibilitychange", () => {
  if (state.settings.pauseWhenHidden && document.hidden && state.polling.active) {
    pauseAutoWatch();
    state.polling._autoPaused = true;
  }
  if (!document.hidden && state.polling._autoPaused) {
    startAutoWatch();
    state.polling._autoPaused = false;
  }
});

async function initLocalAI() {
  const avail = await checkLocalAI();
  if (avail === "readily") {
    toast("Chrome local AI detected — creating session", "info");
    const created = await createLocalAISession();
    if (created) {
      state.localAI.enabled = true;
      await saveSetting("localAiEnabled", true);
      toast("Local AI session ready", "success");
    } else {
      toast("Local AI session failed: " + (state.localAI.lastError || ""), "error");
    }
  } else if (avail === "after-download") {
    toast("Chrome local AI available after download — enable in Admin when ready", "info");
  }
}

async function init() {
  try {
    await initDb();
    await loadSettings();
    await loadSources();
    await refreshItems();

    initLocalAI();

    if (state.settings.autoWatchEnabled || state.settings.resumeAutoWatchOnOpen) {
      startAutoWatch();
    }

    renderApp();
  } catch(e) {
    toast("Init error: " + e.message, "error");
    console.error("Content Radar init error:", e);
  }
}

init();
</script>
</body>
</html>
