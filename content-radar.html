<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Radar</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #141418;
  --bg3: #1a1a20;
  --card: #1e1e26;
  --card-hover: #24242e;
  --border: #2a2a36;
  --text: #eaeaf0;
  --text2: #c8c8d8;
  --text3: #8e8ea8;
  --neon-red: #ff2d55;
  --neon-cyan: #00e5ff;
  --neon-amber: #ffab00;
  --neon-green: #00e676;
  --neon-purple: #b388ff;
  --neon-pink: #ff80ab;
  --neon-orange: #ff6e40;
  --glow-red: 0 0 12px rgba(255,45,85,0.4);
  --glow-cyan: 0 0 12px rgba(0,229,255,0.4);
  --glow-amber: 0 0 12px rgba(255,171,0,0.4);
  --glow-green: 0 0 12px rgba(0,230,118,0.4);
  --font-mono: 'Courier New', Courier, monospace;
  --font-sans: system-ui, -apple-system, sans-serif;
  --radius: 4px;
  --radius-lg: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

#app { display: flex; flex-direction: column; height: 100vh; }

header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 48px;
  flex-shrink: 0;
}
header h1 {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
  letter-spacing: 1px;
  white-space: nowrap;
}
header .tagline {
  font-size: 12px;
  color: var(--text2);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
header .header-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text2);
}
header .header-status .status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  background: var(--text3);
  border: 1px solid var(--text2);
}
header .header-status .status-dot.active { background: var(--neon-green); box-shadow: var(--glow-green); }
header .header-status .status-dot.scanning { background: var(--neon-amber); box-shadow: var(--glow-amber); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  gap: 2px;
  flex-shrink: 0;
  overflow-x: auto;
}
nav button {
  background: none;
  border: none;
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 8px 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
nav button:hover { color: #fff; }
nav button.active { color: var(--neon-cyan); border-bottom-color: var(--neon-cyan); }

main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
#deploy-footer {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text3);
  font: 11px/1.4 var(--font-mono);
  padding: 6px 16px;
  text-align: center;
}
.view { display: none; }
.view.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--text3); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
  gap: 8px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
}
.card-title a {
  color: var(--text);
  text-decoration: none;
}
.card-title a:hover { color: var(--neon-cyan); text-decoration: underline; }
.card-meta {
  font-size: 12px;
  color: var(--text2);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.card-meta span { white-space: nowrap; }
.card-scores {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.score-chip {
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: var(--radius);
  background: var(--bg2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.score-chip.high { border-color: var(--neon-green); color: var(--neon-green); }
.score-chip.medium { border-color: var(--neon-amber); color: var(--neon-amber); }
.score-chip.low { border-color: var(--text3); color: var(--text3); }
.score-chip.caution { border-color: var(--neon-red); color: var(--neon-red); }

.tag {
  display: inline-block;
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: 2px;
  margin: 1px;
  white-space: nowrap;
}
.tag-ai_panic { background: rgba(179,136,255,0.2); color: var(--neon-purple); }
.tag-tech_dystopia { background: rgba(0,229,255,0.15); color: var(--neon-cyan); }
.tag-political_absurdity { background: rgba(255,45,85,0.15); color: var(--neon-red); }
.tag-dating_relationships { background: rgba(255,128,171,0.15); color: var(--neon-pink); }
.tag-animal_chaos { background: rgba(0,230,118,0.15); color: var(--neon-green); }
.tag-crypto_chaos { background: rgba(255,171,0,0.15); color: var(--neon-amber); }
.tag-local_weirdness { background: rgba(255,110,64,0.15); color: var(--neon-orange); }
.tag-culture_war { background: rgba(255,45,85,0.2); color: var(--neon-red); }
.tag-health_wellness { background: rgba(0,230,118,0.2); color: var(--neon-green); }
.tag-space_weather { background: rgba(0,229,255,0.2); color: var(--neon-cyan); }
.tag-natural_hazard { background: rgba(255,171,0,0.2); color: var(--neon-amber); }
.tag-open_source_dev { background: rgba(179,136,255,0.2); color: var(--neon-purple); }
.tag-weird_but_fun { background: rgba(0,230,118,0.15); color: var(--neon-green); }
.tag-too_dark { background: rgba(255,45,85,0.25); color: var(--neon-red); }
.tag-too_sensitive { background: rgba(255,45,85,0.2); color: var(--neon-red); }
.tag-low_signal { background: rgba(102,102,128,0.2); color: var(--text3); }

.caution-badge {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: var(--radius);
  font-weight: 600;
}
.caution-safe_fun { background: rgba(0,230,118,0.15); color: var(--neon-green); }
.caution-discuss_carefully { background: rgba(255,171,0,0.15); color: var(--neon-amber); }
.caution-too_tragic { background: rgba(255,45,85,0.2); color: var(--neon-red); }
.caution-political_fire { background: rgba(255,45,85,0.25); color: var(--neon-red); }
.caution-health_claims_need_caution { background: rgba(255,171,0,0.2); color: var(--neon-amber); }
.caution-financial_advice_risk { background: rgba(255,171,0,0.2); color: var(--neon-amber); }
.caution-unverified_claims { background: rgba(255,110,64,0.15); color: var(--neon-orange); }
.caution-likely_low_signal { background: rgba(102,102,128,0.2); color: var(--text3); }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 5px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg3); color: var(--text); border-color: var(--text3); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--neon-cyan); outline-offset: 1px; }
.btn-primary { background: rgba(0,229,255,0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); }
.btn-primary:hover { background: rgba(0,229,255,0.25); }
.btn-danger { background: rgba(255,45,85,0.1); border-color: var(--neon-red); color: var(--neon-red); }
.btn-danger:hover { background: rgba(255,45,85,0.2); }
.btn-amber { background: rgba(255,171,0,0.1); border-color: var(--neon-amber); color: var(--neon-amber); }
.btn-amber:hover { background: rgba(255,171,0,0.2); }
.btn-green { background: rgba(0,230,118,0.1); border-color: var(--neon-green); color: var(--neon-green); }
.btn-green:hover { background: rgba(0,230,118,0.2); }
.btn-sm { font-size: 10px; padding: 2px 5px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.section-title {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--neon-amber);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.mini-bar-container { display: flex; align-items: center; gap: 4px; font-size: 10px; }
.mini-bar { height: 6px; border-radius: 3px; background: var(--border); flex: 1; max-width: 80px; overflow: hidden; }
.mini-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

#radar-canvas {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1;
  display: block;
  margin: 0 auto;
}

.top-card {
  border-left: 3px solid var(--neon-amber);
  padding-left: 12px;
}
.top-card.hank { border-left-color: var(--neon-red); }
.top-card.song { border-left-color: var(--neon-purple); }
.top-card.facebook { border-left-color: var(--neon-cyan); }
.top-card.visual { border-left-color: var(--neon-green); }
.top-card.caution { border-left-color: var(--neon-red); }

.source-card {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.source-card .source-name { font-weight: 600; font-size: 14px; min-width: 180px; }
.source-card .source-status { font-size: 12px; }
.scan-progress {
  margin-bottom: 12px;
}
.progress-track {
  height: 8px;
  border-radius: 4px;
  background: var(--border);
  overflow: hidden;
  margin: 8px 0;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
  transition: width 0.25s ease;
}
.scan-log {
  max-height: 140px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text2);
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding-top: 8px;
}
.scan-log div { margin-bottom: 3px; }
.scan-log .ok { color: var(--neon-green); }
.scan-log .error { color: var(--neon-red); }
.scan-log .info { color: var(--neon-cyan); }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.filters select, .filters input {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
}
.filters select:focus, .filters input:focus { border-color: var(--neon-cyan); outline: none; }

.detail-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  overflow-y: auto;
  padding: 24px;
}
.detail-content {
  max-width: 700px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  position: relative;
}
.detail-close {
  position: absolute;
  top: 8px; right: 8px;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 20px;
  cursor: pointer;
}
.detail-close:hover { color: var(--text); }

.toast-container {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 14px;
  border-radius: var(--radius);
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  animation: slideIn 0.3s ease-out;
  max-width: 350px;
}
.toast.success { border-color: var(--neon-green); color: var(--neon-green); }
.toast.error { border-color: var(--neon-red); color: var(--neon-red); }
.toast.info { border-color: var(--neon-cyan); color: var(--neon-cyan); }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.welcome-card {
  text-align: center;
  padding: 40px 20px;
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
}
.welcome-card h2 {
  font-family: var(--font-mono);
  color: var(--neon-cyan);
  font-size: 22px;
  margin-bottom: 12px;
  text-shadow: var(--glow-cyan);
}
.welcome-card p { color: var(--text2); margin-bottom: 8px; }
.welcome-card .welcome-actions { margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

textarea, input[type="text"], input[type="number"], input[type="url"] {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  width: 100%;
}
textarea:focus, input:focus { border-color: var(--neon-cyan); outline: none; }
textarea { resize: vertical; min-height: 80px; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table th, table td {
  padding: 6px 8px;
  border: 1px solid var(--border);
  text-align: left;
}
table th {
  background: var(--bg2);
  font-family: var(--font-mono);
  color: var(--text2);
  font-weight: 600;
}}
table tr:hover { background: var(--bg3); }

.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  background: var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
  display: inline-block;
  vertical-align: middle;
}
.toggle.on { background: var(--neon-cyan); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text);
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(16px); }

.diag-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 12px;
}
.diag-grid dt { color: var(--text2); font-family: var(--font-mono); }
.diag-grid dd { color: var(--text); }

.radar-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text2);
  justify-content: center;
}
.radar-legend span { display: flex; align-items: center; gap: 4px; }
.radar-legend .dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}

.scanner-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  animation: scanLine 3s linear infinite;
  pointer-events: none;
}
@keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }

.keyword-bucket {
  padding: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.keyword-bucket h4 {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--neon-amber);
  margin-bottom: 4px;
}
.keyword-bucket .keywords {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
}

.brief-preview {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  white-space: pre-wrap;
  max-height: 500px;
  overflow-y: auto;
  line-height: 1.6;
}

.privacy-note {
  font-size: 11px;
  color: var(--text2);
  border-top: 1px solid var(--border);
  padding-top: 8px;
  margin-top: 12px;
  line-height: 1.5;
}

.hook-line {
  font-size: 13px;
  margin: 2px 0;
  padding: 2px 4px;
  border-radius: 2px;
}
.hook-serious { border-left: 2px solid var(--neon-cyan); }
.hook-sarcastic { border-left: 2px solid var(--neon-amber); }
.hook-clicky { border-left: 2px solid var(--neon-green); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>CONTENT RADAR</h1>

</div>

const APP_NAME = "Content Radar";
const DB_NAME = "contentRadarDB";

const KEYWORD_BUCKETS = {
  ai_panic: ["AI","artificial intelligence","chatbot","LLM","large language model","robot","automation","hallucination","lawsuit","regulation","threat","job loss","replaced","deepfake","backlash","banned"],

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function formatDate(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const now = new Date();
  const diffMs = now - d;
  if (diffMs < 60000) return "just now";
  if (diffMs < 3600000) return Math.floor(diffMs/60000) + "m ago";
  if (diffMs < 86400000) return Math.floor(diffMs/3600000) + "h ago";
  return d.toLocaleDateString("en-US", {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function clampScore(v) { return Math.max(0, Math.min(100, Math.round(v))); }

function toast(message, type="info") {
  const c = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = message;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity 0.3s"; setTimeout(() => t.remove(), 300); }, 3000);
}

function generateId(prefix) {

function startViewTransition(fn) {
  if (document.startViewTransition) {

  } else {

}

function switchView(view) {

  });
}

function pushScanLog(message, type = "info") {
  const time = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  state.scanProgress.log.unshift({time, message, type});
  state.scanProgress.log = state.scanProgress.log.slice(0, 20);
  updateScanProgressUI();
}

function updateScanProgress(patch = {}) {
  state.scanProgress = {...state.scanProgress, ...patch};
  updateScanProgressUI();
  updateHeaderStatus();

function finishScanProgress(message, type = "ok") {

  state.scanProgress.active = false;
  state.scanProgress.current = "";
  updateScanProgressUI();
  updateHeaderStatus();

function renderScanProgressHTML() {
  const p = state.scanProgress;
  if (!p.active && p.log.length === 0) return "";
  const pct = p.total ? Math.round((p.completed / p.total) * 100) : 0;
  const current = p.current ? `<div style="font-size:12px;color:var(--text2)">Now: ${esc(p.current)}</div>` : "";

    ? `<div class="scan-log">${p.log.map(entry => `<div class="${entry.type}">[${entry.time}] ${esc(entry.message)}</div>`).join("")}</div>`
    : "";
  return `<div class="card scan-progress">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div>
        <div class="card-title">${esc(p.label || "Source Pull")}</div>

    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${log}
  </div>`;
}

  const item = {

const CORS_PROXY_FALLBACKS = [
  "https://corsproxy.io/?",
  "https://api.codetabs.com/v1/proxy?quest=",
  "https://api.allorigins.win/raw?url="
];

function getCorsProxyPrefixes() {
  const configured = (state.settings.corsProxy || "").trim();
  if (!configured) return [];
  const proxies = [];
  if (configured && !configured.includes("allorigins.win")) proxies.push(configured);
  CORS_PROXY_FALLBACKS.forEach(proxy => {
    if (!proxies.includes(proxy)) proxies.push(proxy);
  });
  return proxies;
}

async function corsFetch(url, options = {}, fetchOptions = {}) {
  const proxies = fetchOptions.useFallbacks === false
    ? [(state.settings.corsProxy || "").trim()].filter(Boolean)
    : getCorsProxyPrefixes();
  if (proxies.length === 0) return fetch(url, options);

  let lastError = null;
  for (const proxy of proxies) {
    try {
      const resp = await fetch(proxy + encodeURIComponent(url), options);
      if (resp.ok || resp.status === 429) return resp;
      lastError = new Error(`proxy ${new URL(proxy).hostname} HTTP ${resp.status}`);
    } catch(e) {
      lastError = e;
    }
  }
  throw new Error("CORS proxy failed: " + (lastError?.message || "network error"));
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function waitForGdeltPacing(label = "GDELT") {
  const delay = state.settings.gdeltDelayMs || 3500;
  const elapsed = Date.now() - state.lastGdeltRequestAt;
  if (state.lastGdeltRequestAt && elapsed < delay) {
    const waitMs = delay - elapsed;
    pushScanLog(`Waiting ${(waitMs/1000).toFixed(1)}s before ${label}`, "info");
    await sleep(waitMs);
  }
}

async function gdeltFetch(url, label = "GDELT") {
  await waitForGdeltPacing(label);
  state.lastGdeltRequestAt = Date.now();
  return corsFetch(url, {}, {useFallbacks: false});
}

async function fetchGdeltSource(source) {
  const q = source.config.query;
  const max = source.config.maxrecords || 20;
  const ts = source.config.timespan || "7d";
  const url = `https://api.gdeltproject.org/api/v2/doc/doc?query=${encodeURIComponent(q)}&mode=artlist&format=json&maxrecords=${max}&sort=HybridRel&timespan=${ts}`;
  const resp = await gdeltFetch(url, source.name);
  if (resp.status === 429) {
    const configuredDelay = state.settings.gdeltDelayMs || 3500;
    const retryAfter = Math.max(parseInt(resp.headers.get("Retry-After") || "0", 10) * 1000 || 0, configuredDelay);
    pushScanLog(`GDELT 429 for ${source.name}; retrying after ${(retryAfter/1000).toFixed(1)}s`, "error");
    await sleep(retryAfter);
    const retry = await gdeltFetch(url, source.name + " retry");
    if (!retry.ok) throw new Error("GDELT rate limited (429). Wait a few minutes and retry.");
    const data = await retry.json();
    return normalizeGdeltArticles(data);
  }
  if (!resp.ok) throw new Error("GDELT HTTP " + resp.status);
  const data = await resp.json();
  return normalizeGdeltArticles(data);
}

function normalizeGdeltArticles(data) {
  const articles = data.articles || [];
  return articles.map(a => ({
    title: a.title,
    url: a.url,
    publishedAt: a.seendate || "",
    domain: (a.url && a.url.match(/:\/\/([^/]+)/)||[])[1] || a.source || "",
    author: "",
    rawScore: null,
    rawComments: null,
    rawTone: a.tone ? parseFloat(a.tone.split(",")[0]) : null,
    rawMetrics: {tone: a.tone, source: a.source, social: a.social, image: a.image},
    country: "",
    language: a.language || ""
  }));
}

async function fetchHackerNewsSource(source) {
  const feed = source.config.feed || "topstories";
  const maxItems = source.config.maxItems || 30;
  const resp = await fetch(`https://hacker-news.firebaseio.com/v0/${feed}.json`);
  if (!resp.ok) throw new Error("HN HTTP " + resp.status);
  const ids = await resp.json();
  const topIds = ids.slice(0, maxItems);
  const items = [];
  const batchSize = 10;
  for (let i = 0; i < topIds.length; i += batchSize) {
    const batch = topIds.slice(i, i + batchSize);
    const results = await Promise.all(batch.map(id =>
      fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json()).catch(() => null)
    ));
    results.forEach(item => {
      if (item && item.type === "story" && item.title) {
        items.push({
          id: String(item.id),
          title: item.title,
          url: item.url || "",
          publishedAt: new Date(item.time * 1000).toISOString(),
          author: item.by || "",
          rawScore: item.score || 0,
          rawComments: item.descendants || 0,
          domain: (item.url && item.url.match(/:\/\/([^/]+)/)||[])[1] || "news.ycombinator.com"
        });
      }
    });
  }
  return items;
}

async function fetchNasaDonkiSource(source) {
  const endpoints = source.config.endpoints || ["CME","FLR"];
  const apiKey = source.config.apiKey || state.settings.nasaApiKey || "DEMO_KEY";
  const now = new Date();
  const start = new Date(now - 7*86400000).toISOString().split("T")[0];
  const end = now.toISOString().split("T")[0];
  const allItems = [];
  for (const ep of endpoints) {
    const url = `https://api.nasa.gov/DONKI/${ep}?startDate=${start}&endDate=${end}&api_key=${apiKey}`;
    try {
      const resp = await fetch(url);
      if (!resp.ok) continue;
      const data = await resp.json();
      (Array.isArray(data) ? data : []).forEach(ev => {
        allItems.push({
          id: ev.activityID || ev.flrID || ev.gstID || ev.sepID || null,
          title: `[${ep}] ${ev.eventType || ep}: ${ev.note || ev.source || ev.activityID || "Space event detected"}`.slice(0,200),
          url: ev.link || "",
          publishedAt: ev.startTime || ev.eventTime || ev.beginTime || "",
          rawScore: ev.link ? 50 : 30,
          rawMetrics: {type: ep, instruments: ev.instruments, linkedEvents: ev.linkedEvents}
        });
      });
    } catch(e) { continue; }
  }
  return allItems;
}

async function fetchUsgsSource(source) {
  const feed = source.config.feed || "significant_day";
  const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feed}.geojson`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("USGS HTTP " + resp.status);
  const data = await resp.json();
  return (data.features || []).map(f => {
    const p = f.properties || {};
    const g = f.geometry || {};
    return {
      id: f.id || p.ids || null,
      title: `M${p.mag || "?"} ${p.place || "Earthquake"}`,
      url: p.url || "",
      publishedAt: p.time ? new Date(p.time).toISOString() : "",
      rawScore: p.mag || 0,
      rawMetrics: {mag: p.mag, place: p.place, felt: p.felt, alert: p.alert, tsunami: p.tsunami, sig: p.sig},
      coordinates: g.coordinates || null,
      domain: "earthquake.usgs.gov"
    };
  });
}

async function fetchRssSource(source) {
  const feeds = source.config.feeds || [];
  const allItems = [];
  for (const feedUrl of feeds) {
    try {
      const resp = await corsFetch(feedUrl);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const text = await resp.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, "text/xml");
      const errNode = xml.querySelector("parsererror");
      if (errNode) throw new Error("XML parse error");
      const entries = xml.querySelectorAll("item, entry");
      entries.forEach(e => {
        const title = e.querySelector("title")?.textContent || "";
        const link = e.querySelector("link")?.textContent || e.querySelector("link")?.getAttribute("href") || "";
        const pubDate = e.querySelector("pubDate, published, updated")?.textContent || "";
        const author = e.querySelector("author name, dc\\:creator, author")?.textContent || "";
        const desc = e.querySelector("description, summary, content")?.textContent?.slice(0,300) || "";
        if (title) {
          allItems.push({title, url: link, publishedAt: pubDate, author, description: desc});
        }
      });
    } catch(e) {
      allItems.push({title: `[CORS/Network error: ${feedUrl}]`, url: "", publishedAt: new Date().toISOString(), _error: true});
    }
  }
  return allItems;
}

async function fetchCustomJsonSource(source) {
  const url = source.config.url;
  if (!url) return [];
  const resp = await corsFetch(url);
  if (!resp.ok) throw new Error("Custom JSON HTTP " + resp.status);
  const data = await resp.json();
  const ip = source.config.itemPath;
  const items = ip ? ip.split(".").reduce((o,k) => o&&o[k], data) : data;
  if (!Array.isArray(items)) return [];
  return items.map(r => ({
    title: r[source.config.titlePath || "title"] || "",
    url: r[source.config.urlPath || "url"] || "",
    publishedAt: r[source.config.datePath || "date"] || "",
    rawScore: r[source.config.scorePath || "score"] || null,
    author: r.author || ""
  }));
}

async function runSource(sourceId) {
  const source = state.sources.find(s => s.id === sourceId);
  if (!source) return;
  let scannedItems = [];
  const scan = {
    id: generateId("scan"),
    sourceId: source.id,
    startedAt: new Date().toISOString(),
    finishedAt: null,
    status: "running",
    requestUrls: [],
    resultCount: 0,
    newCount: 0,
    updatedCount: 0,
    error: null,
    durationMs: 0
  };
  try {
    let rawItems;
    switch(source.type) {
      case "gdelt": rawItems = await fetchGdeltSource(source); break;
      case "hackernews": rawItems = await fetchHackerNewsSource(source); break;
      case "nasa": rawItems = await fetchNasaDonkiSource(source); break;
      case "usgs": rawItems = await fetchUsgsSource(source); break;
      case "rss": rawItems = await fetchRssSource(source); break;
      case "custom_json": rawItems = await fetchCustomJsonSource(source); break;
      default: rawItems = [];
    }
    scan.resultCount = rawItems.length;
    const context = {
      sourceId: source.id,
      sourceGroup: source.sourceGroup,
      sourceName: source.name,
      sourceType: source.type,
      sourceUrl: "",
      categoryHint: source.categoryHint
    };
    const newItems = [];
    for (const raw of rawItems) {
      if (raw._error) continue;
      const item = createItem(raw, context);
      if (!item) continue;
      classifyItem(item);
      scoreContentPotential(item);
      newItems.push(item);
    }
    await storeItems(newItems);
    scannedItems = (await Promise.all(newItems.map(item => dbGet("items", item.id)))).filter(Boolean);
    scan.newCount = newItems.length;
    scan.updatedCount = 0;
    scan.status = "success";
    source.lastStatus = "success";
    source.lastError = null;
    state.polling.failureCounts[source.id] = 0;
  } catch(e) {
    scan.status = "error";
    scan.error = e.message;
    source.lastStatus = "error";
    source.lastError = e.message;
    const fc = (state.polling.failureCounts[source.id] || 0) + 1;
    state.polling.failureCounts[source.id] = fc;
  }
  scan.finishedAt = new Date().toISOString();
  scan.durationMs = new Date(scan.finishedAt) - new Date(scan.startedAt);
  source.lastRunAt = scan.startedAt;
  source.nextRunAt = new Date(Date.now() + (source.pollIntervalMinutes * 60000 * Math.min(1 + (state.polling.failureCounts[source.id]||0), 8))).toISOString();
  await saveScan(scan);
  await saveSource(source);
  if (scannedItems.length && await ensureLocalAIReady()) {
    await runAIOnItems(scannedItems);
  }
  return scan;
}

async function runAllSources() {
  const now = Date.now();
  if (now - state.polling.lastManualScan < state.settings.manualScanCooldownMs) {
    toast("Cooldown active, wait " + Math.ceil((state.settings.manualScanCooldownMs - (now - state.polling.lastManualScan))/1000) + "s", "error");
    return;
  }
  state.polling.lastManualScan = now;
  state.scanning = true;
  const enabled = state.sources.filter(s => s.enabled);
  startScanProgress("Source Pull", enabled.length);
  for (let i = 0; i < enabled.length; i++) {
    const s = enabled[i];
    updateScanProgress({current: s.name});
    pushScanLog(`Starting ${s.name}`, "info");
    try {
      const scan = await runSource(s.id);
      if (scan && scan.status === "error") {
        toast(s.name + ": " + scan.error, "error");
        pushScanLog(`${s.name} failed: ${scan.error}`, "error");
      } else if (scan) {
        pushScanLog(`${s.name} complete: ${scan.resultCount} fetched, ${scan.newCount} stored`, "ok");
      }
    } catch(e) {
      toast(s.name + ": " + e.message, "error");
      pushScanLog(`${s.name} failed: ${e.message}`, "error");
    }
    updateScanProgress({completed: i + 1, current: ""});
  }
  state.scanning = false;
  await refreshItems();
  renderCurrentView();
  finishScanProgress("Pull complete: " + state.items.length + " active items", "ok");
  toast("Scan complete: " + state.items.length + " items", "success");
}

async function runDueSources() {
  const now = Date.now();
  const due = state.sources.filter(s =>
    s.enabled && (!s.nextRunAt || new Date(s.nextRunAt).getTime() <= now)
  );
  if (due.length === 0) return;
  state.scanning = true;
  startScanProgress("Auto-Watch Pull", due.length);
  for (let i = 0; i < due.length; i++) {
    const s = due[i];
    updateScanProgress({current: s.name});
    try {
      const scan = await runSource(s.id);
      if (scan && scan.status === "error") pushScanLog(`${s.name} failed: ${scan.error}`, "error");
      else if (scan) pushScanLog(`${s.name} complete: ${scan.resultCount} fetched`, "ok");
    } catch(e) { pushScanLog(`${s.name} failed: ${e.message}`, "error"); }
    updateScanProgress({completed: i + 1, current: ""});
  }
  state.scanning = false;
  await refreshItems();
  if (state.currentView === "radar" || state.currentView === "feed") {
    renderCurrentView();
  }
  finishScanProgress("Auto-watch pull complete", "ok");
  updateHeaderStatus();
}

function scheduleNextPoll() {
  if (state.polling.timer) clearTimeout(state.polling.timer);
  if (!state.polling.active) return;
  const now = Date.now();
  let nextDue = Infinity;
  state.sources.filter(s => s.enabled).forEach(s => {
    const nt = s.nextRunAt ? new Date(s.nextRunAt).getTime() : now;
    if (nt < nextDue) nextDue = nt;
  });
  const delay = Math.max(Math.min(nextDue - now, 300000), 5000);
  state.polling.nextRunAt = new Date(now + delay).toISOString();
  state.polling.timer = setTimeout(async () => {
    await runDueSources();
    scheduleNextPoll();
  }, delay);
}

function startAutoWatch() {
  state.polling.active = true;
  state.settings.autoWatchEnabled = true;
  scheduleNextPoll();
  updateHeaderStatus();
  toast("Auto-watch started", "success");
}

function pauseAutoWatch() {
  state.polling.active = false;
  if (state.polling.timer) clearTimeout(state.polling.timer);
  state.polling.timer = null;
  state.settings.autoWatchEnabled = false;
  updateHeaderStatus();
  toast("Auto-watch paused", "info");
}

function classifyItem(item) {
  const text = (item.title + " " + item.description + " " + item.subtitle).toLowerCase();
  const labels = [];
  const matchedKeywords = {};
  for (const [label, keywords] of Object.entries(KEYWORD_BUCKETS)) {
    let matchCount = 0;
    const matched = [];
    for (const kw of keywords) {
      if (text.includes(kw.toLowerCase())) {
        matchCount++;
        matched.push(kw);
      }
    }
    if (matchCount > 0) {
      labels.push(label);
      matchedKeywords[label] = matched;
    }
  }
  if (labels.length === 0) labels.push("low_signal");
  item.classifierLabels = labels;
  item.tags = [...labels];
  const lower = text;
  const tooDark = /murder|killed|mass shooting|genocide|child abuse|sexual assault|dead body|suicide|terrorist attack/i.test(lower);
  if (tooDark) {
    if (!labels.includes("too_dark")) { labels.push("too_dark"); item.tags.push("too_dark"); }
  }
}

function scoreContentPotential(item) {
  const scores = item.contentScores;
  const text = (item.title + " " + item.description).toLowerCase();
  const labels = item.classifierLabels;
  const now = Date.now();
  const pubDate = item.publishedAt ? new Date(item.publishedAt).getTime() : 0;
  const ageHours = pubDate ? (now - pubDate) / 3600000 : 24;
  const recencyBoost = Math.max(0, 1 - ageHours / 168);
  const hasLabel = l => labels.includes(l);

  if (hasLabel("ai_panic")) {
    scores.facebookDiscussion += 25 * recencyBoost;
    scores.youtubeShort += 20 * recencyBoost;
    scores.songConcept += 15;
    scores.substackEssay += 20;
    scores.techDemo += 10;
    scores.absurdityArchive += 15;
    scores.hankRantPotential += 25 * recencyBoost;
  }
  if (hasLabel("dating_relationships")) {
    scores.facebookDiscussion += 35 * recencyBoost;
    scores.songConcept += 20;
    scores.absurdityArchive += 10;
    scores.localInterest += 10;
    scores.hankRantPotential += 15;
  }
  if (hasLabel("political_absurdity")) {
    scores.facebookDiscussion += 20;
    scores.absurdityArchive += 25;
    scores.cautionRisk += 20;
    scores.songConcept += 10;
    scores.substackEssay += 10;
    scores.hankRantPotential += 15;
  }
  if (hasLabel("animal_chaos")) {
    scores.facebookDiscussion += 20;
    scores.songConcept += 20;
    scores.imagePrompt += 25;
    scores.absurdityArchive += 30;
    scores.localInterest += 15;
    scores.youtubeShort += 15;
  }
  if (hasLabel("tech_dystopia")) {
    scores.substackEssay += 25;
    scores.facebookDiscussion += 15;
    scores.techDemo += 10;
    scores.absurdityArchive += 15;
    scores.cautionRisk += 10;
    scores.hankRantPotential += 20;
  }
  if (hasLabel("crypto_chaos")) {
    scores.facebookDiscussion += 10;
    scores.cautionRisk += 20;
    scores.absurdityArchive += 15;
    scores.substackEssay += 10;
    scores.youtubeShort += 10;
  }
  if (hasLabel("culture_war")) {
    scores.facebookDiscussion += 15;
    scores.cautionRisk += 25;
    scores.absurdityArchive += 10;
    scores.substackEssay += 10;
  }
  if (hasLabel("health_wellness")) {
    scores.facebookDiscussion += 15;
    scores.cautionRisk += 15;
    scores.substackEssay += 15;
    scores.youtubeShort += 10;
  }
  if (hasLabel("space_weather")) {
    scores.imagePrompt += 30;
    scores.songConcept += 20;
    scores.substackEssay += 10;
    scores.youtubeShort += 15;
    scores.absurdityArchive += 10;
  }
  if (hasLabel("natural_hazard")) {
    scores.imagePrompt += 15;
    scores.localInterest += 20;
    scores.facebookDiscussion += 10;
    scores.substackEssay += 5;
  }
  if (hasLabel("open_source_dev")) {
    scores.techDemo += 30;
    scores.substackEssay += 15;
    scores.youtubeShort += 10;
  }
  if (hasLabel("weird_but_fun")) {
    scores.absurdityArchive += 25;
    scores.facebookDiscussion += 15;
    scores.songConcept += 15;
    scores.imagePrompt += 10;
    scores.youtubeShort += 10;
    scores.hankRantPotential += 10;
  }
  if (hasLabel("local_weirdness")) {
    scores.localInterest += 30;
    scores.facebookDiscussion += 20;
    scores.absurdityArchive += 10;
  }

  if (item.rawScore) {
    if (item.sourceGroup === "HackerNews") {
      const hnBoost = Math.min(item.rawScore / 10, 20);
      scores.techDemo += hnBoost * 0.5;
      scores.substackEssay += hnBoost * 0.3;
      scores.facebookDiscussion += hnBoost * 0.2;
    }
    if (item.sourceGroup === "USGS") {
      const magBoost = Math.min((item.rawScore || 0) * 5, 30);
      scores.imagePrompt += magBoost;
      scores.localInterest += magBoost;
      scores.facebookDiscussion += magBoost * 0.5;
    }
  }
  if (item.rawTone !== null && item.rawTone !== undefined) {
    const toneAbs = Math.abs(item.rawTone);
    if (toneAbs > 5) {
      scores.absurdityArchive += Math.min(toneAbs, 15);
      scores.facebookDiscussion += Math.min(toneAbs * 0.5, 10);
    }
  }
  if (item.rawComments && item.sourceGroup === "HackerNews") {
    scores.facebookDiscussion += Math.min(item.rawComments / 5, 15);
  }

  const titleLen = item.title.length;
  if (titleLen > 10 && titleLen < 80) {
    scores.facebookDiscussion += 5;
    scores.youtubeShort += 5;
  }

  const excl = (item.title.match(/!|breaking|urgent|shocking|outrage|panic|chaos|insane|unbelievable/i) || []).length;
  if (excl > 0) {
    scores.absurdityArchive += excl * 5;
    scores.hankRantPotential += excl * 3;
  }

  if (hasLabel("too_dark")) {
    scores.cautionRisk += 30;
    scores.facebookDiscussion -= 10;
    scores.youtubeShort -= 10;
    scores.songConcept -= 5;
  }

  for (const key of OUTPUT_TYPES) {
    scores[key] = clampScore(scores[key]);
  }

  let total = 0;
  for (const key of OUTPUT_TYPES) {
    const w = state.settings.scoreWeights[key] || 1;
    total += scores[key] * w;
  }
  item.totalOpportunityScore = clampScore(total / OUTPUT_TYPES.length + 30);

  const bestTypes = [];
  const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
  if (sorted[0] && sorted[0][1] > 10) bestTypes.push(sorted[0][0]);
  if (sorted[1] && sorted[1][1] > 10) bestTypes.push(sorted[1][0]);
  item.suggestedOutputs = bestTypes;

  item.reasons = generateReasons(item, scores, labels);
  item.deterministicBrief = generateDeterministicBrief(item);
  item.caveats = generateCaveat(item, scores, labels);
}

function generateReasons(item, scores, labels) {
  const reasons = [];
  const has = l => labels.includes(l);
  if (has("ai_panic")) reasons.push("AI panic/future shock angle — high engagement potential");
  if (has("dating_relationships")) reasons.push("Relationship/dating topic — strong Facebook discussion bait");
  if (has("animal_chaos")) reasons.push("Animal chaos — inherently shareable and visual");
  if (has("political_absurdity")) reasons.push("Political absurdity — satire potential, but handle carefully");
  if (has("tech_dystopia")) reasons.push("Tech dystopia narrative — Substack/essay gold");
  if (has("crypto_chaos")) reasons.push("Crypto volatility — commentary opportunity, financial caution");
  if (has("culture_war")) reasons.push("Culture war angle — likely engagement, high caution");
  if (has("health_wellness")) reasons.push("Health/wellness trend — discussion bait, verify claims");
  if (has("space_weather")) reasons.push("Space event — great visual/ambient content potential");
  if (has("natural_hazard")) reasons.push("Natural hazard — local interest, visual potential");
  if (has("weird_but_fun")) reasons.push("Inherently weird/fun — absurdity archive candidate");
  if (has("local_weirdness")) reasons.push("Local/regional angle — community discussion starter");
  if (has("open_source_dev")) reasons.push("Dev/tech story — demo or commentary potential");
  if (item.rawScore > 100) reasons.push("High community engagement signal (" + item.rawScore + ")");
  if (scores.hankRantPotential > 40) reasons.push("Hank rant potential: " + scores.hankRantPotential);
  if (scores.songConcept > 30) reasons.push("Song bait: title has lyrical potential");
  if (scores.imagePrompt > 30) reasons.push("Visual content potential");
  if (reasons.length === 0) reasons.push("Low signal — probably skip");
  return reasons.slice(0, 5);
}

function generateDeterministicBrief(item) {
  const labels = item.classifierLabels;
  const has = l => labels.includes(l);
  let brief = `Based on title/metadata: "${item.title}" from ${item.domain || item.sourceName}. `;
  if (has("ai_panic")) brief += "AI-related topic with panic/backlash signals. ";
  if (has("animal_chaos")) brief += "Animal-related chaos or comedy. ";
  if (has("dating_relationships")) brief += "Relationship/dating culture story. ";
  if (has("political_absurdity")) brief += "Political story with absurd/satirical angle. ";
  if (has("weird_but_fun")) brief += "Weird/fun story with shareability. ";
  if (item.totalOpportunityScore > 60) brief += "High content opportunity score. ";
  else if (item.totalOpportunityScore < 25) brief += "Low opportunity score. ";
  return brief;
}

function generateCaveat(item, scores, labels) {
  if (labels.includes("too_dark")) return "too_tragic";
  if (scores.cautionRisk > 50) {
    if (labels.includes("political_absurdity") || labels.includes("culture_war")) return "political_fire";
    if (labels.includes("crypto_chaos")) return "financial_advice_risk";
    if (labels.includes("health_wellness")) return "health_claims_need_caution";
    return "discuss_carefully";
  }
  if (scores.cautionRisk > 25) return "discuss_carefully";
  if (item.totalOpportunityScore < 20) return "likely_low_signal";
  if (!item.url) return "unverified_claims";
  return "safe_fun";
}

function generateHeadlineHooks(item) {
  const t = item.title;
  const serious = t.length > 60 ? t.slice(0,57) + "..." : t;
  const sarcastic = "You won't believe " + (item.classifierLabels.includes("animal_chaos") ? "what this animal did" : item.classifierLabels.includes("ai_panic") ? "what the robots are up to now" : item.classifierLabels.includes("crypto_chaos") ? "what crypto bros are crying about" : "what just happened");
  const clicky = t.replace(/^(The|A|An)\s+/i, "").slice(0,50) + ": Here's why it matters";
  return {serious, sarcastic, clickyButNotGross: clicky};
}

function generateDeterministicDraft(item, type) {
  const hooks = generateHeadlineHooks(item);
  const angle = item.reasons[0] || "Content opportunity";
  const caution = item.caveats;
  const cautionNote = caution !== "safe_fun" ? `\nCaution: ${caution}` : "";
  switch(type) {
    case "facebook":
      return `${hooks.sarcastic}\n\n${item.title}\nSource: ${item.domain || item.sourceName}\n${item.url || "(no link)"}\n\nAngle: ${angle}${cautionNote}\n\nWhat do you think — funny, concerning, or both?`;
    case "song":
      const genreHint = item.classifierLabels.includes("ai_panic") ? "synth-blues" : item.classifierLabels.includes("animal_chaos") ? "rockabilly" : item.classifierLabels.includes("crypto_chaos") ? "country-swamp" : item.classifierLabels.includes("dating_relationships") ? "indie folk" : "garage rock";
      return `Song: "${hooks.sarcastic}"\nGenre hint: ${genreHint}\nHook: ${item.title}\nAngle: ${angle}\n\nVerse idea: Write from the perspective of someone who just found out about this.\nChorus: Repeat the absurd core as a mantra.`;
    case "image":
      return `Image prompt seed: "${item.title}"\nStyle: Wide aspect, no text, editorial illustration\nMood: ${item.classifierLabels.includes("ai_panic") ? "neon dystopian" : item.classifierLabels.includes("animal_chaos") ? "whimsical chaos" : item.classifierLabels.includes("space_weather") ? "cosmic awe" : "dark editorial"}\nElements: ${item.reasons.slice(0,3).join(", ")}`;
    case "substack":
      return `# ${hooks.serious}\n\n> ${angle}\n\n${item.title} — ${item.domain || item.sourceName}\n\n${item.deterministicBrief}${cautionNote}`;
    case "techdemo":
      return `Tech demo idea: "${item.title}"\nBased on: ${item.domain || item.sourceName}\nAngle: ${angle}\nApproach: Build a minimal prototype or visualization around this concept.`;
    case "absurdity":
      return `[Absurdity Archive Entry]\n"${item.title}"\nSource: ${item.domain || item.sourceName}\nScore: ${item.totalOpportunityScore}\nReason: ${angle}${cautionNote}`;
    default:
      return `${item.title}\n${item.deterministicBrief}\nScore: ${item.totalOpportunityScore}`;
  }
}

async function checkLocalAI() {
  if (!window.LanguageModel) {
    state.localAI.availability = "unavailable";
    return "unavailable";
  }
  try {
    state.localAI.checking = true;
    const avail = await LanguageModel.availability({
      expectedInputs: [{ type: "text", languages: ["en"] }],
      expectedOutputs: [{ type: "text", languages: ["en"] }]
    });
    state.localAI.availability = avail;
    state.localAI.checking = false;
    return avail;
  } catch(e) {
    state.localAI.availability = "unavailable";
    state.localAI.lastError = e.message;
    state.localAI.checking = false;
    return "unavailable";
  }
}

function getLocalAISessionOptions() {
  return {
    expectedInputs: [{ type: "text", languages: ["en"] }],
    expectedOutputs: [{ type: "text", languages: ["en"] }]
  };
}

async function createLocalAISession() {
  if (!window.LanguageModel) {
    state.localAI.lastError = "LanguageModel API not available in this browser";
    return false;
  }
  try {
    const session = await LanguageModel.create(getLocalAISessionOptions());
    state.localAI.session = session;
    return true;
  } catch(e) {
    state.localAI.lastError = e.message;
    if (e.message && e.message.includes("download")) {
      state.localAI.availability = "after-download";
    }
    return false;
  }
}

async function ensureLocalAIReady() {
  if (state.localAI.enabled && state.localAI.session) return true;
  const avail = state.localAI.availability || await checkLocalAI();
  if (avail !== "readily") return false;
  if (!state.localAI.session) {
    const created = await createLocalAISession();
    if (!created) return false;
  }
  state.localAI.enabled = true;
  await saveSetting("localAiEnabled", true);
  return true;
}

async function runAIClassification(item) {
  if (!state.localAI.session) {
    const created = await createLocalAISession();
    if (!created) return null;
  }
  const prompt = `You are Content Radar's local classifier.
Analyze only the metadata provided.
Do not claim to have read the full article unless full text is present.
Classify whether this item is useful for content creation.

Return compact JSON:
{
  "bestOutputType": "...",
  "opportunityScore": 0-100,
  "labels": ["..."],
  "whyItMightWork": ["..."],
  "suggestedAngle": "...",
  "headlineHooks": {
    "serious": "...",
    "sarcastic": "...",
    "clickyButNotGross": "..."
  },
  "songConcept": {
    "title": "...",
    "genreHint": "...",
    "hook": "..."
  },
  "imagePromptSeed": "...",
  "facebookPrompt": "...",
  "caution": "...",
  "confidence": "low|medium|high"
}

Metadata:
Title: ${item.title}
Source: ${item.sourceName}
Domain: ${item.domain}
Published: ${item.publishedAt}
Score: ${item.rawScore}
Description: ${item.description || "(none)"}
Existing labels: ${item.classifierLabels.join(", ")}
Existing scores: ${JSON.stringify(item.contentScores)}`;

  try {
    const result = await state.localAI.session.prompt(prompt);
    try {
      const parsed = JSON.parse(result);
      item.aiBrief = parsed;
      return parsed;
    } catch(e) {
      item.aiBrief = {rawText: result};
      return null;
    }
  } catch(e) {
    state.localAI.lastError = e.message;
    return null;
  }
}

async function runAIOnItems(items) {
  if (!items.length || !await ensureLocalAIReady()) return;
  const candidates = [...items]
    .filter(i => !i.dismissed && !i.hidden && i.totalOpportunityScore > 30 && !i.aiBrief)
    .sort((a,b) => b.totalOpportunityScore - a.totalOpportunityScore)
    .slice(0, state.settings.maxAiItemsPerScan);
  for (const item of candidates) {
    await runAIClassification(item);
    await saveItem(item);
  }
}

async function runAIOnTopCandidates() {
  if (!await ensureLocalAIReady()) return;
  const candidates = state.items
    .filter(i => !i.dismissed && !i.hidden && i.totalOpportunityScore > 30 && !i.aiBrief)
    .sort((a,b) => b.totalOpportunityScore - a.totalOpportunityScore)
    .slice(0, state.settings.maxAiItemsPerScan);
  for (const item of candidates) {
    await runAIClassification(item);
    await saveItem(item);
  }
}

function initDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("items")) {
        const items = db.createObjectStore("items", {keyPath: "id"});
        items.createIndex("sourceGroup","sourceGroup",{unique:false});
        items.createIndex("sourceName","sourceName",{unique:false});
        items.createIndex("publishedAt","publishedAt",{unique:false});
        items.createIndex("fetchedAt","fetchedAt",{unique:false});
        items.createIndex("totalOpportunityScore","totalOpportunityScore",{unique:false});
        items.createIndex("domain","domain",{unique:false});
        items.createIndex("starred","starred",{unique:false});
        items.createIndex("hidden","hidden",{unique:false});
        items.createIndex("dismissed","dismissed",{unique:false});
      }
      if (!db.objectStoreNames.contains("scans")) db.createObjectStore("scans",{keyPath:"id"});
      if (!db.objectStoreNames.contains("sources")) db.createObjectStore("sources",{keyPath:"id"});
      if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings",{keyPath:"key"});
      if (!db.objectStoreNames.contains("briefs")) db.createObjectStore("briefs",{keyPath:"id"});
      if (!db.objectStoreNames.contains("classifierRules")) db.createObjectStore("classifierRules",{keyPath:"id"});
    };
    req.onsuccess = (e) => { state.db = e.target.result; resolve(state.db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbTx(store, mode="readonly") {
  const tx = state.db.transaction(store, mode);
  return tx.objectStore(store);
}

function dbPut(store, item) {
  return new Promise((resolve, reject) => {
    const s = dbTx(store, "readwrite");
    const r = s.put(item);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const s = dbTx(store);
    const r = s.get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const s = dbTx(store);
    const r = s.getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const s = dbTx(store, "readwrite");
    const r = s.delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

function dbClear(store) {
  return new Promise((resolve, reject) => {
    const s = dbTx(store, "readwrite");
    const r = s.clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

async function storeItems(items) {
  for (const item of items) {
    const existing = await dbGet("items", item.id);
    if (existing) {
      if (item.rawScore && existing.rawScore && item.rawScore > existing.rawScore) {
        await dbPut("items", {...existing, ...item, starred: existing.starred, hidden: existing.hidden, dismissed: existing.dismissed});
      }
    } else {
      await dbPut("items", item);
    }
  }
}

async function saveItem(item) { return dbPut("items", item); }
async function saveScan(scan) { return dbPut("scans", scan); }
async function saveSource(source) { return dbPut("sources", source); }

async function loadSettings() {
  const rows = await dbGetAll("settings");
  const s = {};
  rows.forEach(r => s[r.key] = r.value);
  state.settings = {...DEFAULT_SETTINGS, ...s};
  if (state.settings.scoreWeights) {
    state.settings.scoreWeights = {...DEFAULT_SETTINGS.scoreWeights, ...state.settings.scoreWeights};
  }
}

async function saveSetting(key, value) {
  state.settings[key] = value;
  await dbPut("settings", {key, value});
}

async function loadSources() {
  const stored = await dbGetAll("sources");
  if (stored.length === 0) {
    state.sources = DEFAULT_SOURCES.map(s => ({...s}));
    for (const s of state.sources) await saveSource(s);
  } else {
    const defaultIds = DEFAULT_SOURCES.map(d => d.id);
    state.sources = stored;
    for (const d of DEFAULT_SOURCES) {
      if (!stored.find(s => s.id === d.id)) {
        const newS = {...d};
        state.sources.push(newS);
        await saveSource(newS);
      }
    }
  }
}

async function refreshItems() {
  const all = await dbGetAll("items");
  state.items = all.filter(i => !i.dismissed && !i.hidden).sort((a,b) => b.totalOpportunityScore - a.totalOpportunityScore);
}

}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard","success")).catch(() => toast("Clipboard failed","error"));
  } else {
    toast("Clipboard API not available","error");
  }
}

async function saveFile(name, content, mime="text/markdown") {
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({suggestedName: name, types: [{description: "File", accept: {[mime]: [name.split(".").pop()]}}]});
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      toast("File saved","success");
      return;
    } catch(e) { if (e.name === "AbortError") return; }
  }
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

async function exportJson() {
  const items = await dbGetAll("items");
  const sources = await dbGetAll("sources");
  const scans = await dbGetAll("scans");
  const settings = await dbGetAll("settings");
  const data = {items, sources, scans, settings, exportedAt: new Date().toISOString(), app: APP_NAME};
  const json = JSON.stringify(data, null, 2);
  await saveFile("content-radar-export.json", json, "application/json");
}

async function importJson(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  if (data.items) { for (const item of data.items) await dbPut("items", item); }
  if (data.sources) { for (const source of data.sources) await dbPut("sources", source); }
  if (data.settings) { for (const s of data.settings) await dbPut("settings", s); }
  if (data.scans) { for (const s of data.scans) await dbPut("scans", s); }
  await loadSources();
  await loadSettings();
  await refreshItems();
  renderCurrentView();
  toast("Import complete","success");
}

function drawRadar(canvas) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(cx, cy) - 20;
  ctx.clearRect(0, 0, w, h);

  for (let i = 1; i <= 4; i++) {
    const r = (maxR / 4) * i;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = i === 4 ? "rgba(0,229,255,0.15)" : "rgba(0,229,255,0.08)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
    ctx.strokeStyle = "rgba(0,229,255,0.06)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const sweepAngle = (Date.now() / 2000) % (Math.PI * 2);
  const grad = ctx.createConicalGradient ? null : null;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, maxR, sweepAngle - 0.3, sweepAngle);
  ctx.closePath();
  const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  sg.addColorStop(0, "rgba(0,229,255,0.15)");
  sg.addColorStop(1, "rgba(0,229,255,0.02)");
  ctx.fillStyle = sg;
  ctx.fill();

  const items = state.items.slice(0, 50);
  state.radarBlips = [];
  items.forEach((item, idx) => {
    const ageMs = item.publishedAt ? Date.now() - new Date(item.publishedAt).getTime() : 86400000;
    const ageNorm = Math.min(ageMs / (7 * 86400000), 1);
    const dist = maxR * 0.2 + maxR * 0.75 * (1 - ageNorm);
    const angleHash = hashString(item.classifierLabels[0] || "default") % 360;
    const angle = (angleHash / 360) * Math.PI * 2 + (idx * 0.05);
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const size = 3 + (item.totalOpportunityScore / 100) * 8;
    const bestType = item.suggestedOutputs[0] || "absurdityArchive";
    const color = OUTPUT_COLORS[bestType] || "#00e5ff";

    const pulseScale = 1 + Math.sin(Date.now() / 500 + idx) * 0.2;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(2, size * pulseScale), 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7 + (item.totalOpportunityScore / 200);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(x, y, Math.max(2, size * pulseScale) + 3, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;

    state.radarBlips.push({x, y, size: Math.max(2, size * pulseScale) + 5, itemId: item.id});
  });

  ctx.font = "10px monospace";
  ctx.fillStyle = "rgba(0,229,255,0.5)";
  ctx.textAlign = "center";
  const ringLabels = ["7d","5d","3d","1d"];
  for (let i = 0; i < 4; i++) {
    const r = (maxR / 4) * (i + 1);
    ctx.fillText(ringLabels[i], cx + r, cy - 4);
  }
}

function animateRadar(canvas) {
  if (state.currentView !== "radar") {
    state.radarAnimFrame = null;
    return;
  }
  drawRadar(canvas);
  state.radarAnimFrame = requestAnimationFrame(() => animateRadar(canvas));
}

      ${CAUTION_LABELS.map(c => `<option value="${c}">${c.replace(/_/g," ")}</option>`).join("")}
    </select>
    <select id="feed-sort" aria-label="Sort by">
      <option value="score">Opportunity Score</option>
      <option value="newest">Newest</option>
      <option value="fb">FB Discussion</option>
      <option value="song">Song Concept</option>
      <option value="image">Image Prompt</option>
      <option value="absurdity">Absurdity</option>
      <option value="caution">Caution Risk</option>
    </select>
    <input type="text" id="feed-search" placeholder="Search..." aria-label="Search items">
    <select id="feed-starred" aria-label="Starred filter">
      <option value="">All items</option>
      <option value="starred">Starred only</option>
    </select>
  `;
  container.appendChild(filtersDiv);

  const itemsDiv = document.createElement("div");
  const applyFilters = () => {
    const typeFilter = document.getElementById("feed-filter-type")?.value || "";
    const labelFilter = document.getElementById("feed-filter-label")?.value || "";
    const sourceFilter = document.getElementById("feed-filter-source")?.value || "";
    const cautionFilter = document.getElementById("feed-filter-caution")?.value || "";
    const sort = document.getElementById("feed-sort")?.value || "score";
    const search = (document.getElementById("feed-search")?.value || "").toLowerCase();
    const starredFilter = document.getElementById("feed-starred")?.value || "";

    let items = [...state.items];
    if (typeFilter) items = items.filter(i => i.suggestedOutputs.includes(typeFilter) || i.contentScores[typeFilter] > 30);
    if (labelFilter) items = items.filter(i => i.classifierLabels.includes(labelFilter));
    if (sourceFilter) items = items.filter(i => i.sourceId === sourceFilter || i.sourceName === sourceFilter);
    if (cautionFilter) items = items.filter(i => i.caveats === cautionFilter);
    if (search) items = items.filter(i => (i.title + i.description).toLowerCase().includes(search));
    if (starredFilter === "starred") items = items.filter(i => i.starred);

    switch(sort) {
      case "newest": items.sort((a,b) => (b.publishedAt||"").localeCompare(a.publishedAt||"")); break;
      case "fb": items.sort((a,b) => b.contentScores.facebookDiscussion - a.contentScores.facebookDiscussion); break;
      case "song": items.sort((a,b) => b.contentScores.songConcept - a.contentScores.songConcept); break;
      case "image": items.sort((a,b) => b.contentScores.imagePrompt - a.contentScores.imagePrompt); break;
      case "absurdity": items.sort((a,b) => b.contentScores.absurdityArchive - a.contentScores.absurdityArchive); break;
      case "caution": items.sort((a,b) => b.contentScores.cautionRisk - a.contentScores.cautionRisk); break;
      default: items.sort((a,b) => b.totalOpportunityScore - a.totalOpportunityScore);
    }

    itemsDiv.innerHTML = items.length === 0 ? '<div style="color:var(--text2);text-align:center;padding:40px">No items match filters. Run a scan first.</div>' : items.map(i => renderCardHTML(i)).join("");
  };

  filtersDiv.querySelectorAll("select, input").forEach(el => el.addEventListener("change", applyFilters));
  filtersDiv.querySelectorAll("input").forEach(el => el.addEventListener("input", applyFilters));

  container.appendChild(itemsDiv);
  applyFilters();
}

function generateReport(type) {
  const items = state.items;
  const date = new Date().toLocaleDateString("en-US", {year:"numeric",month:"long",day:"numeric"});
  let md = `# Content Radar Brief — ${date}\n\n`;

  switch(type) {
    case "top10": {
      const top = items.slice(0, 10);
      md += `## Best Overall Opportunities\n\n`;
      top.forEach((item, i) => {
        md += `${i+1}. **${item.title}**\n   Source: ${item.domain || item.sourceName}\n   Best use: ${OUTPUT_LABELS[item.suggestedOutputs[0]] || "general"}\n   Score: ${item.totalOpportunityScore}\n   Angle: ${item.reasons[0] || "—"}\n   Caution: ${item.caveats.replace(/_/g," ")}\n   ${item.url ? `Link: ${item.url}` : ""}\n\n`;
      });
      break;
    }
    case "facebook": {
      const fb = items.filter(i => i.contentScores.facebookDiscussion > 25).slice(0, 10);
      md += `## Facebook Discussion Starters\n\n`;
      fb.forEach((item, i) => {
        const draft = generateDeterministicDraft(item, "facebook");
        md += `${i+1}. ${item.title}\n\`\`\`\n${draft}\n\`\`\`\n\n`;
      });
      break;
    }
    case "song": {
      const songs = items.filter(i => i.contentScores.songConcept > 25).slice(0, 10);
      md += `## Song Bait\n\n`;
      songs.forEach((item, i) => {
        const draft = generateDeterministicDraft(item, "song");
        md += `${i+1}. ${item.title}\n\`\`\`\n${draft}\n\`\`\`\n\n`;
      });
      break;
    }
    case "image": {
      const imgs = items.filter(i => i.contentScores.imagePrompt > 25).slice(0, 10);
      md += `## Image Prompt Seeds\n\n`;
      imgs.forEach((item, i) => {
        const draft = generateDeterministicDraft(item, "image");
        md += `${i+1}. ${item.title}\n\`\`\`\n${draft}\n\`\`\`\n\n`;
      });
      break;
    }
    case "substack": {
      const ss = items.filter(i => i.contentScores.substackEssay > 25).slice(0, 10);
      md += `## Substack/Blog Angles\n\n`;
      ss.forEach((item, i) => {
        const draft = generateDeterministicDraft(item, "substack");
        md += `${i+1}. ${item.title}\n\`\`\`\n${draft}\n\`\`\`\n\n`;
      });
      break;
    }
    case "tech": {
      const tech = items.filter(i => i.classifierLabels.some(l => ["ai_panic","tech_dystopia","open_source_dev"].includes(l))).slice(0, 10);
      md += `## AI/Tech Radar\n\n`;
      tech.forEach((item, i) => {
        md += `${i+1}. **${item.title}** (Score: ${item.totalOpportunityScore})\n   ${item.reasons[0] || ""}\n   ${item.url || ""}\n\n`;
      });
      break;
    }
    case "weird": {
      const weird = items.filter(i => i.classifierLabels.some(l => ["weird_but_fun","animal_chaos","absurdityArchive"].includes(l)) || i.contentScores.absurdityArchive > 30).slice(0, 10);
      md += `## Weirdness Digest\n\n`;
      weird.forEach((item, i) => {
        md += `${i+1}. **${item.title}**\n   Score: ${item.totalOpportunityScore} | Absurdity: ${item.contentScores.absurdityArchive}\n   ${item.reasons[0] || ""}\n\n`;
      });
      break;
    }
    case "local": {
      const local = items.filter(i => i.contentScores.localInterest > 20 || i.classifierLabels.includes("local_weirdness")).slice(0, 10);
      md += `## Local/Regional Digest\n\n`;
      local.forEach((item, i) => {
        md += `${i+1}. **${item.title}**\n   Score: ${item.totalOpportunityScore}\n   ${item.url || ""}\n\n`;
      });
      break;
    }
    case "caution": {
      const caution = items.filter(i => i.caveats !== "safe_fun").slice(0, 15);
      md += `## Skip / Handle Carefully\n\n`;
      caution.forEach((item, i) => {
        md += `${i+1}. **${item.title}**\n   Caution: ${item.caveats.replace(/_/g," ")} (risk: ${item.contentScores.cautionRisk})\n   ${item.reasons[0] || ""}\n\n`;
      });
      break;
    }
  }

  md += `\n---\n_Generated by Content Radar — Metadata-based summaries are not fact checks._\n_Do not treat market/health/legal/political classifications as advice._`;

  const preview = document.getElementById("brief-preview");
  if (preview) {
    const briefId = "brief_" + Date.now();
    window._briefData = window._briefData || {};
    window._briefData[briefId] = {
      md,
      json: JSON.stringify({
        type,
        date,
        items: items.slice(0,10).map(i => ({title:i.title,score:i.totalOpportunityScore,url:i.url,caution:i.caveats}))
      }, null, 2)
    };
    preview.innerHTML = `
      <div class="section-title">Preview</div>
      <div class="brief-preview">${esc(md)}</div>
      <div class="actions" style="margin-top:8px">
        <button class="btn btn-primary" onclick="copyToClipboard(window._briefData['${briefId}'].md)">Copy to Clipboard</button>
        <button class="btn" onclick="saveFile('content-radar-brief.md',window._briefData['${briefId}'].md)">Download Markdown</button>
        <button class="btn" onclick="saveFile('content-radar-brief.json',window._briefData['${briefId}'].json,'application/json')">Export JSON</button>
      </div>
    `;
  }
}
