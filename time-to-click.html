<style>
  :root {
    --bg: #0a0f1c;
    --card: #111a2e;
    --card-border: #22304e;
    --text: #e8eef8;
    --muted: #93a4c0;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.16);
    --ok: #38d9a9;
    --warn: #ffd166;
    --danger: #ff6b6b;
    --focus: #a8c1ff;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(1rem, 4vw, 3rem) 1rem 0;
    background:
      radial-gradient(1000px 500px at 50% -10%, rgba(91, 140, 255, 0.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 400 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 80rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .dashboard-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .total { margin: 0; color: var(--muted); font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .timer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
    gap: 1rem;
  }

  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 40%), var(--card);
    border: 1px solid var(--card-border);
    border-radius: 1rem;
    padding: clamp(1.1rem, 4vw, 1.75rem);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }

  .timer-card { display: flex; flex-direction: column; gap: 0.6rem; position: relative; }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .badge::before {
    content: "";
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--muted);
  }

  .badge[data-state="running"] { color: var(--ok); border-color: rgba(56, 217, 169, 0.4); }
  .badge[data-state="running"]::before { background: var(--ok); box-shadow: 0 0 8px rgba(56, 217, 169, 0.8); }
  .badge[data-state="paused"] { color: var(--warn); border-color: rgba(255, 209, 102, 0.4); }
  .badge[data-state="paused"]::before { background: var(--warn); }

  .flash-banner {
    margin-top: 0.4rem;
    padding: 0.6rem 0.9rem;
    border-radius: 0.6rem;
    text-align: center;
    font-weight: 800;
    font-size: clamp(0.85rem, 2.5vw, 1.05rem);
    letter-spacing: 0.12em;
    color: #0a0f1c;
    background: linear-gradient(90deg, var(--accent), #7dd3fc);
  }
  .flash-banner .flash-sub {
    display: block;
    margin-top: 0.25rem;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    word-break: break-word;
  }

  .card-title { margin: 0; font-size: 1.05rem; line-height: 1.3; font-weight: 700; word-break: break-word; }

  .countdown {
    margin: 0.2rem 0 0;
    text-align: center;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.6rem, 9vw, 3.9rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .progress {
    height: 0.5rem;
    margin: 0.2rem 0 0.3rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #7dd3fc);
    transition: width 0.2s linear;
  }

  .meta { margin: 0; text-align: center; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.9rem; }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: auto; padding-top: 0.4rem; }

  button {
    appearance: none;
    border: 1px solid var(--card-border);
    border-radius: 0.55rem;
    padding: 0.5rem 0.85rem;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font: 600 0.88rem/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.09); border-color: #31446b; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0f1c;
    padding-inline: 1.2rem;
  }
  button.primary:hover:not(:disabled) { background: #6f9bff; border-color: #6f9bff; }

  button.danger { border-color: rgba(255, 107, 107, 0.5); color: var(--danger); }
  button.danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.14); border-color: var(--danger); }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 0.35rem;
  }

  /* Alarm flash: brief pulse of the specific timer's card. */
  @keyframes cardPulse {
    0%, 100% { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
    50% { box-shadow: 0 0 46px 8px rgba(91, 140, 255, 0.5); }
  }

  .timer-card.alarm-flash {
    animation: cardPulse 0.9s ease-in-out infinite;
    border-color: var(--accent);
  }

  /* Empty state */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty h2 { margin: 0 0 0.4rem; color: var(--text); font-size: 1.3rem; }
  .empty p { margin: 0 0 1.2rem; }

  .settings {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 1rem;
    padding: 0.9rem 1.1rem;
  }

  .settings summary { cursor: pointer; font-weight: 700; color: var(--text); list-style-position: inside; padding: 0.2rem 0; }

  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1rem; margin-top: 0.9rem; }

  .field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
  .field-wide { grid-column: 1 / -1; }
  .field label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

  .range-value { color: var(--text); font-family: var(--mono); font-weight: 400; margin-left: 0.35rem; }

  input[type="number"], input[type="text"], select, textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border-radius: 0.5rem;
    border: 1px solid var(--card-border);
    background: #0c1424;
    color: var(--text);
    font: 400 0.95rem/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  textarea { resize: vertical; min-height: 3.6rem; }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); width: 1rem; height: 1rem; }

  .toggles { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.55rem 1.2rem; }
  .toggle { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.88rem; color: var(--text); cursor: pointer; }

  .field-note { grid-column: 1 / -1; margin: 0; font-size: 0.8rem; color: var(--muted); }
  .field-error { grid-column: 1 / -1; margin: 0; font-size: 0.82rem; color: #ff8a8a; font-weight: 600; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  dialog {
    border: 1px solid var(--card-border);
    border-radius: 1rem;
    padding: 0;
    width: min(92vw, 26rem);
    background: var(--card);
    color: var(--text);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
  }
  dialog::backdrop { background: rgba(5, 9, 18, 0.7); }
  .dialog-body { display: flex; flex-direction: column; gap: 0.9rem; padding: 1.3rem; }
  .dialog-body h2 { margin: 0; font-size: 1.2rem; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.4rem; }

  @media (max-width: 480px) {
    .settings-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .timer-card.alarm-flash { animation: none; border-color: var(--accent); }
  }
</style>
</head>
<body>
<main>
  <h1>Time to Click</h1>

  <div class="dashboard-bar">
    <p class="total" id="totalReminders">Total reminders: 0</p>
    <p class="total" id="limitNote" role="status" hidden></p>
    <div class="toolbar" role="group" aria-label="Dashboard controls">
      <button type="button" id="pauseAllBtn">Pause All</button>
      <button type="button" id="resumeAllBtn">Resume All</button>
      <button type="button" id="addTimerBtn" class="primary">+ Add Timer</button>
    </div>
  </div>

  <div class="empty" id="emptyState" hidden>
    <h2>No timers running</h2>
    <p>Add a timer for each task you need to keep an eye on.</p>
    <button type="button" id="emptyAddBtn" class="primary">+ Add Timer</button>
  </div>

  <div class="timer-grid" id="timerGrid"></div>

  <dialog id="timerDialog">
    <form class="dialog-body" id="timerForm" novalidate>
      <h2 id="timerDialogTitle">Add Timer</h2>
      <div class="field">
        <label for="intervalInput">Interval (minutes or range)</label>
        <input id="intervalInput" type="text" inputmode="decimal" placeholder="8 or 5-8" autocomplete="off" spellcheck="false" />
        <p class="field-note">Examples: 8 or 5-8</p>
        <p class="field-error" id="intervalError" hidden></p>
      </div>
      <div class="field">
        <label for="promptInput">Reminder prompt</label>
        <textarea id="promptInput" rows="2" placeholder="What should be spoken when this timer expires (this is also the timer's name)"></textarea>
        <p class="field-error" id="promptError" hidden>Enter a reminder prompt.</p>
      </div>
      <p class="field-note" id="dialogNote"></p>
      <div class="dialog-actions">
        <button type="button" id="timerDialogCancel">Cancel</button>
        <button type="submit" id="timerDialogOk" class="primary">Add &amp; Start</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <div class="dialog-body">
      <p id="confirmMessage" style="margin:0;">Delete this timer?</p>
      <div class="dialog-actions">
        <button type="button" id="confirmCancel">Cancel</button>
        <button type="button" id="confirmOk" class="danger">Delete</button>
      </div>
    </div>
  </dialog>

  <details class="settings">
    <summary>Settings</summary>
    <div class="settings-grid">
      <div class="field field-wide">
        <label for="voiceSelect">Voice</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="field">
        <label for="speechVolume">Speech volume <span class="range-value" id="speechVolumeValue"></span></label>
        <input id="speechVolume" type="range" min="0" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="speechRate">Speech rate <span class="range-value" id="speechRateValue"></span></label>
        <input id="speechRate" type="range" min="0.5" max="2" step="0.1" />
      </div>
      <div class="field">
        <label for="chimeVolume">Chime volume <span class="range-value" id="chimeVolumeValue"></span></label>
        <input id="chimeVolume" type="range" min="0" max="1" step="0.05" />
      </div>
      <div class="field-wide">
        <p class="field-note">Test sound:</p>
        <div class="toolbar">
          <button type="button" id="testChimeBtn">Test Chime</button>
          <button type="button" id="testVoiceBtn">Test Voice</button>
        </div>
      </div>
      <div class="toggles">
        <label class="toggle"><input id="muteVoice" type="checkbox" /> Mute voice</label>
        <label class="toggle"><input id="muteChime" type="checkbox" /> Mute chime</label>
        <label class="toggle"><input id="keepAwake" type="checkbox" /> Keep screen awake</label>
        <label class="toggle"><input id="notificationsToggle" type="checkbox" /> Desktop notifications</label>
        <label class="toggle"><input id="visualFlash" type="checkbox" /> Visual flash</label>
      </div>
      <p class="field-note" id="notificationsNote"></p>
    </div>
  </details>
</main>

<div class="sr-only" id="liveRegion" aria-live="polite"></div>

  function intervalBounds(t) {
    var min = Math.max(1, Math.round(t.minMinutes * 60));
    var max = Math.max(min, Math.round(t.maxMinutes * 60));
    return [min, max];
  }
  function generateIntervalSeconds(t) {
    var b = intervalBounds(t);
    return b[0] + Math.floor(Math.random() * (b[1] - b[0] + 1)); // inclusive max
  }

  function armNextInterval(t, now) {
    var secs = generateIntervalSeconds(t);
    t.currentIntervalSeconds = secs;
    t.remainingMilliseconds = secs * 1000;
    t.targetTimestamp = now + secs * 1000;
    t.state = 'running';
  }

  // -------------------------------------------------------------------
  // Alarm/speech queue (serializes concurrent reminders). We NEVER call
  // speechSynthesis.cancel() for queued alarms, so timer B can never erase
  // timer A's in-flight prompt.
  // -------------------------------------------------------------------
  var alarmQueue = [];
  var alarmBusy = false;
  var activeAlarmPrompt = null;   // prompt currently announced (for title)
  var titleFlashUntil = 0;
  var processedAlarmCount = 0;    // diagnostics/test hook: alarms that began playing

  function enqueueAlarm(timer) {
    alarmQueue.push({ id: timer.id, prompt: timer.prompt });
    drainAlarmQueue();
  }

  function removeQueuedAlarm(id) {
    for (var i = alarmQueue.length - 1; i >= 0; i -= 1) {
      if (alarmQueue[i].id === id) alarmQueue.splice(i, 1);
    }
  }

  function drainAlarmQueue() {
    if (alarmBusy) return;
    var item = alarmQueue.shift();
    if (!item) {
      activeAlarmPrompt = null;
      return;
    }
    if (!findTimer(item.id)) {
      drainAlarmQueue();
      return;
    }
    alarmBusy = true;
    processedAlarmCount += 1;
    activeAlarmPrompt = item.prompt;
    playAlarm(item, function () {
      alarmBusy = false;
      activeAlarmPrompt = null;
      drainAlarmQueue();
    });
  }

  function playAlarm(item, done) {
    var timer = findTimer(item.id);
    var prompt = item.prompt;
    var ctx = ensureAudioContext();
    if (ctx) playChime();
    if (settings.visualFlash && timer) flashCard(timer);
    showExpirationNotification(prompt);
    titleFlashUntil = Date.now() + 4000;
    document.title = '🔔 ' + shortHead(prompt);
    // Speak shortly after the chime's first notes begin. Timing stays async
    // so a long prompt never distorts the configured AHT.
    var finished = false;
    var finish = function () { if (!finished) { finished = true; done(); } };
    setTimeout(function () { speakAlarmText(prompt, finish); }, 250);
    // Safety valve so the queue can never wedge if onend never fires.
    setTimeout(finish, speechSafetyTimeoutMs(prompt));
  }

  function speechSafetyTimeoutMs(text) {
    var s = String(text || '');
    var words = s.trim().split(/\s+/).filter(Boolean).length;
    // Approximate normal speech at ~150 WPM, adjusted for the selected rate.
    var rate = Math.max(0.5, settings.speechRate || 1);
    var estimatedMs = words ? (words / (150 * rate)) * 60 * 1000 : 0;
    return Math.max(5000, estimatedMs + 5000, s.length * 100 + 3000);
  }

  function speakAlarmText(text, onDone) {
    if (settings.muteVoice || !('speechSynthesis' in window)) { onDone(); return; }
    try {
      var utter = new SpeechSynthesisUtterance(text);
      var uri = settings.voiceURI || voiceSelect.value;
      for (var i = 0; i < voices.length; i += 1) {
        if (voices[i].voiceURI === uri) { utter.voice = voices[i]; break; }
      }
      utter.volume = settings.speechVolume;
      utter.rate = settings.speechRate;
      var fired = false;
      var finish = function () { if (!fired) { fired = true; onDone(); } };
      utter.onend = finish;
      utter.onerror = finish;
      window.speechSynthesis.speak(utter);
    } catch (e) { onDone(); }
  }

  // -------------------------------------------------------------------
  // Card (DOM) architecture. Cards render from timer state; the scheduler
  // only updates DYNAMIC elements each tick. Structural rebuilds happen on
  // add/edit/delete/restore. cardEls maps timer id -> live node refs.
  // -------------------------------------------------------------------
  var cardEls = {};

  function intervalLabel(t) {
    var a = formatMinutes(t.minMinutes);
    var b = formatMinutes(t.maxMinutes);
    if (a === b) return 'Every: ' + a + ' min';
    return 'Range: ' + a + '–' + b + ' min';
  }

  function buildCard(timer) {
    var card = document.createElement('article');
    card.className = 'card timer-card';
    card.dataset.id = timer.id;

    var statusRow = document.createElement('div');
    statusRow.className = 'status-row';
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.dataset.state = 'not-started';
    badge.textContent = 'Not started';
    var countEl = document.createElement('span');
    countEl.textContent = 'Reminders: 0';
    statusRow.appendChild(badge);
    statusRow.appendChild(countEl);

    var flash = document.createElement('div');
    flash.className = 'flash-banner';
    flash.hidden = true;
    var flashHeading = document.createElement('span');
    flashHeading.textContent = '🔔 REMINDER';
    var flashSub = document.createElement('span');
    flashSub.className = 'flash-sub';
    flash.appendChild(flashHeading);
    flash.appendChild(flashSub);

    var title = document.createElement('h3');
    title.className = 'card-title';
    title.id = 'timer-title-' + timer.id;
    title.textContent = shortHead(timer.prompt);

    var cd = document.createElement('div');
    cd.className = 'countdown';
    cd.setAttribute('role', 'timer');
    cd.setAttribute('aria-labelledby', 'timer-title-' + timer.id);
    cd.textContent = '--:--';

    var progress = document.createElement('div');
    progress.className = 'progress';
    var fill = document.createElement('div');
    fill.className = 'progress-fill';
    progress.appendChild(fill);

    var intervalMeta = document.createElement('p');
    intervalMeta.className = 'meta';
    var cycleMeta = document.createElement('p');
    cycleMeta.className = 'meta';
    var nextMeta = document.createElement('p');
    nextMeta.className = 'meta';
    nextMeta.id = 'timer-next-' + timer.id;

    var controls = document.createElement('div');
    controls.className = 'controls';
    var toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'primary ctl-toggle';
    toggleBtn.textContent = 'Start';
    var newBtn = document.createElement('button');
    newBtn.type = 'button';
    newBtn.className = 'ctl-new';
    newBtn.textContent = 'New Interval';
    newBtn.disabled = true;
    var editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'ctl-edit';
    editBtn.textContent = 'Edit';
    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'danger ctl-delete';
    delBtn.textContent = 'Delete';
    controls.appendChild(toggleBtn);
    controls.appendChild(newBtn);
    controls.appendChild(editBtn);
    controls.appendChild(delBtn);

    card.appendChild(statusRow);
    card.appendChild(flash);
    card.appendChild(title);
    card.appendChild(cd);
    card.appendChild(progress);
    card.appendChild(intervalMeta);
    card.appendChild(cycleMeta);
    card.appendChild(nextMeta);
    card.appendChild(controls);

    cardEls[timer.id] = {
      root: card, badge: badge, countEl: countEl, title: title,
      countdown: cd, fill: fill, intervalEl: intervalMeta,
      cycleEl: cycleMeta, nextEl: nextMeta,
      flash: flash, flashHeading: flashHeading, flashSub: flashSub,
      toggleBtn: toggleBtn, newBtn: newBtn, editBtn: editBtn, delBtn: delBtn,
      flashTimer: null
    };
    timerGrid.appendChild(card);
  }

  function removeCard(timerId) {
    var el = cardEls[timerId];
    if (el) { if (el.flashTimer) clearTimeout(el.flashTimer); if (el.root.parentNode) el.root.parentNode.removeChild(el.root); }
    delete cardEls[timerId];
  }

  // Refresh only the dynamic piece of one card. `now` is the wall-clock
  // sample taken once per scheduler tick.
  function updateCardDynamic(timer, now) {
    var el = cardEls[timer.id];
    if (!el) return;

    var remaining;
    if (timer.state === 'running') {
      remaining = Math.max(0, timer.targetTimestamp - now);
      timer.remainingMilliseconds = remaining; // keep the model field live
    } else if (timer.state === 'paused') {
      remaining = Math.max(0, timer.remainingMilliseconds);
    } else {
      remaining = 0;
    }

    if (timer.state === 'not-started') {
      el.countdown.textContent = '--:--';
    } else {
      el.countdown.textContent = formatClock(Math.ceil(remaining / 1000));
    }

    var total = timer.currentIntervalSeconds * 1000;
    var fraction = total > 0 ? 1 - remaining / total : 0;
    fraction = Math.min(1, Math.max(0, fraction));
    el.fill.style.width = (fraction * 100).toFixed(1) + '%';

    el.intervalEl.textContent = intervalLabel(timer);
    el.cycleEl.textContent = 'This cycle: ' + formatClock(timer.currentIntervalSeconds);
    el.nextEl.textContent = timer.state === 'not-started' ? 'Next: —'
      : (timer.state === 'paused' ? 'Next: Paused' : 'Next: ' + formatTimeOfDay(timer.targetTimestamp));

    el.badge.dataset.state = timer.state;
    el.badge.textContent = timer.state === 'running' ? 'Running'
      : (timer.state === 'paused' ? 'Paused' : 'Not started');
    el.countEl.textContent = 'Reminders: ' + timer.remindersCompleted;
    el.title.textContent = shortHead(timer.prompt);

    if (timer.state === 'not-started') el.toggleBtn.textContent = 'Start';
    else if (timer.state === 'running') el.toggleBtn.textContent = 'Pause';
    else el.toggleBtn.textContent = 'Resume';
    el.newBtn.disabled = timer.state === 'not-started';
  }

  function rebuildGrid() {
    timerGrid.textContent = '';
    cardEls = {};
    timers.forEach(function (t) { buildCard(t); });
    updateDashboard();
    var now = Date.now();
    timers.forEach(function (t) { updateCardDynamic(t, now); });
  }

  function updateDashboard() {
    var sum = timers.reduce(function (acc, t) { return acc + t.remindersCompleted; }, 0);
    totalRemindersEl.textContent = 'Total reminders: ' + sum;
    var empty = timers.length === 0;
    emptyState.hidden = !empty;
    pauseAllBtn.disabled = timers.every(function (t) { return t.state !== 'running'; });
    resumeAllBtn.disabled = timers.every(function (t) { return t.state !== 'paused'; });
    // Explicit collection bound: at MAX_TIMERS, creation is disabled with a
    // visible message. Existing timers keep working normally.
    var atLimit = timers.length >= MAX_TIMERS;
    addTimerBtn.disabled = atLimit;
    emptyAddBtn.disabled = atLimit;
    limitNote.hidden = !atLimit;
    if (atLimit) {
      limitNote.textContent = 'Maximum of ' + MAX_TIMERS + ' timers reached. Delete an existing timer before adding another.';
    }
  }

  // -------------------------------------------------------------------
  // Single scheduler/heartbeat. One setInterval drives ALL timers; every
  // tick samples Date.now() once and derives each timer's remaining time
  // from its absolute targetTimestamp. Stops itself when nothing runs.
  // -------------------------------------------------------------------
  var tickHandle = null;

  function countRunning() {
    return timers.filter(function (t) { return t.state === 'running'; }).length;
  }

  function startHeartbeat() {
    if (tickHandle !== null) return;
    tickHandle = setInterval(tick, 200);
    tick();
  }

  function stopHeartbeatIfIdle() {
    if (tickHandle !== null && countRunning() === 0) {
      clearInterval(tickHandle);
      tickHandle = null;
    }
  }

  function tick() {
    var now = Date.now();
    processExpirations(now);
    var anyRunning = false;
    timers.forEach(function (t) {
      if (t.state === 'running') { anyRunning = true; updateCardDynamic(t, now); }
      else if (t.state === 'paused') { updateCardDynamic(t, now); }
    });
    updateDocumentTitle(now);
    if (!anyRunning) stopHeartbeatIfIdle();
  }

  // Expire each due timer exactly once; two due on the same tick both fire.
  function processExpirations(now) {
    var due = timers.filter(function (t) {
      return t.state === 'running' && t.targetTimestamp > 0 && now >= t.targetTimestamp;
    });
    if (!due.length) return;
    due.forEach(function (t) {
      t.remindersCompleted += 1;
      enqueueAlarm(t);
      armNextInterval(t, now);
    });
    saveTimers();
    updateDashboard();
  }

  // -------------------------------------------------------------------
  // Browser tab title.
  // -------------------------------------------------------------------
  function soonestRunning(now) {
    var best = null;
    timers.forEach(function (t) {
      if (t.state !== 'running' || t.targetTimestamp <= 0) return;
      if (!best || t.targetTimestamp < best.targetTimestamp) best = t;
    });
    return best;
  }

  function updateDocumentTitle(now) {
    if (now < titleFlashUntil && activeAlarmPrompt) {
      document.title = '🔔 ' + shortHead(activeAlarmPrompt);
      return;
    }
    var soon = soonestRunning(now);
    if (soon) {
      var rem = Math.max(0, soon.targetTimestamp - now);
      document.title = formatClock(Math.ceil(rem / 1000)) + ' · ' + shortHead(soon.prompt) + ' — Time to Click';
    } else {
      document.title = 'Time to Click';
    }
  }

  function flashCard(timer) {
    var el = cardEls[timer.id];
    if (!el) return;
    el.root.classList.add('alarm-flash');
    el.flashHeading.textContent = '🔔 REMINDER';
    el.flashSub.textContent = shortHead(timer.prompt);
    el.flash.hidden = false;
    if (el.flashTimer) clearTimeout(el.flashTimer);
    el.flashTimer = setTimeout(function () {
      el.flash.hidden = true;
      el.root.classList.remove('alarm-flash');
    }, 4000);
  }

  // -------------------------------------------------------------------
  // Timer state transitions.
  // -------------------------------------------------------------------
  function startTimer(timer) {
    if (timer.state !== 'not-started') return;
    var ctx = ensureAudioContext();
    if (ctx) playConfirmationTone(ctx);
    unlockSpeech();
    armNextInterval(timer, Date.now());
    saveTimers();
    updateCardDynamic(timer, Date.now());
    updateDashboard();
    if (countRunning() > 0) startHeartbeat();
    updateWakeLockState();
    announce('Started: ' + shortHead(timer.prompt) + '. Next reminder in ' + formatClock(timer.currentIntervalSeconds) + '.');
  }

  function pauseTimer(timer) {
    if (timer.state !== 'running') return;
    timer.remainingMilliseconds = Math.max(0, timer.targetTimestamp - Date.now());
    timer.targetTimestamp = 0;
    timer.state = 'paused';
    saveTimers();
    updateCardDynamic(timer, Date.now());
    updateDashboard();
    stopHeartbeatIfIdle();
    updateWakeLockState();
    announce('Paused: ' + shortHead(timer.prompt) + '.');
  }

  function resumeTimer(timer) {
    if (timer.state !== 'paused' || timer.remainingMilliseconds <= 0) return;
    timer.targetTimestamp = Date.now() + timer.remainingMilliseconds;
    timer.state = 'running';
    saveTimers();
    updateCardDynamic(timer, Date.now());
    if (countRunning() > 0) startHeartbeat();
    updateWakeLockState();
    announce('Resumed: ' + shortHead(timer.prompt) + '.');
  }

  function newIntervalTimer(timer) {
    if (timer.state === 'not-started') return;
    armNextInterval(timer, Date.now());
    saveTimers();
    updateCardDynamic(timer, Date.now());
    if (countRunning() > 0) startHeartbeat();
    announce('New interval for ' + shortHead(timer.prompt) + ': ' + formatClock(timer.currentIntervalSeconds) + '.');
  }

  function deleteTimer(timer) {
    removeQueuedAlarm(timer.id);
    removeCard(timer.id);
    var idx = timers.indexOf(timer);
    if (idx >= 0) timers.splice(idx, 1);
    saveTimers();
    updateDashboard();
    stopHeartbeatIfIdle();
    updateWakeLockState();
    announce('Deleted timer: ' + shortHead(timer.prompt) + '.');
  }

  // -------------------------------------------------------------------
  // Web Audio: one reusable AudioContext; chimes are synthesized with
  // oscillators and gain envelopes (no audio files).
  // -------------------------------------------------------------------
  var audioCtx = null;
  var activeChime = null;
  var voices = [];

  var CHIME_NOTES = [523.25, 659.25, 783.99]; // C5 -> E5 -> G5 ascending
  var NOTE_SECONDS = 0.22;
  var SEQUENCE_GAP_SECONDS = 0.35;

  function ensureAudioContext() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) {
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    return audioCtx;
  }

  function scheduleNote(ctx, destination, frequency, startTime, duration, peak) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = frequency;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peak, startTime + 0.02);
    gain.gain.setValueAtTime(peak, Math.max(startTime + 0.02, startTime + duration - 0.07));
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
    return { osc: osc, gain: gain };
  }

  function stopActiveChime() {
    if (!activeChime || !audioCtx) { activeChime = null; return; }
    var chime = activeChime;
    activeChime = null;
    try {
      var now = audioCtx.currentTime;
      chime.master.gain.cancelScheduledValues(now);
      chime.master.gain.setTargetAtTime(0, now, 0.03);
      setTimeout(function () {
        chime.nodes.forEach(function (n) { try { n.osc.stop(); } catch (e) {} });
        try { chime.master.disconnect(); } catch (e) {}
      }, 200);
    } catch (e) {}
  }

  function playChime() {
    if (settings.muteChime) return;
    var ctx = ensureAudioContext();
    if (!ctx) return;
    stopActiveChime();
    var master = ctx.createGain();
    master.gain.value = settings.chimeVolume;
    master.connect(ctx.destination);
    var t0 = ctx.currentTime + 0.03;
    var nodes = [];
    for (var s = 0; s < 2; s += 1) {
      var seqStart = t0 + s * (CHIME_NOTES.length * NOTE_SECONDS + SEQUENCE_GAP_SECONDS);
      for (var i2 = 0; i2 < CHIME_NOTES.length; i2 += 1) {
        nodes.push(scheduleNote(ctx, master, CHIME_NOTES[i2], seqStart + i2 * NOTE_SECONDS, NOTE_SECONDS * 0.92, 0.5));
      }
    }
    activeChime = { master: master, nodes: nodes };
  }

  function playConfirmationTone(ctx) {
    var master = ctx.createGain();
    master.gain.value = 0.25;
    master.connect(ctx.destination);
    scheduleNote(ctx, master, 660, ctx.currentTime + 0.02, 0.14, 0.5);
  }

  // Some browsers only permit speech after a user gesture; a silent
  // utterance on the first run keeps later spoken reminders reliable.
  function unlockSpeech() {
    if (!('speechSynthesis' in window)) return;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // -------------------------------------------------------------------
  // Voice list + the neutral Test Voice phrase (independent of the alarm
  // queue; it never cancels a queued reminder).
  // -------------------------------------------------------------------
  function refreshVoices() {
    if (!('speechSynthesis' in window)) return;
    var list = [];
    try { list = window.speechSynthesis.getVoices() || []; } catch (e) { return; }
    if (list.length) {
      voices = list;
      populateVoiceSelect();
    }
  }

  function populateVoiceSelect() {
    var saved = settings.voiceURI;
    voiceSelect.textContent = '';
    var auto = document.createElement('option');
    auto.value = '';
    auto.textContent = voices.length ? 'System default' : 'No voices available';
    voiceSelect.appendChild(auto);
    voices.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name + ' (' + v.lang + ')';
      voiceSelect.appendChild(opt);
    });
    if (saved && voices.some(function (v) { return v.voiceURI === saved; })) {
      voiceSelect.value = saved;
    } else {
      var english = voices.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
      var pick = english.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || english[0];
      voiceSelect.value = pick ? pick.voiceURI : '';
    }
  }

  function speakTestPhrase() {
    if (settings.muteVoice || !('speechSynthesis' in window)) return;
    try {
      var utter = new SpeechSynthesisUtterance('This is a reminder voice test.');
      var uri = settings.voiceURI || voiceSelect.value;
      for (var i = 0; i < voices.length; i += 1) {
        if (voices[i].voiceURI === uri) { utter.voice = voices[i]; break; }
      }
      utter.volume = settings.speechVolume;
      utter.rate = settings.speechRate;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  // -------------------------------------------------------------------
  // Screen Wake Lock (page-global, best-effort).
  // -------------------------------------------------------------------
  var wakeLock = null;

  function requestWakeLock() {
    if (!settings.keepAwake || !('wakeLock' in navigator)) return;
    if (wakeLock) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { wakeLock = null; });
  }

  function releaseWakeLock() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function updateWakeLockState() {
    if (settings.keepAwake && countRunning() > 0) requestWakeLock();
    else if (countRunning() === 0) releaseWakeLock();
  }

  // -------------------------------------------------------------------
  // Desktop notifications (optional), identifying the timer via its prompt.
  // -------------------------------------------------------------------
  function showExpirationNotification(prompt) {
    if (!settings.notifications || !('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      new Notification('Time to Click', { body: prompt });
    } catch (e) {}
  }

  // -------------------------------------------------------------------
  // Settings UI
  // -------------------------------------------------------------------
  function updateRangeLabels() {
    speechVolumeValue.textContent = Math.round(settings.speechVolume * 100) + '%';
    speechRateValue.textContent = settings.speechRate.toFixed(1) + '×';
    chimeVolumeValue.textContent = Math.round(settings.chimeVolume * 100) + '%';
  }

  function bindSettingsToUI() {
    speechVolumeInput.value = settings.speechVolume;
    speechRateInput.value = settings.speechRate;
    chimeVolumeInput.value = settings.chimeVolume;
    muteVoiceInput.checked = settings.muteVoice;
    muteChimeInput.checked = settings.muteChime;
    keepAwakeInput.checked = settings.keepAwake;
    notificationsInput.checked = settings.notifications;
    visualFlashInput.checked = settings.visualFlash;
    updateRangeLabels();
  }

  voiceSelect.addEventListener('change', function () {
    settings.voiceURI = voiceSelect.value;
    saveSettings();
  });

  speechVolumeInput.addEventListener('input', function () {
    settings.speechVolume = clampNumber(speechVolumeInput.value, 0, 1, DEFAULTS.speechVolume);
    saveSettings();
    updateRangeLabels();
  });
  speechRateInput.addEventListener('input', function () {
    settings.speechRate = clampNumber(speechRateInput.value, 0.5, 2, DEFAULTS.speechRate);
    saveSettings();
    updateRangeLabels();
  });
  chimeVolumeInput.addEventListener('input', function () {
    settings.chimeVolume = clampNumber(chimeVolumeInput.value, 0, 1, DEFAULTS.chimeVolume);
    saveSettings();
    updateRangeLabels();
  });

  muteVoiceInput.addEventListener('change', function () {
    settings.muteVoice = muteVoiceInput.checked;
    saveSettings();
    if (settings.muteVoice && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
  });
  muteChimeInput.addEventListener('change', function () {
    settings.muteChime = muteChimeInput.checked;
    saveSettings();
    if (settings.muteChime) stopActiveChime();
  });
  keepAwakeInput.addEventListener('change', function () {
    settings.keepAwake = keepAwakeInput.checked;
    saveSettings();
    updateWakeLockState();
  });

  visualFlashInput.addEventListener('change', function () {
    settings.visualFlash = visualFlashInput.checked;
    saveSettings();
  });

  function applyNotificationPermission(permission) {
    if (permission === 'granted') {
      settings.notifications = true;
      saveSettings();
      notificationsNote.textContent = '';
    } else {
      notificationsInput.checked = false;
      settings.notifications = false;
      notificationsNote.textContent = 'Permission not granted; reminders will continue without notifications.';
      saveSettings();
    }
  }

  notificationsInput.addEventListener('change', function () {
    if (!notificationsInput.checked) {
      settings.notifications = false;
      saveSettings();
      notificationsNote.textContent = '';
      return;
    }
    if (!('Notification' in window)) {
      notificationsInput.checked = false;
      settings.notifications = false;
      notificationsNote.textContent = 'Notifications are not supported in this browser.';
      saveSettings();
      return;
    }
    if (Notification.permission === 'granted') {
      settings.notifications = true;
      saveSettings();
      notificationsNote.textContent = '';
      return;
    }
    if (Notification.permission === 'denied') {
      notificationsInput.checked = false;
      settings.notifications = false;
      notificationsNote.textContent = 'Notification permission is denied; enable it in your browser settings to use this.';
      saveSettings();
      return;
    }
    try {
      var result = Notification.requestPermission(function (permission) {
        applyNotificationPermission(permission);
      });
      if (result && typeof result.then === 'function') {
        result.then(applyNotificationPermission).catch(function () {
          notificationsInput.checked = false;
          settings.notifications = false;
          notificationsNote.textContent = 'Notification permission request failed.';
          saveSettings();
        });
      }
    } catch (e) {
      notificationsInput.checked = false;
      settings.notifications = false;
      notificationsNote.textContent = 'Notification permission request failed.';
      saveSettings();
    }
  });

  testChimeBtn.addEventListener('click', function () { ensureAudioContext(); playChime(); });
  testVoiceBtn.addEventListener('click', function () { ensureAudioContext(); speakTestPhrase(); });

  // -------------------------------------------------------------------
  // Interval input parsing/validation.
  // -------------------------------------------------------------------
  function parseInterval(str) {
    var s = String(str || '').trim();
    if (!s) return { error: 'Enter an interval (e.g. 8 or 5-8).' };

    var toks = s.split(/\s*(?:-|–|to)\s*/i);
    if (toks.length > 2) return { error: 'Use a single number or one range like 5-8.' };
    function toNum(tok) {
      var t = String(tok).trim();
      if (!/^[0-9]+(\.[0-9]+)?$/.test(t)) return NaN;
      return parseFloat(t);
    }
    var a = toNum(toks[0]);
    var b = toks.length === 2 ? toNum(toks[1]) : a;
    if (!isFinite(a) || !isFinite(b)) return { error: 'Use positive numbers like 8 or 5-8.' };
    if (a <= 0 || b <= 0) return { error: 'Intervals must be positive.' };
    var min = Math.min(a, b), max = Math.max(a, b);
    if (max > 240) return { error: 'Keep intervals at or under 240 minutes.' };
    if (a > b) return { error: 'Minimum must not exceed maximum.' };
    return { minMinutes: min, maxMinutes: max, reversed: a > b };
  }

  // -------------------------------------------------------------------
  // Timer dialog (Add/Edit).
  // -------------------------------------------------------------------
  var editingTimerId = null;
  var pendingConfirmId = null;

  function resetDialogErrors() {
    intervalError.hidden = true;
    promptError.hidden = true;
    dialogNote.textContent = '';
  }

  function showModal(dlg) {
    try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
  }

  function openAddDialog() {
    editingTimerId = null;
    timerDialogTitle.textContent = 'Add Timer';
    timerDialogOk.textContent = 'Add & Start';
    intervalInput.value = '';
    promptInput.value = '';
    resetDialogErrors();
    showModal(timerDialog);
    intervalInput.focus();
  }

  function openEditDialog(timer) {
    editingTimerId = timer.id;
    timerDialogTitle.textContent = 'Edit Timer';
    timerDialogOk.textContent = 'Save';
    var a = formatMinutes(timer.minMinutes), b = formatMinutes(timer.maxMinutes);
    intervalInput.value = a === b ? a : a + '-' + b;
    promptInput.value = timer.prompt;
    resetDialogErrors();
    showModal(timerDialog);
    intervalInput.focus();
  }

  function closeDialog() {
    editingTimerId = null;
    try { if (timerDialog.open) timerDialog.close(); else timerDialog.removeAttribute('open'); } catch (e) {}
    addTimerBtn.focus();
  }

  function submitTimerDialog() {
    resetDialogErrors();
    if (!editingTimerId && timers.length >= MAX_TIMERS) {
      // Belt-and-braces for a dialog that was open when the cap was reached.
      dialogNote.textContent = 'Maximum of ' + MAX_TIMERS + ' timers reached. Delete an existing timer before adding another.';
      announce(dialogNote.textContent);
      return false;
    }
    var parsed = parseInterval(intervalInput.value);
    if (parsed.error) {
      intervalError.textContent = parsed.error;
      intervalError.hidden = false;
      intervalInput.focus();
      return false;
    }
    var prompt = promptInput.value.trim();
    if (!prompt) {
      promptError.hidden = false;
      promptInput.focus();
      return false;
    }

    if (editingTimerId) {
      var timer = findTimer(editingTimerId);
      if (timer) {
        timer.prompt = prompt;
        timer.minMinutes = parsed.minMinutes;
        timer.maxMinutes = parsed.maxMinutes;
        // Interval definition applies to the NEXT generated interval;
        // the current running countdown is left untouched.
        saveTimers();
        updateCardDynamic(timer, Date.now());
        updateDashboard();
        announce('Updated timer: ' + shortHead(timer.prompt) + '.');
      }
    } else {
      var t = makeTimer({ prompt: prompt, minMinutes: parsed.minMinutes, maxMinutes: parsed.maxMinutes, state: 'not-started' });
      timers.push(t);
      rebuildGrid();
      saveTimers();
      startTimer(t); // Add & Start begins the first interval immediately
    }
    closeDialog();
    return true;
  }

  timerForm.addEventListener('submit', function (e) { e.preventDefault(); submitTimerDialog(); });
  timerDialog.addEventListener('cancel', function (e) { e.preventDefault(); closeDialog(); });
  timerDialogCancel.addEventListener('click', closeDialog);

  // -------------------------------------------------------------------
  // Delete confirmation dialog (lightweight, accessible).
  // -------------------------------------------------------------------
  function askDeleteTimer(timer) {
    confirmMessage.textContent = 'Delete timer “' + shortHead(timer.prompt) + '”? Its reminder count is removed from the total.';
    pendingConfirmId = timer.id;
    showModal(confirmDialog);
  }

  function closeConfirm() {
    pendingConfirmId = null;
    try { if (confirmDialog.open) confirmDialog.close(); else confirmDialog.removeAttribute('open'); } catch (e) {}
    addTimerBtn.focus();
  }

  confirmOk.addEventListener('click', function () {
    var id = pendingConfirmId;
    closeConfirm();
    var timer = findTimer(id);
    if (timer) deleteTimer(timer);
  });
  confirmCancel.addEventListener('click', closeConfirm);
  confirmDialog.addEventListener('cancel', function (e) { e.preventDefault(); closeConfirm(); });

  // -------------------------------------------------------------------
  // Dashboard toolbar actions.
  // -------------------------------------------------------------------
  addTimerBtn.addEventListener('click', openAddDialog);
  emptyAddBtn.addEventListener('click', openAddDialog);

  pauseAllBtn.addEventListener('click', function () {
    var now = Date.now();
    timers.forEach(function (t) {
      if (t.state === 'running') {
        t.remainingMilliseconds = Math.max(0, t.targetTimestamp - now);
        t.targetTimestamp = 0;
        t.state = 'paused';
      }
    });
    saveTimers();
    timers.forEach(function (t) { updateCardDynamic(t, now); });
    updateDashboard();
    stopHeartbeatIfIdle();
    updateWakeLockState();
    announce('Paused all timers.');
  });

  resumeAllBtn.addEventListener('click', function () {
    var now = Date.now();
    timers.forEach(function (t) {
      if (t.state === 'paused' && t.remainingMilliseconds > 0) {
        t.targetTimestamp = now + t.remainingMilliseconds;
        t.state = 'running';
      }
    });
    saveTimers();
    timers.forEach(function (t) { updateCardDynamic(t, now); });
    updateDashboard();
    if (countRunning() > 0) startHeartbeat();
    updateWakeLockState();
    announce('Resumed all timers.');
  });

  // -------------------------------------------------------------------
  // Card grid events (delegation).
  // -------------------------------------------------------------------
  timerGrid.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var card = e.target.closest('.timer-card');
    if (!card) return;
    var timer = findTimer(card.dataset.id);
    if (!timer) return;

    if (btn.classList.contains('ctl-toggle')) {
      if (timer.state === 'running') pauseTimer(timer);
      else if (timer.state === 'paused') resumeTimer(timer);
      else startTimer(timer);
    } else if (btn.classList.contains('ctl-new')) {
      newIntervalTimer(timer);
    } else if (btn.classList.contains('ctl-edit')) {
      openEditDialog(timer);
    } else if (btn.classList.contains('ctl-delete')) {
      askDeleteTimer(timer);
    }
  });

  // -------------------------------------------------------------------
  // Page visibility handling: browsers throttle/suspend timers in hidden
  // tabs and during sleep. Because countdowns derive from wall-clock
  // targets, a single tick() on return refreshes the display and expires
  // any timer whose deadline passed (at most one reminder each, then a
  // fresh interval from now) — never replaying a backlog.
  // -------------------------------------------------------------------
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (countRunning() > 0) tick();
    updateWakeLockState();
  });

  // -------------------------------------------------------------------
  // Init / migration / restore.
  // -------------------------------------------------------------------
  function migrateFromV1IfNeeded() {
    // Only migrate once, before any v2 timers exist. After the first
    // run TIMERS_KEY exists so subsequent loads (even empty) skip this.
    if (safeRead(TIMERS_KEY) !== null) return;
    var legacy = loadLegacyDuration();
    var t = makeTimer({
      prompt: 'Time to Click.',
      minMinutes: legacy.min,
      maxMinutes: legacy.max,
      remindersCompleted: legacy.count,
      state: 'not-started'
    });
    timers.push(t);
    saveTimers(); // writes the key so migration is idempotent
  }

  function restoreRuntime() {
    // Normalize loaded runtime state after a refresh. Overdue timers are
    // collected, not enqueued: alarm processing must not begin before the
    // timer cards exist in the DOM, so init() enqueues after rebuildGrid().
    var overdueTimers = [];
    var now = Date.now();
    timers.forEach(function (t) {
      if (t.state === 'running') {
        if (t.targetTimestamp > 0) {
          var rem = t.targetTimestamp - now;
          if (rem <= 0) {
            // Deadline passed while the page was away: fire at most one
            // reminder and establish a new interval from now.
            t.remindersCompleted += 1;
            overdueTimers.push(t);
            armNextInterval(t, now);
          } else {
            t.remainingMilliseconds = rem;
          }
        } else {
          // Running but no valid target (corrupt): treat as paused.
          t.state = 'paused';
          if (t.remainingMilliseconds <= 0) {
            t.remainingMilliseconds = t.currentIntervalSeconds > 0 ? t.currentIntervalSeconds * 1000 : 0;
          }
        }
      } else if (t.state === 'paused') {
        t.targetTimestamp = 0;
        if (t.remainingMilliseconds <= 0) t.remainingMilliseconds = 0;
      } else {
        t.targetTimestamp = 0;
        t.remainingMilliseconds = 0;
      }
    });
    saveTimers();
    return overdueTimers;
  }

  function init() {
    migrateFromV1IfNeeded();
    timers = loadTimers();
    var overdueTimers = restoreRuntime();
    bindSettingsToUI();
    rebuildGrid();
    refreshVoices();

    // Cards now exist, so restore-time alarms can safely flash them.
    overdueTimers.forEach(function (t) { enqueueAlarm(t); });

    if (countRunning() > 0) {
      startHeartbeat();
      tick();
    } else {
      updateDocumentTitle(Date.now());
    }
    updateWakeLockState();

    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
      } catch (e) {
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }
    }
  }

  // Expose a small, non-visual test hook for automated/browser testing.
  // It is intentionally not shown in the UI and requires no production
  // changes; only the functions the scheduler already uses.
  window.__TTC_TEST__ = {
    timers: function () { return timers.map(function (t) { return Object.assign({}, t); }); },
    addAndStart: function (opts) {
      if (timers.length >= MAX_TIMERS) return null;
      var t = makeTimer({ prompt: opts.prompt, minMinutes: opts.minMinutes, maxMinutes: opts.maxMinutes, state: 'not-started' });
      timers.push(t);
      rebuildGrid(); saveTimers(); startTimer(t);
      return t.id;
    },
    expireNow: function (id) {
      var t = findTimer(id);
      if (t) { t.targetTimestamp = Date.now() - 1; tick(); }
    },
    expireAll: function () {
      timers.forEach(function (t) { if (t.state === 'running') t.targetTimestamp = Date.now() - 1; });
      tick();
    },
    pause: function (id) { var t = findTimer(id); if (t) pauseTimer(t); },
    resume: function (id) { var t = findTimer(id); if (t) resumeTimer(t); },
    newInterval: function (id) { var t = findTimer(id); if (t) newIntervalTimer(t); },
    edit: function (id, opts) {
      var t = findTimer(id); if (!t) return;
      if (opts.prompt) t.prompt = opts.prompt;
      if (opts.minMinutes) t.minMinutes = opts.minMinutes;
      if (opts.maxMinutes) t.maxMinutes = opts.maxMinutes;
      saveTimers(); updateCardDynamic(t, Date.now()); updateDashboard();
    },
    delete: function (id) {
      pendingConfirmId = id; confirmOk.click();
    },
    deleteDirect: function (id) { var t = findTimer(id); if (t) deleteTimer(t); },
    clearAll: function () { timers.slice().forEach(function (t) { deleteTimer(t); }); },
    pauseAll: function () { pauseAllBtn.click(); },
    resumeAll: function () { resumeAllBtn.click(); },
    parse: parseInterval,
    makeId: uid,
    alarmQueueLength: function () { return alarmQueue.length; },
    alarmBusy: function () { return alarmBusy; },
    processedAlarmCount: function () { return processedAlarmCount; },
    speechSafetyTimeoutMs: speechSafetyTimeoutMs,
    setSpeechRate: function (r) { settings.speechRate = clampNumber(r, 0.5, 2, 1); saveSettings(); },
    tick: function () { tick(); },
    find: findTimer,
    setRemaining: function (id, ms) {
      var t = findTimer(id); if (!t) return;
      t.remainingMilliseconds = ms; t.targetTimestamp = Date.now() + ms; t.state = 'running';
    }
  };

  init();
})();
</script>
</body>
</html>
