<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeitCloud — Cultural Weather Radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌩️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.min.js"></script>
<style>
/* ============================================================
   ZeitCloud — Cultural Weather Radar
   Aesthetic: Dark editorial control-room with warm accents
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root,
html[data-theme="dark"] {
  --bg-desk: #060a0f;
  --bg-panel: #0c1117;
  --bg-card: #111820;
  --bg-hover: #1a2230;
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #475569;
  --accent-amber: #ff9f43;
  --accent-cyan: #00d2ff;
  --accent-magenta: #ff6b9d;
  --accent-green: #2ecc71;
  --accent-red: #ff4757;
  --font-display: 'Newsreader', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-body: system-ui, -apple-system, sans-serif;
  --shadow-card: 0 0 0 1px rgba(148, 163, 184, 0.08), 0 4px 16px rgba(0,0,0,0.4);
  --shadow-glow-amber: 0 0 20px rgba(255,159,67,0.15);
  --shadow-glow-cyan: 0 0 20px rgba(0,210,255,0.15);
  --border-subtle: rgba(148,163,184,0.08);
  --border-medium: rgba(148,163,184,0.15);
  /* cloud word colors */
  --cloud-fresh: #ffffff;
  --cloud-recent: #e2e8f0;
  --cloud-old: #94a3b8;
  /* category colors */
  --cat-politics: #ff6b81;
  --cat-tech: #5ee7ff;
  --cat-sports: #ffbd7a;
  --cat-entertainment: #ff8fab;
  --cat-finance: #5ee7a0;
  --cat-disaster: #ff7b85;
  --cat-weird: #c9a8ff;
  --cat-global: #ffd54f;
}

html[data-theme="light"] {
  --bg-desk: #f8fafc;
  --bg-panel: #f1f5f9;
  --bg-card: #ffffff;
  --bg-hover: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --accent-amber: #f59e0b;
  --accent-cyan: #0284c7;
  --accent-magenta: #db2777;
  --accent-green: #059669;
  --accent-red: #dc2626;
  --shadow-card: 0 0 0 1px rgba(100, 116, 139, 0.15), 0 4px 12px rgba(0,0,0,0.08);
  --shadow-glow-amber: 0 0 16px rgba(245,158,11,0.12);
  --shadow-glow-cyan: 0 0 16px rgba(2,132,199,0.12);
  --border-subtle: rgba(100,116,139,0.10);
  --border-medium: rgba(100,116,139,0.20);
  --cloud-fresh: #0f172a;
  --cloud-recent: #334155;
  --cloud-old: #64748b;
  --cat-politics: #dc2626;
  --cat-tech: #0369a1;
  --cat-sports: #c2410c;
  --cat-entertainment: #be185d;
  --cat-finance: #047857;
  --cat-disaster: #dc2626;
  --cat-weird: #7c3aed;
  --cat-global: #a16207;
}

html[data-theme="light"] .noise-overlay { opacity: 0.018; }

html[data-theme="hc-dark"] {
  --bg-desk: #000000;
  --bg-panel: #0a0a0a;
  --bg-card: #111111;
  --bg-hover: #1a1a1a;
  --text-main: #ffffff;
  --text-muted: #cccccc;
  --text-dim: #999999;
  --accent-amber: #ffb700;
  --accent-cyan: #00e5ff;
  --accent-magenta: #ff66a3;
  --accent-green: #00ff66;
  --accent-red: #ff3333;
  --shadow-card: 0 0 0 2px rgba(255,255,255,0.25), 0 4px 16px rgba(0,0,0,0.6);
  --shadow-glow-amber: 0 0 24px rgba(255,183,0,0.25);
  --shadow-glow-cyan: 0 0 24px rgba(0,229,255,0.25);
  --border-subtle: rgba(255,255,255,0.20);
  --border-medium: rgba(255,255,255,0.40);
  --cloud-fresh: #ffffff;
  --cloud-recent: #ffffff;
  --cloud-old: #cccccc;
  --cat-politics: #ff4444;
  --cat-tech: #00e5ff;
  --cat-sports: #ffaa33;
  --cat-entertainment: #ff66a3;
  --cat-finance: #00ff66;
  --cat-disaster: #ff4444;
  --cat-weird: #bb88ff;
  --cat-global: #ffcc00;
}

html[data-theme="hc-light"] {
  --bg-desk: #ffffff;
  --bg-panel: #f5f5f5;
  --bg-card: #ffffff;
  --bg-hover: #eeeeee;
  --text-main: #000000;
  --text-muted: #333333;
  --text-dim: #666666;
  --accent-amber: #b45309;
  --accent-cyan: #075985;
  --accent-magenta: #9d174d;
  --accent-green: #047857;
  --accent-red: #b91c1c;
  --shadow-card: 0 0 0 2px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.10);
  --shadow-glow-amber: 0 0 16px rgba(180,83,9,0.15);
  --shadow-glow-cyan: 0 0 16px rgba(7,89,133,0.15);
  --border-subtle: rgba(0,0,0,0.12);
  --border-medium: rgba(0,0,0,0.25);
  --cloud-fresh: #000000;
  --cloud-recent: #000000;
  --cloud-old: #333333;
  --cat-politics: #b91c1c;
  --cat-tech: #075985;
  --cat-sports: #c2410c;
  --cat-entertainment: #9d174d;
  --cat-finance: #047857;
  --cat-disaster: #b91c1c;
  --cat-weird: #6b21a8;
  --cat-global: #854d0e;
}

html[data-theme="hc-light"] .noise-overlay,
html[data-theme="hc-dark"] .noise-overlay { opacity: 0.008; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

html, body { height: 100%; background: var(--bg-desk); color: var(--text-main); font-family: var(--font-body); line-height: 1.5; }

/* Noise overlay */
.noise-overlay {
  position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-panel); }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* App layout */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Header */
header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-medium);
  padding: 0 20px;
  display: flex; align-items: center; gap: 16px;
  min-height: 56px; flex-shrink: 0;
}
header h1 {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
  white-space: nowrap;
}
header h1 .accent { color: var(--accent-amber); font-style: italic; }
header .tagline {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 300px;
}
header .header-controls {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
header .header-controls button, header .header-controls select {
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font-mono);
}
header .header-controls button:hover {
  border-color: var(--accent-amber);
  color: var(--text-main);
}
header .header-controls button.primary {
  background: var(--accent-amber);
  color: #1a1200;
  border-color: var(--accent-amber);
  font-weight: 700;
}
header .header-controls button.primary:hover {
  background: #ffb347;
  box-shadow: var(--shadow-glow-amber);
}
header .header-controls button:disabled {
  opacity: 0.4; cursor: not-allowed;
}
header .header-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-muted);
  font-family: var(--font-mono);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim); display: inline-block;
}
.status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
.status-dot.scanning { background: var(--accent-amber); animation: pulse 1.2s infinite; box-shadow: 0 0 8px var(--accent-amber); }
.status-dot.error { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Nav */
nav {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 20px;
  display: flex; gap: 4px; flex-shrink: 0;
}
nav button {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--text-muted); padding: 10px 16px 8px;
  font-size: 13px; cursor: pointer;
  font-family: var(--font-mono); letter-spacing: 0.5px;
  text-transform: uppercase;
}
nav button:hover { color: var(--text-main); }
nav button.active {
  color: var(--accent-cyan);
  border-bottom-color: var(--accent-cyan);
}

/* Main content */
main {
  flex: 1; overflow: auto;
  padding: 20px;
  position: relative;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 20px;
  box-shadow: var(--shadow-card);
}
.card-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  color: var(--text-main);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-subtitle {
  font-size: 12px; color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom: 16px;
}

/* Word cloud container */
#cloud-container {
  width: 100%;
  min-height: 500px;
  position: relative;
  display: flex; justify-content: center; align-items: center;
  background: radial-gradient(ellipse at center, rgba(0,210,255,0.02) 0%, transparent 70%);
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
}
#cloud-container svg { display: block; }
#cloud-container .cloud-word {
  cursor: pointer;
  transition: opacity 0.2s;
}
#cloud-container .cloud-word:hover {
  opacity: 0.85;
  filter: drop-shadow(0 0 4px currentColor);
}
#cloud-container .cloud-word.pulse {
  animation: wordPulse 2s ease-in-out;
}
@keyframes wordPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; filter: drop-shadow(0 0 8px currentColor); }
}

/* Tooltip */
.cloud-tooltip {
  position: absolute;
  background: var(--bg-panel);
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  padding: 12px;
  font-size: 12px;
  color: var(--text-main);
  pointer-events: none;
  z-index: 100;
  max-width: 280px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  font-family: var(--font-mono);
  line-height: 1.5;
}
.cloud-tooltip .tt-term {
  font-size: 14px; font-weight: 700;
  color: var(--accent-amber);
  margin-bottom: 4px;
}
.cloud-tooltip .tt-meta {
  color: var(--text-muted);
  font-size: 11px;
}
.cloud-tooltip .tt-sources {
  margin-top: 6px;
  display: flex; flex-wrap: wrap; gap: 4px;
}
.cloud-tooltip .tt-source-tag {
  background: var(--border-medium);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  color: var(--text-muted);
}

/* Detail panel */
.detail-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px; max-width: 90vw;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-medium);
  z-index: 200;
  overflow-y: auto;
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  box-shadow: -8px 0 32px rgba(0,0,0,0.5);
}
.detail-panel.open { transform: translateX(0); }
.detail-panel .close-btn {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none; color: var(--text-muted);
  font-size: 20px; cursor: pointer;
}
.detail-panel .close-btn:hover { color: var(--text-main); }
.detail-panel h2 {
  font-family: var(--font-display);
  font-size: 24px; margin-bottom: 4px;
}
.detail-panel .term-score {
  font-family: var(--font-mono);
  font-size: 13px; color: var(--accent-amber);
  margin-bottom: 16px;
}
.detail-panel h3 {
  font-size: 12px; text-transform: uppercase;
  color: var(--text-dim); letter-spacing: 1px;
  margin: 20px 0 8px;
  font-family: var(--font-mono);
}
.detail-panel .related-terms {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.detail-panel .related-term {
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.detail-panel .related-term:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}
.detail-panel .example-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13px;
}
.detail-panel .example-item a {
  color: var(--accent-cyan); text-decoration: none;
  font-size: 12px;
}
.detail-panel .example-item a:hover { text-decoration: underline; }
.detail-panel .sparkline {
  display: flex; align-items: flex-end; gap: 2px;
  height: 40px;
  margin-top: 8px;
}
.detail-panel .sparkline-bar {
  flex: 1;
  background: var(--accent-cyan);
  border-radius: 1px;
  opacity: 0.7;
  min-height: 2px;
}

/* Clusters view */
.clusters-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.cluster-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.cluster-card h3 {
  font-family: var(--font-mono);
  font-size: 13px; text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.cluster-card .cluster-terms {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.cluster-card .cluster-term {
  background: var(--border-subtle);
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.cluster-card .cluster-term:hover {
  background: rgba(0,210,255,0.08);
  border-color: rgba(0,210,255,0.2);
  color: var(--accent-cyan);
}
.cluster-card .cluster-velocity {
  font-size: 11px; color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 8px;
}

/* AI Panel */
.ai-panel {
  max-width: 800px; margin: 0 auto;
}
.ai-controls {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.ai-controls button {
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font-mono);
}
.ai-controls button:hover { border-color: var(--accent-cyan); color: var(--text-main); }
.ai-controls button.active { background: rgba(0,210,255,0.08); border-color: var(--accent-cyan); color: var(--accent-cyan); }
.ai-output {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 20px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text-main);
  min-height: 200px;
}
.ai-output.ai-loading {
  color: var(--text-dim);
  font-style: italic;
}
.ai-output .doom-meter {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  margin-bottom: 16px;
}
.ai-output .doom-item {
  background: var(--bg-panel);
  padding: 12px;
  border-radius: 6px;
  text-align: center;
}
.ai-output .doom-label {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
}
.ai-output .doom-value {
  font-size: 28px; font-weight: 700;
  margin-top: 4px;
}
.ai-output .doom-bar {
  height: 4px; background: var(--bg-card); border-radius: 2px; margin-top: 8px;
}
.ai-output .doom-bar-fill {
  height: 100%; border-radius: 2px;
}

/* Sources / Admin */
.source-list { display: flex; flex-direction: column; gap: 8px; }
.source-row {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.source-row.disabled { opacity: 0.5; }
.source-row .source-info { flex: 1; }
.source-row .source-name { font-size: 14px; font-weight: 600; }
.source-row .source-meta {
  font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
}
.source-row .source-toggle {
  appearance: none;
  width: 36px; height: 20px;
  background: var(--bg-panel);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  border: 1px solid var(--border-medium);
}
.source-row .source-toggle::after {
  content: ''; position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all 0.2s;
}
.source-row .source-toggle:checked { background: rgba(46,204,113,0.15); border-color: var(--accent-green); }
.source-row .source-toggle:checked::after { left: 18px; background: var(--accent-green); }
.source-row .source-actions {
  display: flex; gap: 6px;
}
.source-row .source-actions button {
  background: none; border: 1px solid var(--border-medium);
  color: var(--text-muted); padding: 4px 10px;
  border-radius: 4px; font-size: 11px;
  cursor: pointer; font-family: var(--font-mono);
}
.source-row .source-actions button:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
  font-size: 11px; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 0.5px;
  font-family: var(--font-mono);
}
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  color: var(--text-main);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  font-family: var(--font-mono);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent-cyan);
}
.form-group textarea { min-height: 80px; resize: vertical; }

.admin-section {
  margin-bottom: 32px;
}
.admin-section h2 {
  font-family: var(--font-display);
  font-size: 20px;
  margin-bottom: 16px;
}

.btn {
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font-mono);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent-cyan); color: var(--text-main); }
.btn.primary {
  background: var(--accent-amber);
  color: #1a1200; border-color: var(--accent-amber);
  font-weight: 700;
}
.btn.primary:hover { background: #ffb347; box-shadow: var(--shadow-glow-amber); }
.btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn.danger:hover { background: rgba(255,71,87,0.08); }
.btn.small { padding: 4px 10px; font-size: 11px; }

/* Raw feed drawer */
.raw-drawer {
  display: flex; flex-direction: column; gap: 12px;
}
.raw-item {

async function initDb() {
  const db = new Dexie(DB_NAME);
  db.version(DB_VERSION).stores({
    sources: 'id, name, type, enabled, region',
    fetchRuns: '++id, startedAt, completedAt, status',
    rawItems: '++id, sourceId, fetchRunId, fetchedAt',
    terms: '++id, normalized, lastSeen, totalScore',
    termObservations: '++id, termId, rawItemId, sourceId, observedAt',
    aiSummaries: '++id, fetchRunId, model, createdAt',
    settings: 'key'
  });
  state.db = db;
}

async function loadSources() {
  const stored = await state.db.sources.toArray();
  if (stored.length === 0) {
    for (const s of DEFAULT_SOURCES) {
      await state.db.sources.put({ ...s, createdAt: Date.now(), updatedAt: Date.now() });
    }
    state.sources = [...DEFAULT_SOURCES];
  } else {
    state.sources = stored;
  }
}

async function loadSettings() {
  const stored = await state.db.settings.toArray();
  const map = {};
  for (const s of stored) map[s.key] = s.value;
  state.settings = { ...DEFAULT_SETTINGS, ...map };
}

async function saveSetting(key, value) {
  state.settings[key] = value;
  await state.db.settings.put({ key, value });
}

async function saveSource(source) {
  source.updatedAt = Date.now();
  await state.db.sources.put(source);
  const idx = state.sources.findIndex(s => s.id === source.id);
  if (idx >= 0) state.sources[idx] = source;
  else state.sources.push(source);
}

async function deleteSource(id) {
  await state.db.sources.delete(id);
  state.sources = state.sources.filter(s => s.id !== id);
}

async function getEnabledSources() {
  return state.sources.filter(s => s.enabled);
}

// ============================================================
// Fetching
// ============================================================

async function fetchSource(source) {
  const url = source.corsMode === 'proxy' ? (state.settings.proxyUrl + encodeURIComponent(source.url)) : source.url;
  const opts = { method: 'GET', headers: {} };
  if (source.authType === 'bearer' && source.authToken) {
    opts.headers['Authorization'] = 'Bearer ' + source.authToken;
  } else if (source.authType === 'apiKey' && source.authToken) {
    opts.headers['X-API-Key'] = source.authToken;
  }

  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  if (source.parser === 'google_trends_rss' || source.type === 'rss') {
    const text = await res.text();
    return parseRSS(text, source);
  } else if (source.parser === 'reddit_json') {
    const json = await res.json();
    return parseRedditJSON(json, source);
  } else if (source.parser === 'hackernews_algolia') {
    const json = await res.json();
    return parseHNAlgolia(json, source);
  } else if (source.type === 'json_api') {
    const json = await res.json();
    return parseGenericJSON(json, source);
  } else if (source.type === 'manual') {
    return [];
  }
  return [];
}

function parseRSS(xmlText, source) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');
  const items = doc.querySelectorAll('item');
  const out = [];
  items.forEach(item => {
    const title = item.querySelector('title')?.textContent || '';
    const link = item.querySelector('link')?.textContent || '';
    const description = item.querySelector('description')?.textContent || '';
    const pubDate = item.querySelector('pubDate')?.textContent || '';
    if (title) {
      out.push({
        title, url: link, description,
        publishedAt: pubDate ? new Date(pubDate).getTime() : Date.now(),
        sourceId: source.id, sourceName: source.name, sourceWeight: source.weight || 1,
        rawJson: { title, link, description, pubDate }
      });
    }
  });
  return out;
}

function parseRedditJSON(json, source) {
  const posts = json?.data?.children || [];
  return posts.map(p => {
    const d = p.data;
    return {
      title: d.title || '',
      url: d.url || `https://reddit.com${d.permalink || ''}`,
      description: d.selftext?.slice(0, 500) || '',
      publishedAt: d.created_utc ? d.created_utc * 1000 : Date.now(),
      sourceId: source.id, sourceName: source.name, sourceWeight: source.weight || 1,
      rawJson: d
    };
  }).filter(i => i.title);
}

function parseHNAlgolia(json, source) {
  const hits = json?.hits || [];
  return hits.map(h => ({
    title: h.title || h.story_text || '',
    url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
    description: '',
    publishedAt: h.created_at ? new Date(h.created_at).getTime() : Date.now(),
    sourceId: source.id, sourceName: source.name, sourceWeight: source.weight || 1,
    rawJson: h
  })).filter(i => i.title);
}

function parseGenericJSON(json, source) {
  if (Array.isArray(json)) {
    return json.map(item => ({
      title: item.title || item.name || item.headline || JSON.stringify(item).slice(0, 100),
      url: item.url || item.link || '',
      description: item.description || item.summary || '',
      publishedAt: item.date || item.publishedAt || item.created_at || Date.now(),
      sourceId: source.id, sourceName: source.name, sourceWeight: source.weight || 1,
      rawJson: item
    })).filter(i => i.title);
  }
  return [];
}

  if (state.isScanning) return;

  const run = {

    sourceCount: 0,

  };
  const runId = await state.db.fetchRuns.add(run);
  state.lastFetchRunId = runId;

  const sources = getEnabledSourcesForRegion();
  run.sourceCount = sources.length;

  for (const source of sources) {
    try {
      const items = await fetchSource(source);
      for (const item of items) {
        item.fetchRunId = runId;
        item.fetchedAt = Date.now();
        item.hash = hashString(item.title + item.sourceId);
        await state.db.rawItems.add(item);
        run.itemCount++;
      }
      toast(`${source.name}: ${items.length} items`, 'success');
    } catch (e) {
      console.error(`Source ${source.name} failed:`, e);
      run.errorCount++;
      toast(`${source.name} failed: ${e.message}`, 'error');
    }
  }

  run.completedAt = Date.now();
  run.status = run.errorCount >= sources.length ? 'error' : 'ok';
  await state.db.fetchRuns.update(runId, run);

  await processTerms(runId);
  state.isScanning = false;
  updateStatus(run.status === 'ok' ? 'active' : 'error');
  toast(`Scan complete. ${run.itemCount} items from ${sources.length - run.errorCount} sources.`, run.status === 'ok' ? 'success' : 'error');

  let aiSummary = null;
  if (state.settings.aiEnabled && state.settings.openRouterKey) {
    aiSummary = await generateAISummary(runId);
  }

  await loadTerms();
  await loadRawItems();
  await loadFetchRuns();
  renderCurrentView();
  if (aiSummary) playCompletionChime();
}

function getEnabledSourcesForRegion() {
  const region = state.settings.region;
  return state.sources.filter(s => {
    if (!s.enabled) return false;
    if (region === 'world') return true;
    return s.region === region || s.region === 'world' || !s.region;
  });
}

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h + str.charCodeAt(i)) | 0; }
  return String(Math.abs(h));
}

// ============================================================
// Term Processing
// ============================================================

async function processTerms(runId) {
  const items = await state.db.rawItems.where('fetchRunId').equals(runId).toArray();
  const now = Date.now();

  for (const item of items) {
    const text = (item.title + ' ' + (item.description || '')).toLowerCase();
    const terms = extractTerms(text);

    for (const { term, type } of terms) {
      const normalized = term.toLowerCase().replace(/[^a-z0-9# ]/g, '').trim();
      if (!normalized || normalized.length < state.settings.minTermLength) continue;
      if (state.settings.removeStopWords && STOP_WORDS.has(normalized)) continue;

      let existing = await state.db.terms.where('normalized').equals(normalized).first();
      if (!existing) {
        const termId = await state.db.terms.add({
          term: normalized,
          normalized,
          type,
          firstSeen: now,
          lastSeen: now,
          totalScore: 0,
          sourceIds: [],
          category: guessCategory(normalized)
        });
        existing = { id: termId, normalized, sourceIds: [], totalScore: 0 };
      }

      const score = computeTermScore(item, existing);
      existing.totalScore = (existing.totalScore || 0) + score;
      existing.lastSeen = now;
      if (!existing.sourceIds.includes(item.sourceId)) {
        existing.sourceIds.push(item.sourceId);
      }

      await state.db.terms.update(existing.id, {
        totalScore: existing.totalScore,
        lastSeen: now,
        sourceIds: existing.sourceIds
      });

      await state.db.termObservations.add({
        termId: existing.id,
        rawItemId: item.id,
        sourceId: item.sourceId,
        score,
        observedAt: now
      });
    }
  }
}

function extractTerms(text) {
  const terms = [];

  // Hashtags
  if (state.settings.includeHashtags) {
    const hashtags = text.match(/#[a-z0-9_]+/g) || [];
    hashtags.forEach(h => terms.push({ term: h.replace('#', ''), type: 'hashtag' }));
  }

  // Clean text for word extraction
  const clean = text
    .replace(/https?:\/\/\S+/g, ' ')
    .replace(/[^a-z0-9\s#]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const elimSet = new Set((state.settings.eliminationList || []).map(x => x.toLowerCase()));
  const words = clean.split(/\s+/).filter(w => w.length >= state.settings.minTermLength && !STOP_WORDS.has(w) && !elimSet.has(w));

  // Single words
  words.forEach(w => terms.push({ term: w, type: 'word' }));

  // Phrases (n-grams)
  if (state.settings.includePhrases) {
    const maxLen = state.settings.phraseLength || 3;
    for (let n = 2; n <= maxLen; n++) {
      for (let i = 0; i <= words.length - n; i++) {
        const phrase = words.slice(i, i + n).join(' ');
        if (phrase.length >= 6 && !elimSet.has(phrase)) {
          terms.push({ term: phrase, type: 'phrase' });
        }
      }
    }
  }

  // Capitalized phrases (potential entities)
  const entityMatches = text.match(/\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3}\b/g) || [];
  entityMatches.forEach(e => {
    const lower = e.toLowerCase();
    if (!elimSet.has(lower)) terms.push({ term: lower, type: 'entity' });
  });

  return terms;
}

function computeTermScore(item, existingTerm) {
  let score = 1;
  score *= (item.sourceWeight || 1);

  // Title boost
  score *= 2;

  // Phrase boost
  if (existingTerm.type === 'phrase') score *= 1.3;
  if (existingTerm.type === 'entity') score *= 1.5;

  // Freshness boost
  const ageHours = (Date.now() - (item.publishedAt || Date.now())) / 3600000;
  if (state.settings.boostNewer && ageHours < 2) score *= 1.5;
  else if (ageHours < 24) score *= 1.2;
  else if (state.settings.decayOldTerms && ageHours > 48) score *= 0.7;

  // Multi-source boost
  if (state.settings.boostMultiSource && existingTerm.sourceIds && existingTerm.sourceIds.length > 1) {
    score *= (1 + existingTerm.sourceIds.length * 0.2);
  }

  return score;
}

function guessCategory(term) {
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    if (cat.keywords.some(k => term.includes(k))) return key;
  }
  return 'general';
}

async function loadTerms() {
  const all = await state.db.terms.toArray();
  const elimSet = new Set((state.settings.eliminationList || []).map(x => x.toLowerCase()));
  const now = Date.now();
  state.terms = all
    .filter(t => {
      const norm = t.normalized;
      if (!norm) return false;
      if (state.settings.removeStopWords && STOP_WORDS.has(norm)) return false;
      if (elimSet.has(norm)) return false;
      return true;
    })
    .map(t => {
      let score = t.totalScore || 0;
      if (state.settings.decayOldTerms) {
        const hoursOld = (now - t.lastSeen) / 3600000;
        if (hoursOld > 24) score *= Math.pow(0.95, hoursOld / 24);
      }
      return { ...t, displayScore: score };
    })
    .sort((a, b) => b.displayScore - a.displayScore);
}

async function loadRawItems(limit = 200) {
  state.rawItems = await state.db.rawItems.orderBy('fetchedAt').reverse().limit(limit).toArray();
}

async function loadFetchRuns() {
  state.fetchRuns = await state.db.fetchRuns.orderBy('startedAt').reverse().limit(50).toArray();
}

// ============================================================
// AI Summary
// ============================================================

async function generateAISummary(fetchRunId) {
  const mode = AI_MODES[state.settings.aiMode] || AI_MODES.straight;
  const topTerms = state.terms.slice(0, 30).map(t => ({
    term: t.normalized,
    score: Math.round(t.displayScore),
    sources: t.sourceIds || []
  }));

  // Build clusters from top terms
  const clusters = {};
  topTerms.forEach(t => {
    const cat = guessCategory(t.term);
    if (!clusters[cat]) clusters[cat] = [];
    clusters[cat].push(t.term);
  });

  // Find new/faded
  const prevRun = await state.db.fetchRuns.orderBy('startedAt').reverse().offset(1).limit(1).first();
  let newTerms = [], fadedTerms = [];
  if (prevRun) {
    const prevItems = await state.db.rawItems.where('fetchRunId').equals(prevRun.id).toArray();
    const prevTitles = prevItems.map(i => i.title.toLowerCase());
    const currItems = await state.db.rawItems.where('fetchRunId').equals(fetchRunId).toArray();
    currItems.forEach(i => {
      if (!prevTitles.some(pt => i.title.toLowerCase().includes(pt.slice(0, 20)))) {
        newTerms.push(i.title);
      }
    });
  }

  const digest = {
    region: state.settings.region.toUpperCase(),
    timestamp: new Date().toISOString(),
    topTerms,
    clusters: Object.entries(clusters).map(([k, v]) => ({ label: CATEGORIES[k]?.label || k, terms: v.slice(0, 8) })),
    newSinceLastRefresh: newTerms.slice(0, 5),
    fadedSinceLastRefresh: fadedTerms.slice(0, 5)
  };

  const systemPrompt = `You are a cultural trend analyst. ${mode.prompt}`;
  const userPrompt = `Analyze this trend digest and respond according to your instructions. Keep it concise (under 300 words unless in analyst mode).\n\n${JSON.stringify(digest, null, 2)}`;

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.settings.openRouterKey,
        'HTTP-Referer': location.origin,
        'X-Title': 'ZeitCloud'
      },
      body: JSON.stringify({
        model: state.settings.aiModel || 'openai/gpt-4o-mini',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        temperature: 0.7,
        max_tokens: 600
      })
    });
    const json = await res.json();
    let summary = json.choices?.[0]?.message?.content || 'No response from AI.';
    summary = stripThinking(summary);

    await state.db.aiSummaries.add({
      fetchRunId,
      model: state.settings.aiModel,
      prompt: mode.label,
      summary,
      createdAt: Date.now()
    });

    toast('AI summary generated', 'success');
    return summary;
  } catch (e) {
    console.error('AI summary failed:', e);
    toast('AI summary failed: ' + e.message, 'error');
    return null;
  }
}

async function getLatestSummary() {
  return state.db.aiSummaries.orderBy('createdAt').reverse().first();
}

function renderWordCloud() {
  const container = document.getElementById('cloud-container');
  if (!container) return;
  container.innerHTML = '';

  const terms = state.terms.slice(0, state.settings.maxTermsCloud);
  if (terms.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">🌫️</div>No clouds yet.<br>Click Refresh to gather signals.</div>';
    return;
  }

  const width = container.clientWidth;
  const height = container.clientHeight;
  const maxScore = terms[0].displayScore || 1;

  const words = terms.map(t => ({
    text: t.normalized,
    size: Math.max(12, Math.min(64, (t.displayScore / maxScore) * 48 + 12)),
    term: t,
    color: getTermColor(t)
  }));

  const layout = d3.layout.cloud()
    .size([width, height])
    .words(words)
    .padding(4)
    .rotate(() => (Math.random() > 0.7 ? (Math.random() > 0.5 ? 90 : -90) : 0))
    .font('JetBrains Mono')
    .fontSize(d => d.size)
    .spiral('archimedean')
    .on('end', draw);

  layout.start();

  function draw(words) {
    const svg = d3.select(container).append('svg')
      .attr('width', width)
      .attr('height', height)
      .append('g')
      .attr('transform', `translate(${width/2},${height/2})`);

    const text = svg.selectAll('text')
      .data(words)
      .enter().append('text')
      .attr('class', 'cloud-word')
      .style('font-size', d => d.size + 'px')
      .style('font-family', 'JetBrains Mono, monospace')
      .style('font-weight', d => d.size > 30 ? '700' : '400')
      .style('fill', d => d.color)
      .style('cursor', 'pointer')
      .attr('text-anchor', 'middle')
      .attr('transform', d => `translate(${d.x},${d.y})rotate(${d.rotate})`)
      .text(d => d.text)
      .on('click', (e, d) => showTermDetail(d.term.id))
      .on('mouseover', (e, d) => showCloudTooltip(e, d.term))
      .on('mouseout', hideCloudTooltip);

    // Pulse new terms
    const now = Date.now();
    text.filter(d => d.term.lastSeen && (now - d.term.lastSeen) < 300000)
      .attr('class', 'cloud-word pulse');
  }
}

function getTermColor(term) {
  const cat = CATEGORIES[term.category];
  if (cat) return `var(--cat-${term.category})`;
  // Freshness-based fallback
  const age = Date.now() - (term.lastSeen || 0);
  if (age < 600000) return 'var(--cloud-fresh)';
  if (age < 3600000) return 'var(--cloud-recent)';
  return 'var(--cloud-old)';
}

let tooltipEl = null;
function showCloudTooltip(event, term) {
  hideCloudTooltip();
  const cat = CATEGORIES[term.category] || { label: 'General' };
  const srcCount = (term.sourceIds || []).length;
  const srcNames = (term.sourceIds || []).map(id => {
    const s = state.sources.find(x => x.id === id);
    return s ? s.name : id;
  }).slice(0, 3);

  tooltipEl = document.createElement('div');
  tooltipEl.className = 'cloud-tooltip';
  tooltipEl.innerHTML = `
    <div class="tt-term">${esc(term.normalized)}</div>
    <div class="tt-meta">Score: ${Math.round(term.displayScore)} &middot; ${cat.label} &middot; ${srcCount} source${srcCount!==1?'s':''}</div>
    ${srcNames.length ? `<div class="tt-sources">${srcNames.map(s => `<span class="tt-source-tag">${esc(s)}</span>`).join('')}</div>` : ''}
  `;
  tooltipEl.style.left = (event.pageX + 12) + 'px';
  tooltipEl.style.top = (event.pageY + 12) + 'px';
  document.body.appendChild(tooltipEl);
}

function hideCloudTooltip() {
  if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; }
}

window.showTermDetail = async function(termId) {
  let term = state.terms.find(t => t.id === termId);
  if (!term) {
    const raw = await state.db.terms.get(termId);
    if (!raw) return;
    // Compute a display score on the fly if missing
    let score = raw.totalScore || 0;
    if (state.settings.decayOldTerms) {
      const hoursOld = (Date.now() - (raw.lastSeen || Date.now())) / 3600000;
      if (hoursOld > 24) score *= Math.pow(0.95, hoursOld / 24);
    }
    term = { ...raw, displayScore: score };
  }

  const observations = await state.db.termObservations.where('termId').equals(termId).toArray();
  const relatedItems = [];
  for (const obs of observations.slice(0, 5)) {
    const item = await state.db.rawItems.get(obs.rawItemId);
    if (item) relatedItems.push(item);
  }

  const relatedTerms = state.terms.filter(t => t.id !== termId && observations.some(o => {
    // Simple relatedness: share source or category
    return t.category === term.category || (t.sourceIds || []).some(sid => (term.sourceIds || []).includes(sid));
  })).slice(0, 8);

  const cat = CATEGORIES[term.category] || { label: 'General', color: '#94a3b8' };
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');

  // Sparkline (fake historical data for now)
  const sparkBars = Array.from({length: 12}, () => Math.random());

  content.innerHTML = `
    <h2 style="color:${cat.color}">${esc(term.normalized)}</h2>
    <div class="term-score">Score ${Math.round(term.displayScore)} &middot; ${cat.label} &middot; ${(term.sourceIds||[]).length} sources</div>

    <h3>Sparkline</h3>
    <div class="sparkline">
      ${sparkBars.map(h => `<div class="sparkline-bar" style="height:${Math.max(10,h*100)}%;opacity:${0.3+h*0.7}"></div>`).join('')}
    </div>

    <h3>Related</h3>
    <div class="related-terms">
      ${relatedTerms.map(t => `<span class="related-term" onclick="showTermDetail(${t.id})">${esc(t.normalized)}</span>`).join('') || '<span style="color:var(--text-dim)">No strong related signals</span>'}
    </div>

    <h3>Seen In</h3>
    ${relatedItems.map(item => `
      <div class="example-item">
        <div>${esc(item.title)}</div>
        ${item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.sourceName)} &rarr;</a>` : `<span style="color:var(--text-dim)">${esc(item.sourceName)}</span>`}
      </div>
    `).join('') || '<div style="color:var(--text-dim);font-size:13px;">No example items available</div>'}

    <h3>First / Last Seen</h3>
    <div style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);">
      First: ${term.firstSeen ? new Date(term.firstSeen).toLocaleString() : 'Unknown'}<br>
      Last: ${term.lastSeen ? new Date(term.lastSeen).toLocaleString() : 'Unknown'}
    </div>
  `;

  panel.classList.add('open');
};

      toast('Run a refresh first', 'error');
      return;
    }
    state.isGeneratingAISummary = true;
    runBtn.disabled = true;
    runBtn.textContent = 'Analyzing...';
    try {
      const aiSummary = await generateAISummary(state.lastFetchRunId);
      state.isGeneratingAISummary = false;
      renderAIView(container);
      if (aiSummary) playCompletionChime();
    } catch (e) {
      state.isGeneratingAISummary = false;
      renderAIView(container);
    }
  };
  controls.appendChild(runBtn);

  panel.appendChild(controls);

  const output = document.createElement('div');
  output.id = 'ai-output-panel';
  output.className = 'ai-output';
  if (!state.settings.openRouterKey) {
    output.innerHTML = '<span style="color:var(--text-dim)">Add your OpenRouter API key in Sources &rarr; Settings to enable AI summaries.</span>';
    panel.appendChild(output);
    container.appendChild(panel);
    return;
  }
  if (state.isGeneratingAISummary) {
    output.innerHTML = '<span style="color:var(--text-dim);font-style:italic;">Generating summary, please wait...</span>';
    panel.appendChild(output);
    container.appendChild(panel);
    return;
  }
  output.innerHTML = '<span style="color:var(--text-dim)">Loading latest summary...</span>';
  panel.appendChild(output);
  container.appendChild(panel);

  getLatestSummary().then(summary => {
    const out = document.getElementById('ai-output-panel');
    if (!out) return;
    if (!summary) {
      out.innerHTML = '<span style="color:var(--text-dim)">No AI summary yet. Run a scan or click "Run AI Analysis".</span>';
      return;
    }
    if (state.settings.aiMode === 'doom') {
      out.innerHTML = formatDoomMeter(summary.summary);
    } else {
      out.textContent = summary.summary;
    }
    out.innerHTML += `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-medium);color:var(--text-dim);font-size:11px;">
      ${esc(summary.model || 'unknown')} &middot; ${new Date(summary.createdAt).toLocaleString()} &middot; ${esc(summary.prompt || '')}
    </div>`;
  });
}

function formatDoomMeter(text) {
  // Try to extract doom ratings
  const lines = text.split('\n');
  let html = '';
  const meters = [];
  lines.forEach(line => {
    const match = line.match(/([\w\s]+):\s*(\d+)\/100/);
    if (match) {
      meters.push({ label: match[1].trim(), value: parseInt(match[2]) });
    }
  });

  if (meters.length) {
    html += '<div class="doom-meter">';
    meters.forEach(m => {
      const color = m.value > 70 ? 'var(--accent-red)' : m.value > 40 ? 'var(--accent-amber)' : 'var(--accent-green)';
      html += `<div class="doom-item">
        <div class="doom-label">${esc(m.label)}</div>
        <div class="doom-value" style="color:${color}">${m.value}</div>
        <div class="doom-bar"><div class="doom-bar-fill" style="width:${m.value}%;background:${color}"></div></div>
      </div>`;
    });
    html += '</div>';
  }

  html += `<div style="font-family:var(--font-mono);line-height:1.7;white-space:pre-wrap;">${esc(text)}</div>`;
  return html;
}

function renderRawView(container) {
  const drawer = document.createElement('div');
  drawer.className = 'raw-drawer';

  if (state.rawItems.length === 0) {
    drawer.innerHTML = '<div class="empty-state">No raw items yet.</div>';
  } else {
    // Source filter
    const filterDiv = document.createElement('div');
    filterDiv.style.display = 'flex';
    filterDiv.style.gap = '8px';
    filterDiv.style.marginBottom = '12px';
    filterDiv.style.flexWrap = 'wrap';

    const sourceIds = [...new Set(state.rawItems.map(i => i.sourceId))];
    const allBtn = document.createElement('button');
    allBtn.className = 'btn small';
    allBtn.textContent = 'All';
    allBtn.onclick = () => renderRawView(container);
    filterDiv.appendChild(allBtn);

    sourceIds.forEach(sid => {
      const s = state.sources.find(x => x.id === sid);
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.textContent = s ? s.name : sid;
      btn.onclick = () => {

      };
      filterDiv.appendChild(btn);
    });

    container.appendChild(filterDiv);
    renderRawItems(drawer, state.rawItems.slice(0, 100));

  container.appendChild(drawer);

function renderRawItems(container, items) {
  container.innerHTML = '';
  items.forEach(item => {

    div.className = 'raw-item';

window.triggerRefresh = async function() {

window.setAutoRefresh = function(minutes) {
  const mins = parseInt(minutes);
  state.autoRefreshMinutes = mins;
  if (state.autoRefreshTimer) {
    clearInterval(state.autoRefreshTimer);
    state.autoRefreshTimer = null;
  }
  if (mins > 0) {
    state.autoRefreshTimer = setInterval(() => {
      if (!state.isScanning) runFetch();
    }, mins * 60000);
    toast(`Auto-refresh every ${mins}m`, 'info');

    toast('Auto-refresh off', 'info');

};

window.exportSettings = async function() {
  const data = {
    sources: state.sources,
    settings: state.settings,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zeitcloud-settings.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Settings exported', 'success');
};

window.importSettings = async function(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.sources) {
      for (const s of data.sources) {
        await saveSource(s);
      }
    }
    if (data.settings) {
      for (const [k, v] of Object.entries(data.settings)) {
        await saveSetting(k, v);
      }
    }
    toast('Settings imported', 'success');
    renderCurrentView();
  } catch (e) {
    toast('Import failed: ' + e.message, 'error');
  }
};

window.processManualPaste = async function() {
  const text = document.getElementById('manual-paste').value.trim();
  if (!text) return;

  const run = {
    startedAt: Date.now(),
    status: 'running',
    sourceCount: 1,
    itemCount: 0,
    errorCount: 0
  };
  const runId = await state.db.fetchRuns.add(run);

  let items = [];
  if (text.startsWith('<')) {
    items = parseRSS(text, { id: 'manual', name: 'Manual Paste', weight: 1 });
  } else if (text.startsWith('{') || text.startsWith('[')) {
    try {
      const json = JSON.parse(text);
      items = parseGenericJSON(json, { id: 'manual', name: 'Manual Paste', weight: 1 });
    } catch (e) {
      // Plain text fallback
      items = text.split('\n').filter(l => l.trim()).map((l, i) => ({
        title: l.trim(),
        url: '',
        description: '',
        publishedAt: Date.now(),
        sourceId: 'manual',
        sourceName: 'Manual Paste',
        sourceWeight: 1,
        rawJson: { line: i }
      }));
    }
  } else {
    items = text.split('\n').filter(l => l.trim()).map((l, i) => ({
      title: l.trim(),
      url: '',
      description: '',
      publishedAt: Date.now(),
      sourceId: 'manual',
      sourceName: 'Manual Paste',
      sourceWeight: 1,
      rawJson: { line: i }
    }));
  }

  for (const item of items) {
    item.fetchRunId = runId;
    item.fetchedAt = Date.now();
    item.hash = hashString(item.title + item.sourceId);
    await state.db.rawItems.add(item);
    run.itemCount++;
  }

  run.completedAt = Date.now();
  run.status = 'ok';
  await state.db.fetchRuns.update(runId, run);
  await processTerms(runId);

  document.getElementById('manual-paste').value = '';
  toast(`Manual import: ${items.length} items`, 'success');
  await loadTerms();
  await loadRawItems();
  renderCurrentView();
};

window.purgeEliminatedTerms = async function() {
  if (!confirm('Purge all terms matching the current elimination list and stop words?')) return;
  const elimSet = new Set((state.settings.eliminationList || []).map(x => x.toLowerCase()));
  const all = await state.db.terms.toArray();
  let count = 0;
  for (const t of all) {
    const norm = (t.normalized || '').toLowerCase();
    if (STOP_WORDS.has(norm) || elimSet.has(norm)) {
      await state.db.terms.delete(t.id);
      count++;
    }
  }
  await loadTerms();
  renderCurrentView();
  toast(`Purged ${count} eliminated terms`, 'success');
};

window.fetchOpenRouterModels = async function() {
  const keyInput = document.getElementById('setting-key');
  const key = keyInput ? keyInput.value.trim() : (state.settings.openRouterKey || '');
  const statusEl = document.getElementById('model-fetch-status');

  if (!key) {
    if (statusEl) statusEl.textContent = 'Enter an API key first.';
    toast('Enter OpenRouter API key to fetch models', 'error');
    return;
  }

  if (statusEl) statusEl.textContent = 'Fetching models...';
  toast('Fetching models from OpenRouter...', 'info');

  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + key,
        'HTTP-Referer': location.origin,
        'X-Title': 'ZeitCloud'
      }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const models = (json.data || []).map(m => ({
      id: m.id,
      name: m.name || m.id,
      context_length: m.context_length,
      pricing: m.pricing
    }));

    await saveSetting('availableModels', models);
    await saveSetting('modelsFetchedAt', Date.now());
    populateModelSelect();

    if (statusEl) statusEl.textContent = `${models.length} models loaded`;
    toast(`${models.length} models fetched from OpenRouter`, 'success');
  } catch (e) {
    console.error('Model fetch failed:', e);
    if (statusEl) statusEl.textContent = 'Fetch failed: ' + e.message;
    toast('Model fetch failed: ' + e.message, 'error');
  }
};

function populateModelSelect() {
  const select = document.getElementById('setting-model-select');
  const customInput = document.getElementById('setting-model-custom');
  if (!select) return;

  const models = state.settings.availableModels || [];
  const currentModel = state.settings.aiModel || 'openai/gpt-4o-mini';

  // Build options
  let html = '';

  if (models.length === 0) {
    html += `<option value="${esc(currentModel)}">${esc(currentModel)} (cached)</option>`;
  } else {
    // Group by provider
    const byProvider = {};
    models.forEach(m => {
      const provider = m.id.split('/')[0] || 'Other';
      if (!byProvider[provider]) byProvider[provider] = [];
      byProvider[provider].push(m);
    });

    for (const [provider, list] of Object.entries(byProvider).sort((a, b) => a[0].localeCompare(b[0]))) {
      html += `<optgroup label="${esc(provider)}">`;
      list.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
      list.forEach(m => {
        const selected = m.id === currentModel ? ' selected' : '';
        const priceHint = m.pricing?.prompt ? ` ($${(m.pricing.prompt * 1e6).toFixed(2)}/M)` : '';
        html += `<option value="${esc(m.id)}"${selected}>${esc(m.name || m.id)}${priceHint}</option>`;
      });
      html += '</optgroup>';
    }
  }

  // Custom option
  const isCustom = models.length > 0 && !models.some(m => m.id === currentModel);
  html += `<option value="__custom__"${isCustom ? ' selected' : ''}>Custom / Other...</option>`;

  select.innerHTML = html;

  if (customInput) {
    customInput.style.display = isCustom ? 'block' : 'none';
    if (isCustom) customInput.value = currentModel;
  }

  select.onchange = () => {
    if (customInput) {
      customInput.style.display = select.value === '__custom__' ? 'block' : 'none';
      if (select.value === '__custom__') customInput.focus();
    }
  };
}

// ============================================================
// Utilities
// ============================================================

function stripThinking(text) {
  if (!text) return '';
  // Remove <thinking>...</thinking> and <reasoning>...</reasoning> blocks
  let cleaned = text.replace(/<thinking[^>]*>[\s\S]*?<\/thinking>/gi, '');
  cleaned = cleaned.replace(/<reasoning[^>]*>[\s\S]*?<\/reasoning>/gi, '');
  // Remove standalone thinking/reasoning tags
  cleaned = cleaned.replace(/<\/?thinking>/gi, '');
  cleaned = cleaned.replace(/<\/?reasoning>/gi, '');
  // Remove DeepSeek-style "analysis:" or "thinking:" preamble blocks
  cleaned = cleaned.replace(/^(?:analysis|thinking|reasoning|planning|internal monologue):[\s\S]*?(?=\n\n|\n[A-Z]|$)/gim, '');
  // Trim leading whitespace and blank lines
  cleaned = cleaned.replace(/^\s+\n+/m, '');
  return cleaned.trim();
}

function playCompletionChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.08, now + i * 0.08 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.4);
    });
    setTimeout(() => ctx.close(), 1000);
  } catch (e) {
    console.warn('Audio chime failed:', e);
  }
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function updateStatus(status) {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.className = 'status-dot ' + status;
  text.textContent = status === 'scanning' ? 'Scanning...' : status === 'active' ? 'Ready' : status === 'error' ? 'Error' : 'Idle';
}

function toast(message, type = 'info') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function applyTheme() {
  let theme = state.settings.theme || 'auto';
  if (theme === 'auto') {
    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
  const sel = document.getElementById('theme-select');
  if (sel) sel.value = state.settings.theme || 'auto';
}

window.setTheme = async function(theme) {
  await saveSetting('theme', theme);
  applyTheme();
};

// ============================================================
// Init
// ============================================================

async function init() {
  try {
    await initDb();
    await loadSettings();
    await loadSources();
    await loadTerms();
    await loadRawItems();
    await loadFetchRuns();

    // Restore UI state
    document.getElementById('region-select').value = state.settings.region || 'US';
    applyTheme();

    renderCurrentView();
    updateStatus(state.terms.length ? 'active' : 'idle');

    // Source count
    const enabled = getEnabledSourcesForRegion();
    document.getElementById('source-count').textContent = `${enabled.length}/${state.sources.length} sources`;

    toast('ZeitCloud initialized', 'success');
  } catch (e) {
    console.error('Init error:', e);
    toast('Init error: ' + e.message, 'error');
  }
}

// Handle resize for cloud
let resizeTimeout;
window.addEventListener('resize', () => {
  if (state.currentView === 'cloud') {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => renderWordCloud(), 300);
  }
});

// Close detail on escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

init();
</script>
